r Lola's counter.\n\t\tBrahim: The Grand Agimat. All four ritual inks, steady as you go!\n\t\t[signal arg=\"minigame:talisman:20\"]\n\t\tif {Transaction_MinigameWon}:\n\t\t\tBrahim: Masterwork! Even my old UC Baguio dean would give that a standing ovation!\n\t\telse:\n\t\t\tBrahim: A few bold strokes on the outer ring, and it still hums warm as a hearth!\n\t\tBrahim: When Reyna Mayari weighs Karimlan's ledger, this albularyo stands right beside your counter, friend.\n\telif {Transaction_Tally} >= 1.0:\n\t\t[signal arg=\"outcome:steady_apprentice\"]\n\t\tBrahim: Still apprenticing at Tatay's pace, and loving every step of it. No rush to graduate!\n\t\tBrahim: Brought a Grand Agimat blank so we can ward your threshold together. Ready, lab partner?\n\t\t[signal arg=\"minigame:talisman:20\"]\n\t\tif {Transaction_MinigameWon}:\n\t\t\tBrahim: Crisp lines all the way through! Your counter is in good hands.\n\t\telse:\n\t\t\tBrahim: Good effort on a tricky sigil! Still plenty warm enough to guard Lola's wood.\n\t\tBrahim: Salamat for keeping this little shop open for all of us.\n\telse:\n\t\t[signal arg=\"outcome:textbook_herbalist\"]\n\t\tBrahim: I have Tatay's herbal notes organized neatly now. Practical work, steady results.\n\t\tBrahim: Here is a threshold ward for your counter, if you want to help trace it.\n\t\t[signal arg=\"minigame:talisman:20\"]\n\t\tif {Transaction_MinigameWon}:\n\t\t\tBrahim: Clean geometry. That should keep drafts off your shelves.\n\t\telse:\n\t\t\tBrahim: Close enough for a standard ward.\n\tBrahim: Let me pick up [color=#0f6e2f]{Transaction_ItemWants}[/color] for Tatay's table too.\n\n[end_timeline]\n\nlabel Talk\nBrahim: No rush at all. Still waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color].\n- Out of stock right now, Brahim.\n\tBrahim: No problem at all! I will swing back once Mario drops off a fresh crate.\n\t[signal arg=\"refuse_service\"]\n- Grabbing it right now!\n\tBrahim: Take your time, shopkeeper.\n[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tBrahim: Got that one, salamat! Still need [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever you are ready.\nelif {Variation} == 2.0:\n\tBrahim: Appreciate it! Just missing [color=#0f6e2f]{Transaction_ItemWants}[/color] to finish Tatay's list.\nelse:\n\tBrahim: One down, salamat. Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] too when you can.\n[end_timeline]\n\nlabel SubstituteItem\n[signal arg=\"flag:brahim_sub_rest=true\"]\n[signal arg=\"tally:+1\"]\nBrahim: Wait a second. I asked for coffee, and you handed me [color=#0f6e2f]{Transaction_SubstituteItemName}[/color]?\nBrahim: Haha, am I getting assigned mandatory hydration by my own storekeeper?\nBrahim: Point taken! I will put the notebook down and take a breather. Salamat, friend.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_StoryGouged}:\n\tBrahim: Whoa, steep markup on that one! Paying anyway, though Tatay is going to tease me about my budgeting.\nelse:\n\tif {Global_TipActive} == 1.0:\n\t\tBrahim: Keep the extra coins, shopkeeper! Good service deserves a tip.\n\telse:\n\t\tBrahim: Just what Tatay's kitchen needed. Salamat, friend!\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nBrahim: Close, though I think that is a different item! I was looking for [color=#0f6e2f]{Transaction_ItemWants}[/color].\n[end_timeline]\n", "purchase": "label Greeting\nif {Transaction_HasReactiveOpener}:\n\tBrahim: {Transaction_ReactiveOpener}\n\nset {Variation} = range(1,5).pick_random()\nif {Flag_BrahimTrueAlbularyo}:\n\tif {Variation} == 1.0:\n\t\tBrahim: Quick breather between house calls! Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color], friend.\n\telif {Variation} == 2.0:\n\t\tBrahim: Tatay's brass bell has kept me busy! Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n\telif {Variation} == 3.0:\n\t\tBrahim: Stopping by my favorite counter on the way from the creek. Sell me [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telse:\n\t\tBrahim: Fresh herbs sorted, porch swept. Just need [color=#0f6e2f]{Transaction_ItemWants}[/color] now.\nelif {Flag_BrahimSubRest}:\n\tif {Variation} == 1.0:\n\t\tBrahim: Staying hydrated like you ordered, professor's honor! Let me take [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telif {Variation} == 2.0:\n\t\tBrahim: Put the librito down for a proper break. Sell me [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n\telif {Variation} == 3.0:\n\t\tBrahim: Tatay sent me out for kitchen supplies. Hoping you have [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telse:\n\t\tBrahim: Easy pace on the walk over. Just picking up [color=#0f6e2f]{Transaction_ItemWants}[/color].\nelse:\n\tif {Variation} == 1.0:\n\t\tBrahim: Good walk over from the creek bridge! Could I get [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telif {Variation} == 2.0:\n\t\tBrahim: Taking a quick break from Tatay's herb shed. Sell me [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n\telif {Variation} == 3.0:\n\t\tBrahim: My fingers smell like boiled lagundi and ink. Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telse:\n\t\tBrahim: Quick errand for Tatay's kitchen. Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] when you can.\n[end_timeline]\n\nlabel Talk\nBrahim: No hurry at all! I am just picking up [color=#0f6e2f]{Transaction_ItemWants}[/color].\n- Out of stock right now, Brahim.\n\tBrahim: No worries! I will swing by again after Mario's next delivery.\n\t[signal arg=\"refuse_service\"]\n- Coming right up!\n\tBrahim: Salamat! Take your time.\n[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tBrahim: Got that one, salamat! Still need [color=#0f6e2f]{Transaction_ItemWants}[/color] too.\nelif {Variation} == 2.0:\n\tBrahim: Appreciate it. Just waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color] to finish up.\nelse:\n\tBrahim: One checked off the list! Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] when ready.\n[end_timeline]\n\nlabel Satisfy\nif {Global_TipActive} == 1.0:\n\tBrahim: Keep the extra change, friend! You earned it.\nelse:\n\tif {Transaction_SatisfyVar} < 34.0:\n\t\tBrahim: Just what we needed. Salamat, shopkeeper!\n\telif {Transaction_SatisfyVar} < 67.0:\n\t\tBrahim: Always a warm stop at Lola's counter. Take care!\n\telse:\n\t\tBrahim: Back to Tatay's porch I go. Salamat!\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Repayment\nBrahim: Here is the [color=#0f6e2f]{Transaction_RepaymentAmount}[/color] pesos I owe you. Salamat for trusting me!\n[signal arg=\"repay_debt\"]\n[end_timeline]\n\nlabel WrongItem\nBrahim: Almost! I was actually looking for [color=#0f6e2f]{Transaction_ItemWants}[/color], friend.\n[end_timeline]\n", "visit": "label Greeting\nif {Transaction_HasReactiveOpener}:\n\tBrahim: {Transaction_ReactiveOpener}\n\nif {Transaction_VisitVar} < 34.0:\n\tBrahim: Taking a quick walk from Tatay's porch. Brought a fresh bronze piece if you want to trace a talisman!\nelif {Transaction_VisitVar} < 67.0:\n\tBrahim: My brush hand is a bit stiff from sorting herbs. Care to co-inscribe a quick charm with me?\nelse:\n\tBrahim: Always calmer under your awning than grading bluebooks! Up for a quick talisman practice?\n- Sure, pass me the brush.\n\t[signal arg=\"minigame:talisman_random\"]\n\tif {Transaction_MinigameWon}:\n\t\tBrahim: Top marks again! Steady strokes like that make Tatay look twice. Salamat!\n\telse:\n\t\tBrahim: Haha, good warm-up! Every shaky line still teaches the wrist. Salamat for trying!\n- Hands are full right now, Brahim.\n\tBrahim: Totally fair! Catch your breath, I will save the ink for our next pass.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Smalltalk\nif {Transaction_VisitVar} < 34.0:\n\tBrahim: Remember to stretch your shoulders behind that counter. Old professor advice!\nelif {Transaction_VisitVar} < 67.0:\n\tBrahim: Tatay's lagundi tea smells extra strong past the creek. Better head back before it cools!\nelse:\n\tBrahim: Funny how a quiet street teaches you more than a whole semester of lectures. Ingat!\n[end_timeline]\n"}, "danilo": {"story": "label Greeting\nif {Transaction_HasReactiveOpener}:\n\tDanilo: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} == 0.0:\n\t# Chapter 1 — \"Front-Row Snacks\" (snack | 0 tallies — Normal tambay + 1 uncanny sight breadcrumb)\n\tDanilo: Uy, boss. I like the view. Best shade on the whole road. This here's my best view.\n\tDanilo: Name is Danilo. Figured I should buy [color=#0f6e2f]{Transaction_ItemWants}[/color] so I look like a paying regular.\n\tDanilo: Funny sight two blocks down, by the way. That tall horse guy just walked past the same mango tree four times.\n\t- Best view on the road, huh?\n\t\tDanilo: See? You get it. Front-row seat to Karimlan, plus crunchy snacks.\n\t- You saw two blocks past the bend?\n\t\tDanilo: I've got good eyesight, boss. Lots of carrots. Don't overthink it.\n\t- Long as you pay for snacks.\n\t\tDanilo: Fair enough! Coins right here, boss. Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2 — \"Girl by the Guardrail\" (bottle / snack | Inflection #1: +1 / +1 / -1)\n\t[signal arg=\"flag:danilo_saw_rosalyn=true\"]\n\tDanilo: Psst, boss. Saw a quiet floating girl in a tattered white dress out by the highway waiting shed earlier.\n\tDanilo: She reached out to steady herself on the guardrail, and her fingers passed straight through the metal.\n\tDanilo: Poor gal. I pretended not to see her though. Way above a snacking tambay's pay grade, boss. \n\t- Wait, you spotted that from here?\n\t\t[signal arg=\"tally:+1\"]\n\t\tDanilo: Lucky angle through the mist, boss. Just be gentle if she wanders under your bulb, ha?\n\t- Sounds like you actually care, Danilo.\n\t\t[signal arg=\"tally:+1\"]\n\t\tDanilo: Relax, boss, do not start rumors. I just hate watching someone walk the same road in circles.\n\t- Not our problem if she lingers.\n\t\t[signal arg=\"tally:-1\"]\n\t\tDanilo: Cold, boss. Guess I am not the only one staying off the clock.\n\tDanilo: Anyway, pass over [color=#0f6e2f]{Transaction_ItemWants}[/color]. Watching the street works up a thirst.\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3 — \"Fluorescent Glare\" (sachet -> allow_sub_cat:bottle | Inflection #2 — Earned Daligmata slip!)\n\tDanilo: Ow. Your storefront bulb is brutal, boss. Pounding straight behind my temples.\n\tDanilo: Hard to catch a break when you cannot shut all your eyes at once.\n\tDanilo: Uh, figure of speech! Cheap coffee talking. Saw that former professor by the creek checking his own pulse like finals week.\n\tDanilo: Hand over [color=#0f6e2f]{Transaction_ItemWants}[/color], boss. Need something to wake up.\n\t- [Swap to cold water for his headache.]\n\t\t[signal arg=\"allow_sub_cat:bottle\"]\n\t\tDanilo: Appreciate it, boss. Slide it over quick before the glare gets worse.\n\t- Your secret is safe here, Danilo.\n\t\t[signal arg=\"flag:danilo_eyes_known=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\tDanilo: Hah. Most people freak out at a slip like that. Keep the extra-eyes talk between us, boss.\n\t- Wait, what did you just say?!\n\t\t[signal arg=\"tally:-1\"]\n\t\tDanilo: Relax, boss, bad joke. Just pass my order so I can sit in the shade.\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4 — \"Clocking Back In\" (snack | Inflection #3: +2 / +1 / -1)\n\tif {Flag_DaniloEyesKnown}:\n\t\tDanilo: I know that look, boss. You want me to look past the highway bend for that floating girl.\n\telse:\n\t\tDanilo: Alright, boss, no point hiding it anymore. I am a Daligmata. I have eyes that see past the veil.\n\t\tDanilo: And I know that look. You want me to trace where that floating girl by the shed belongs.\n\tDanilo: That former professor by the creek has the prayers, sure, except mortal eyes cannot follow a soul across towns.\n\tDanilo: Opening full Daligmata sight hits like staring straight at welding sparks, boss. Gives me a brutal migraine.\n\tif {Flag_DaniloEyesKnown} or {Flag_BrahimLanternWard}:\n\t\t- Pair your sight with Brahim's lantern.\n\t\t\t[signal arg=\"flag:danilo_traced_tether=true\"]\n\t\t\t[signal arg=\"tally:+2\"]\n\t\t\tDanilo: Hah! A healer and a Daligmata working together, old-school style. Fine, boss, you win. I am clocking back in.\n\t\t- Just one look for her, Danilo.\n\t\t\t[signal arg=\"flag:danilo_traced_tether=true\"]\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\tDanilo: You fight dirty with that quiet stare, boss. Fine. One quick look past the bend, then straight back to my bench.\n\t\t- Stay on break then, boss.\n\t\t\t[signal arg=\"tally:-1\"]\n\t\t\tDanilo: Appreciate the out, boss. Still feels a little heavy leaving her out there, honestly.\n\telse:\n\t\t- Just one look for her, Danilo.\n\t\t\t[signal arg=\"flag:danilo_traced_tether=true\"]\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\tDanilo: You fight dirty with that quiet stare, boss. Fine. One quick look past the bend, then straight back to my bench.\n\t\t- Stay on break then, boss.\n\t\t\t[signal arg=\"tally:-1\"]\n\t\t\tDanilo: Appreciate the out, boss. Still feels a little heavy leaving her out there, honestly.\n\tDanilo: Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] first. Not doing soul-tracking on an empty stomach.\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5 — \"Welding Sparks\" (bottle | 0 tallies — Ten Payoff!)\n\tif {Flag_DaniloTracedTether}:\n\t\tDanilo: Pass me cold [color=#0f6e2f]{Transaction_ItemWants}[/color], boss. My forehead feels like I stared into welding sparks for an hour.\n\t\tDanilo: Worth it, though. Followed her silver thread two towns past the creek bridge.\n\t\tDanilo: Found a young schoolteacher named Lia lighting a white church candle beside a framed photo and menthol candy.\n\t\tDanilo: Tell the floating girl in the tattered white dress nobody is shivering under that shed waiting for her anymore.\n\t\t- Thank you, Danilo. Truly.\n\t\t\tDanilo: Relax, boss, do not get mushy on me. Just glad my eyes were good for something.\n\t\t- Go rest your eyes after this.\n\t\t\tDanilo: Way ahead of you. Cold bottle on the brow and zero street-watching for an hour.\n\telse:\n\t\tDanilo: Just grabbing [color=#0f6e2f]{Transaction_ItemWants}[/color], boss.\n\t\tDanilo: Kept glancing down toward the highway waiting shed anyway. My \"off the clock\" excuse feels pretty thin lately.\n\t\t- Never too late to care, Danilo.\n\t\t\tDanilo: Yeah. Maybe I will stop hiding behind jokes next time somebody needs a hand.\n\t\t- Take it easy, boss.\n\t\t\tDanilo: Always do, boss. Catch you from the shade.\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6 — \"Eyes on Your Corner\" (snack / can | Accumulated Tally Resolution!)\n\tDanilo: Highway bend is finally quiet, boss. Weird how calm the road looks once a lost soul gets her answer.\n\tif {Flag_DaniloTracedTether} and {Transaction_Tally} >= 3.0:\n\t\t[signal arg=\"outcome:watchful_ally\"]\n\t\tDanilo: Best part? I actually shut my eyes and slept five straight hours without a headache. First time in years.\n\t\tDanilo: Your counter did that, boss. When the Queen of Biringan weighs your ledger, every eye I have backs this shop.\n\telif {Transaction_Tally} >= 1.0:\n\t\t[signal arg=\"outcome:bench_regular\"]\n\t\tDanilo: Best awning shade and best snacks in Karimlan. I am keeping friendly watch on your corner, boss.\n\telse:\n\t\t[signal arg=\"outcome:distant_eyes\"]\n\t\tDanilo: Exact coins ready, boss. Keeping things simple and staying out of everyone's business.\n\tDanilo: Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] when you get a second.\n\n[end_timeline]\n\nlabel Talk\nDanilo: No rush, boss. Just waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color].\n- Out of stock right now, Danilo.\n\tDanilo: Sayang. I will grab a bench spot and catch you after Mario restocks.\n\t[signal arg=\"refuse_service\"]\n- Grabbing it right now!\n\tDanilo: Solid, boss. I am not going anywhere.\n[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tDanilo: Nice one, boss. Still missing [color=#0f6e2f]{Transaction_ItemWants}[/color] though.\nelif {Variation} == 2.0:\n\tDanilo: Got that! Just pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] too.\nelse:\n\tDanilo: Halfway there, boss. Still need [color=#0f6e2f]{Transaction_ItemWants}[/color].\n[end_timeline]\n\nlabel SubstituteItem\n[signal arg=\"flag:danilo_eyes_known=true\"]\n[signal arg=\"tally:+1\"]\nDanilo: Hold on. I asked for coffee, and you slid me ice-cold [color=#0f6e2f]{Transaction_SubstituteItemName}[/color]?\nDanilo: Ah, pressing that against my forehead actually kills the glare. Nobody ever looks out for the watcher, boss.\nDanilo: Alright, you caught me. A Daligmata sees too much, and bright bulbs hit every single eye at once. Keep it quiet, ha?\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_StoryGouged}:\n\tDanilo: Brave markup, boss! Paying anyway, though I saw that price jump from a block away.\nelse:\n\tif {Global_TipActive} == 1.0:\n\t\tDanilo: Keep the extra coins, boss. Worth it for the front-row shade.\n\telse:\n\t\tDanilo: Solid, boss. Salamat! Back to my corner post.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nDanilo: Easy, boss. My eyes might be tired, not blind. I asked for [color=#0f6e2f]{Transaction_ItemWants}[/color].\n[end_timeline]\n", "purchase": "label Greeting\nif {Transaction_HasReactiveOpener}:\n\tDanilo: {Transaction_ReactiveOpener}\n\nif {Global_RumorActive}:\n\tif {Global_RumorType} == 0.0:\n\t\tDanilo: Psst, boss. {Global_LastCustomer} just walked past looking busy. Street never sleeps, 'no?\n\telse:\n\t\tDanilo: Uy, boss. Saw {Global_LastCustomer} leave with {Global_LastItem}. Good taste.\n\nset {Variation} = range(1,5).pick_random()\nif {Flag_DaniloWatchfulAlly}:\n\tif {Variation} == 1.0:\n\t\tDanilo: Road is all clear, boss. Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color] for bench duty.\n\telif {Variation} == 2.0:\n\t\tDanilo: Eyes finally rested for once! Sell me [color=#0f6e2f]{Transaction_ItemWants}[/color], boss.\n\telif {Variation} == 3.0:\n\t\tDanilo: Front-row shade feels even better now. Grabbing [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telse:\n\t\tDanilo: Uy, boss. Fueling up the watch post with [color=#0f6e2f]{Transaction_ItemWants}[/color].\nelif {Flag_DaniloEyesKnown}:\n\tif {Variation} == 1.0:\n\t\tDanilo: Bulbs are calmer on my eyes this pass. Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color], boss.\n\telif {Variation} == 2.0:\n\t\tDanilo: Still off the clock, boss. Just grabbing [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telif {Variation} == 3.0:\n\t\tDanilo: Good breeze under your awning. Sell me [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telse:\n\t\tDanilo: Psst, boss. Slide over [color=#0f6e2f]{Transaction_ItemWants}[/color] before I lose my shade spot.\nelse:\n\tif {Variation} == 1.0:\n\t\tDanilo: Uy, boss. Buying [color=#0f6e2f]{Transaction_ItemWants}[/color] so I earn my awning shade.\n\telif {Variation} == 2.0:\n\t\tDanilo: Watching the street works up an appetite. Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telif {Variation} == 3.0:\n\t\tDanilo: Relax, boss, paying customer this pass. Grabbing [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telse:\n\t\tDanilo: Psst, boss. Let me snag [color=#0f6e2f]{Transaction_ItemWants}[/color] for the bench.\n\nif {Transaction_WantsDebt} == 1.0:\n\tDanilo: Ah, left my coins in my other pants, boss. Can we put this on the lista?\n\t- Sure, I will list it, Danilo.\n\t\t[signal arg=\"utang_accepted\"]\n\t\tDanilo: Lifesaver, boss. I will pay it back clean next pass.\n\t- Cash only this round, boss.\n\t\t[signal arg=\"utang_rejected\"]\n\t\tDanilo: Fair call. Let me dig around my jacket pocket instead.\n[end_timeline]\n\nlabel Talk\nDanilo: No hurry, boss. Still waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color].\n- Out of stock right now, Danilo.\n\tDanilo: Sayang. Catch you after Mario swings by, boss.\n\t[signal arg=\"refuse_service\"]\n- Coming right up!\n\tDanilo: Solid. I have all the time in the world.\n[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tDanilo: Nice one, boss. Still missing [color=#0f6e2f]{Transaction_ItemWants}[/color].\nelif {Variation} == 2.0:\n\tDanilo: Got that! Just slide over [color=#0f6e2f]{Transaction_ItemWants}[/color] too.\nelse:\n\tDanilo: Almost set, boss. Still need [color=#0f6e2f]{Transaction_ItemWants}[/color].\n[end_timeline]\n\nlabel Satisfy\nif {Global_TipActive} == 1.0:\n\tDanilo: Keep the extra coins, boss. Best shade in Karimlan.\nelse:\n\tif {Transaction_SatisfyVar} < 34.0:\n\t\tDanilo: Salamat, boss. See you from the corner!\n\telif {Transaction_SatisfyVar} < 67.0:\n\t\tDanilo: Solid trade. I will keep an eye on the road for ya.\n\telse:\n\t\tDanilo: Perfect. Catch you on the next pass, boss.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Repayment\nDanilo: Found those missing coins, boss. Here is [color=#0f6e2f]{Transaction_RepaymentAmount}[/color] pesos for my lista!\n[signal arg=\"repay_debt\"]\n[end_timeline]\n\nlabel WrongItem\nDanilo: Careful, boss. That is not [color=#0f6e2f]{Transaction_ItemWants}[/color]. Try again.\n[end_timeline]\n", "visit": "label Greeting\nif {Transaction_HasReactiveOpener}:\n\tDanilo: {Transaction_ReactiveOpener}\n\nif {Global_EventRumorActive}:\n\tDanilo: {Global_EventRumorText}\n\tDanilo: Keep that in mind, boss. Good business if you play it sharp.\n\t[signal arg=\"event_announced\"]\n\t[signal arg=\"story_success\"]\n\t[end_timeline]\nelif {Global_RumorActive}:\n\tif {Global_RumorType} == 0.0:\n\t\tDanilo: Psst, boss. Saw {Global_LastCustomer} pass the tricycle stand looking pretty busy.\n\telse:\n\t\tDanilo: Uy, boss. {Global_LastCustomer} walked off happy with {Global_LastItem}. Good call.\n\tDanilo: Anyway, just checking the street. Stay sharp, 'no?\nelse:\n\tif {Transaction_VisitVar} < 34.0:\n\t\tDanilo: Uy, boss. Just borrowing your awning shade for two minutes. Best view of the road.\n\telif {Transaction_VisitVar} < 67.0:\n\t\tDanilo: All quiet down by the creek bridge, boss. Folks sure love walking past your warm bulb.\n\telse:\n\t\tDanilo: Just a lazy tambay checking in, boss. Keep the cold bottles frosty, ha?\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Smalltalk\nif {Transaction_VisitVar} < 34.0:\n\tDanilo: All clear down the street, boss. Nothing weird except how good your snacks smell.\nelif {Transaction_VisitVar} < 67.0:\n\tDanilo: Good view of Karimlan from this bench. Stay sharp behind that counter, ha?\nelse:\n\tDanilo: Heading back to my shady post, boss. Holler if anyone gives you trouble.\n[end_timeline]\n"}, "rosalyn": {"story": "# Rosalyn (Kaperosa) - 6-Chapter Warm Mystery & Deduction Arc (Triangle B - Character #1)\n# Voice: Hushed, polite older-sister warmth (4-to-12 words). Iceberg subtext over literal ghost exposition.\n# Visuals: Pale floating girl in a tattered white dress with messy long hair (zero shawl/cardigan/sleeves).\n# Mechanic: Intangible (is_visit_only) Ch. 1-5; gated by Brahim & Danilo prerequisites; Ch. 6 First Purchase!\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tRosalyn: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} == 0.0:\n\t# Chapter 1: \"Under the Bulb\" (is_visit_only | 0 tallies - Silent first contact at the edge of the light)\n\tRosalyn: ...\n\t- Good day. Looking for something?\n\t- Step under the awning, miss.\n\t- [Wait quietly behind the counter.]\n\tRosalyn: ...\n\t- Light's warm here. No rush.\n\t- Take all the time you need.\n\tRosalyn: ...\n\t[signal arg=\"flag:rosalyn_seen=true\"]\n\t[signal arg=\"note:A pale girl in a tattered white dress stood silently at the edge of the bulb's light, staring past me toward the jars before slipping away.\"]\n\t[signal arg=\"story_success\"]\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2: \"Under the Floorboards\" (is_visit_only | Subtle intangibility mystery | +1 / 0 / -1)\n\tRosalyn: Good day, po. Sorry I hurried off last time.\n\tRosalyn: I only came across the road for two pieces from the front jar.\n\t- Let me get them for you.\n\t- Rough walk? Your hair's damp.\n\tRosalyn: Wait. Let me set my coins on the tray first.\n\tRosalyn: Oh.\n\tRosalyn: Strange. I thought I was holding them tight.\n\t- Did they roll under the counter?\n\t\tRosalyn: Heard a faint clink down under the boards, po.\n\t\tRosalyn: Must have slipped before I reached the tray.\n\t- Left your change back home?\n\t\tRosalyn: Could have sworn four coins were warm in my palm.\n\t\tRosalyn: My hands go numb whenever it rains.\n\t- Funny, nothing touched the tray.\n\t\tRosalyn: Sorry. I didn't mean to hold up your counter empty-handed.\n\tRosalyn: Better step out of your light so paying customers can pass.\n\t- Stay a bit. Counter's quiet anyway.\n\t\t[signal arg=\"flag:rosalyn_welcome=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Invited Rosalyn to linger under the warm bulb even after her coins vanished without touching the tray.\"]\n\t\tRosalyn: Even if I'm not buying anything?\n\t\t- Company's free under this awning.\n\t\t\tRosalyn: Salamat po. It's loud out by the asphalt.\n\t\t\tRosalyn: Funny. Someone else used to rest their palm on that exact corner of the wood.\n\t- Come back whenever you find them.\n\t\t[signal arg=\"flag:rosalyn_welcome=true\"]\n\t\tRosalyn: Opo. I'll hold onto them tighter next walk.\n\t\tRosalyn: Funny how the counter grain still has those old tally nicks on the corner.\n\t- Heard coins drop under the floorboards.\n\t\t[signal arg=\"tally:-1\"]\n\t\tRosalyn: Just loose gravel outside, po. Sorry for bothering you.\n\t[signal arg=\"story_success\"]\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3: \"The Step-Stool\" (Prereq: brahim >= 1 | Iceberg time-slip & Lola recognition | +1 / 0 / -1)\n\tRosalyn: Excuse me, po. Did you move the little wooden step-stool?\n\t- What wooden step-stool?\n\t\tRosalyn: Behind the counter, right by the empty bottle crates.\n\t- Haven't used that since I was small.\n\t\tRosalyn: Wait.\n\tRosalyn: There used to be a silver-haired lady here, with a small kid peeking over the candy jars.\n\t- That was my Lola's shop.\n\t\tRosalyn: You have her exact eyes when you squint at the shelves.\n\t- That little kid behind the jars was me.\n\t\tRosalyn: You were barely taller than the soda cases.\n\t\tRosalyn: Oh. It hasn't been a few hours at all, has it?\n\t- Plenty of shops look like this one.\n\t\tRosalyn: None with that chipped blue paint along the tray, po.\n\tRosalyn: I smelled boiled lagundi and kamangyan resin drifting from the creek bridge earlier.\n\tRosalyn: Does the new healer down there scatter salt along the road for people who overstay?\n\t- Nobody's chasing you off this street.\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Rosalyn realized years had passed since Lola ran this counter, and I promised nobody would drive her away before she remembers her errand.\"]\n\t\tif {Flag_DaniloSawRosalyn}:\n\t\t\tRosalyn: That quiet man lounging near your bench didn't shoo me away either.\n\t\tRosalyn: Salamat po. I only need a little longer to remember what I came for.\n\t- Brahim only tends to sick neighbors.\n\t\tRosalyn: Good. My chest tightened up the second I smelled the incense.\n\t- Maybe resting past the bridge is kinder.\n\t\t[signal arg=\"tally:-1\"]\n\t\tRosalyn: I tried walking past the bend, po. The fog always turns my feet back here.\n\t[signal arg=\"story_success\"]\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4: \"Four Pesos\" (Prereq: danilo >= 2 | 3-Step Grounded Deduction Puzzle! +2 / +1 / 0)\n\tRosalyn: The sound of your fridge humming brought part of it back, po.\n\tRosalyn: Heavy rain drumming on corrugated tin, and diesel trucks splashing water over a yellow curb.\n\tRosalyn: Nowhere to hide from the wind except one narrow bench.\n\t- The waiting shed by the highway bend?\n\t\tset {Variation} = 1.0\n\t\tRosalyn: Right before the guardrail curves into the trees. Opo.\n\t- The tricycle terminal near the plaza?\n\t\tset {Variation} = 0.0\n\t\tRosalyn: No tricycles were parked anywhere near us, po. Just open highway and the waiting shed.\n\t- The herb porch past the creek bridge?\n\t\tset {Variation} = 0.0\n\t\tRosalyn: Fast ten-wheelers were shaking the concrete, po. It was the highway waiting shed.\n\tRosalyn: Someone small was tucked on that bench, shivering and coughing every breath.\n\tRosalyn: I wrapped my dry handkerchief around her neck and promised I would run straight across and back.\n\t- Your little sister was waiting there?\n\t\tset {Variation} = {Variation} + 1.0\n\t\tRosalyn: Lia. Barely up to my elbow, holding her school bag over her knees.\n\t- A classmate caught in the downpour?\n\t\tRosalyn: Much smaller than my classmates, po. My baby sister, Lia.\n\t- A neighbor's kid from down the block?\n\t\tRosalyn: My own little sister, po. Lia always caught colds whenever the weather turned.\n\tRosalyn: I only had four loose peso coins left from school fare in my fist.\n\tRosalyn: Way short for clinic syrup, so I sprinted toward your Lola's yellow bulb, staring at that front jar.\n\t- Menthol candy to calm her cough?\n\t\tset {Variation} = {Variation} + 1.0\n\t\tRosalyn: Two green wrappers. Just enough to soothe her throat till the rain let up.\n\t- A fever tablet from the medicine rack?\n\t\tRosalyn: Four pesos couldn't cover tablets back then, po. Only two green menthol candies from the front jar.\n\t- Hot ginger salabat in a paper cup?\n\t\tRosalyn: Lola only kept jars out front, po. Two green menthol candies for Lia's cough.\n\tif {Variation} >= 3.0:\n\t\t[signal arg=\"flag:rosalyn_errand_known=true\"]\n\t\t[signal arg=\"tally:+2\"]\n\t\t[signal arg=\"note:Pieced together Rosalyn's last errand: leaving sick little Lia under the highway shed with four pesos for menthol candy from Lola's jar.\"]\n\telif {Variation} >= 2.0:\n\t\t[signal arg=\"flag:rosalyn_errand_known=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Helped Rosalyn recall running from the highway waiting shed toward Lola's counter for her little sister Lia.\"]\n\telse:\n\t\t[signal arg=\"note:Rosalyn remembered leaving her little sister Lia at the highway waiting shed while crossing for menthol candy.\"]\n\tRosalyn: High beams swung wide around the wet bend right as I stepped off the curb.\n\tRosalyn: Next thing I knew, the rain stopped hitting my shoulders, and I was standing here.\n\t- Scared Lia stayed out there waiting?\n\t\tRosalyn: Every time I try looking past the bridge, the mist goes white.\n\t- Someone here can check past the bend.\n\t\tRosalyn: Please, po. I told her not to move an inch until Ate came back.\n\t[signal arg=\"story_success\"]\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5: \"The Grain of the Wood\" (Prereq: brahim >= 4 AND danilo >= 4 | Warm Kishotenketsu Turn!)\n\tif {Flag_BrahimLanternWard}:\n\t\tRosalyn: Someone hung a small red lantern by the guardrail, po.\n\t\t- Brahim made it so the cold eases up.\n\t\t\tRosalyn: Smells like warm beeswax. For the first time, the headlights didn't blur my hands.\n\t\t- Did the highway fog finally clear?\n\t\t\tRosalyn: Gentle as a porch light, po. Walking here didn't ache at all.\n\telse:\n\t\tRosalyn: Someone sealed the guardrail with a heavy wind charm, po.\n\t\tRosalyn: Felt like walking against floodwater just to reach your awning.\n\t\t- Sorry. Glad you still made it here.\n\t\t\tRosalyn: Couldn't leave without hearing if anyone checked past the bridge.\n\tif {Flag_DaniloTracedTether}:\n\t\tRosalyn: That man from your bench walked up to the waiting shed earlier and actually looked me in the eye.\n\t\t- Danilo looked two towns past the bridge.\n\t\t\tRosalyn: Did he find anything, po?\n\t\t\t- Lia grew up safe. She's a teacher now.\n\t\t\t\tRosalyn: A teacher? Lia used to hide under the kitchen table whenever it was spelling time.\n\t\t\t\tRosalyn: She made it home out of that rain.\n\t\t\t- She leaves a candle and menthol candy.\n\t\t\t\tRosalyn: She isn't angry that Ate never came back across the road?\n\t\t\t\t- Never angry. She still remembers clearly.\n\t\t\t\t\tRosalyn: Two green wrappers beside a candle. That sounds just like Lia.\n\telse:\n\t\tRosalyn: Still couldn't see past the fog on the bridge, po.\n\t\t- Look how tall Lola's grandchild grew.\n\t\t\tRosalyn: Years and years, po.\n\t\t- Plenty of neighbors passed that shed with umbrellas.\n\t\t\tRosalyn: Nobody in Karimlan would leave a coughing kid alone on a bench.\n\t\tRosalyn: She isn't out there shivering in the rain anymore, is she?\n\t\t- Long home and grown up by now, Rosalyn.\n\t\t\tRosalyn: Thank goodness.\n\tRosalyn: Wait.\n\tRosalyn: Did you hear that just now?\n\t- Your knuckles just tapped the counter.\n\t- Sounded like solid wood.\n\tRosalyn: Rough grain, right under my fingertips. Didn't slip through at all.\n\tRosalyn: Give me one short walk back to the curb, po. I think I know where those four coins rolled.\n\t[signal arg=\"story_success\"]\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6: \"Two Green Wrappers\" (HER VERY FIRST REAL PURCHASE: candy! | Accumulated Tally Resolution)\n\tif ({Flag_RosalynErrandKnown} and ({Flag_BrahimLanternWard} or {Flag_DaniloTracedTether})) and {Transaction_Tally} >= 3:\n\t\t[signal arg=\"outcome:peaceful_anchor\"]\n\t\t[signal arg=\"note:Set solid coins on Lola's counter, left fresh sampaguita by the register, and finished her long-delayed errand in peace.\"]\n\t\tRosalyn: Listen to that clink on the tray, po. All four coins stayed flat.\n\t\t- Loud and clear, Rosalyn.\n\t\t\tRosalyn: I tucked a sprig of rain-washed sampaguita beside your register.\n\t\t- Steady hands at last.\n\t\t\tRosalyn: Left a little sampaguita flower by your coin dish, po.\n\t\tRosalyn: Funny. The highway bend stopped tugging at my heels on the walk over.\n\t\tRosalyn: I'd like to linger around your warm bulb a little longer, if nobody minds.\n\t\t- This awning's always open to you.\n\t\t\tRosalyn: Salamat po. If anyone cold from beyond the trees ever doubts this shop, I'll vouch for Lola's counter too.\n\t\t- Lola would have loved seeing this.\n\t\t\tRosalyn: Feels like finishing a promise to both of you, po.\n\t\tRosalyn: May I buy [color=#0f6e2f]{Transaction_ItemWants}[/color], please?\n\telif {Transaction_Tally} >= 1:\n\t\t[signal arg=\"outcome:lingering_guest\"]\n\t\t[signal arg=\"note:Found enough peace to set solid coins on Lola's wood and complete her first purchase.\"]\n\t\tRosalyn: Look, po. My coins stayed right on the wood this time.\n\t\t- Ready to finish that errand?\n\t\t\tRosalyn: Took me long enough to cross the street, po.\n\t\t- Glad the road feels calmer now.\n\t\t\tRosalyn: Your porch bulb always made it easy to find the way back.\n\t\tRosalyn: May I get [color=#0f6e2f]{Transaction_ItemWants}[/color], please?\n\telse:\n\t\t[signal arg=\"outcome:faint_echo\"]\n\t\t[signal arg=\"note:Steadied her hands long enough to complete her single errand at Lola's counter.\"]\n\t\tRosalyn: Coins stayed on the tray this time, po.\n\t\t- What can I get for you?\n\t\t\tRosalyn: Just finishing an old errand before I rest.\n\t\tRosalyn: [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n\t[end_timeline]\n\nlabel Talk\nRosalyn: No rush at all, po. Still hoping for [color=#0f6e2f]{Transaction_ItemWants}[/color].\n- Almost got it, Rosalyn.\n\t[end_timeline]\n- Sorry, we're out of stock right now.\n\tRosalyn: That's alright, po. Another quiet walk does me good.\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tRosalyn: Stayed right in my palm, po. Take your time.\nelif {Variation} == 2.0:\n\tRosalyn: Holding onto this one carefully. No rush, po.\nelse:\n\tRosalyn: Crinkles just like I remembered. Whenever you're ready, po.\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_StoryGouged}:\n\tRosalyn: Prices really climbed since Lola's days, po.\n\tRosalyn: Still worth every coin. Salamat po.\nelse:\n\tRosalyn: Cool wrapper, solid right in my palm. Errand's finally done.\n\tRosalyn: Salamat po.\n\tif {Global_TipActive}:\n\t\tRosalyn: Keep the extra coins toward your porch bulb, po.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nRosalyn: Sorry, po. I think I asked for a different wrapper.\n[end_timeline]\n", "purchase": "# Rosalyn - Unified Post-Arc Purchase Timeline (3-Slot Sandwich Pattern)\n# Unlocks ONLY after Chapter 6 (purchase_only_on_final_chapter = true).\n# Voice: Soft, polite, newly grounded warmth (4-to-11 words).\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tRosalyn: {Transaction_ReactiveOpener}\nelif {Global_HighPriceActive}:\n\tRosalyn: Everything costs way more than in Lola's day, po.\n\nif {Flag_RosalynAtPeace}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tRosalyn: Exact coins on the tray, po. May I get [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telif {Transaction_GreetingVar} < 50:\n\t\tRosalyn: Warm light drew me over again. [color=#0f6e2f]{Transaction_ItemWants}[/color], please?\n\telif {Transaction_GreetingVar} < 75:\n\t\tRosalyn: Still feels nice holding real wrappers. [color=#0f6e2f]{Transaction_ItemWants}[/color], po?\n\telse:\n\t\tRosalyn: Calm walk from the bridge. Could I buy [color=#0f6e2f]{Transaction_ItemWants}[/color]?\nelse:\n\tif {Transaction_GreetingVar} < 25:\n\t\tRosalyn: Good day, po. May I get [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telif {Transaction_GreetingVar} < 50:\n\t\tRosalyn: Coins stayed steady on the tray. [color=#0f6e2f]{Transaction_ItemWants}[/color], please?\n\telif {Transaction_GreetingVar} < 75:\n\t\tRosalyn: Focusing carefully, po. Could I have [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telse:\n\t\tRosalyn: Sorry to trouble you, po. [color=#0f6e2f]{Transaction_ItemWants}[/color], please?\n[end_timeline]\n\nlabel Talk\nRosalyn: No rush at all, po. Waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color].\n- Coming right up, Rosalyn.\n\t[end_timeline]\n- Sorry, we're out of stock.\n\tRosalyn: That's fine, po. I'll pass by next walk.\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tRosalyn: Got this one safely, po. Still [color=#0f6e2f]{Transaction_ItemWants}[/color].\nelif {Variation} == 2.0:\n\tRosalyn: Holding steady, po. Just [color=#0f6e2f]{Transaction_ItemWants}[/color] left.\nelse:\n\tRosalyn: Salamat po. Only [color=#0f6e2f]{Transaction_ItemWants}[/color] remaining.\n[end_timeline]\n\nlabel Satisfy\nif {Global_TipActive}:\n\tRosalyn: Extra coins to keep the porch bulb burning, po.\nelif {Transaction_SatisfyVar} < 34:\n\tRosalyn: Cool and solid in my hand. Salamat po.\nelif {Transaction_SatisfyVar} < 67:\n\tRosalyn: Didn't slip once. Thank you, po.\nelse:\n\tRosalyn: Salamat po. Keep warm behind the counter.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Repayment\nRosalyn: Brought the {Transaction_RepaymentAmount} pesos from your lista, po.\n- Thank you, Rosalyn.\n\t[signal arg=\"repay_debt\"]\n\tRosalyn: Salamat for trusting me with a tab, po.\n[end_timeline]\n\nlabel WrongItem\nRosalyn: Sorry, po. I think I asked for [color=#0f6e2f]{Transaction_ItemWants}[/color].\n[end_timeline]\n", "visit": "# Rosalyn - Unified Interactive Visit & Tambayan Smalltalk Timeline\n# Fires while intangible (Ch. 1-5) and while waiting on Brahim/Danilo prerequisites!\n# Voice: Hushed, gentle 4-to-11 word observations. Zero shawl/sleeves references.\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tRosalyn: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} < 6.0:\n\tRosalyn: ...\n\t- Standing out of the damp air?\n\t\tif {Transaction_VisitVar} < 50:\n\t\t\tRosalyn: Just borrowing a little warmth from the bulb, po.\n\t\telse:\n\t\t\tRosalyn: Quiet under your eaves when the trucks pass.\n\t- Quiet out along the bend?\n\t\tif {Transaction_VisitVar} < 50:\n\t\t\tRosalyn: Your store cat actually blinked right at me earlier.\n\t\telse:\n\t\t\tRosalyn: Keeping my hands tucked back so I don't bump the jars.\nelse:\n\tif {Transaction_VisitVar} < 34:\n\t\tRosalyn: Just enjoying the warm light under your awning, po.\n\telif {Transaction_VisitVar} < 67:\n\t\tRosalyn: Rain puddles look like little mirrors out by the curb.\n\telse:\n\t\tRosalyn: Good day, po. Nice seeing the shelves so full.\n\t- Stay as long as you like.\n\t\tRosalyn: Salamat po. Best corner on the road.\n\t- Peaceful walk over?\n\t\tRosalyn: Very light, po. No hurry anymore.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Smalltalk\nif {Transaction_Chapter} < 6.0:\n\tif {Transaction_VisitVar} < 34:\n\t\tRosalyn: Fridge hums softer than the old chest cooler Lola had.\n\telif {Transaction_VisitVar} < 67:\n\t\tRosalyn: Green candy wrappers still catch the yellow light nicely.\n\telse:\n\t\tRosalyn: Nice not being looked straight through for once, po.\nelse:\n\tif {Transaction_VisitVar} < 34:\n\t\tRosalyn: Wooden bench feels wonderfully solid under my palm now.\n\telif {Transaction_VisitVar} < 67:\n\t\tRosalyn: Fresh sampaguita always smells cleanest right after rain.\n\telse:\n\t\tRosalyn: Don't forget to rest your shoulders behind the counter, po.\n[end_timeline]\n"}, "reynamayari": {"story": "label Greeting\nif {Transaction_HasReactiveOpener}:\n\tReynaMayari: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} == 0.0:\n\t# Chapter 1 — \"Maria From Two Streets Over\" (candy | 0 tallies — Comedy & Disguise)\n\tReynaMayari: Good day, ordinary merchant. I am merely Maria from two streets over.\n\tReynaMayari: Sell me [color=#0f6e2f]{Transaction_ItemWants}[/color] from that shiny candy jar at once. Purely for official neighborhood errands.\n\t- Welcome, totally normal neighbor Maria.\n\t\tReynaMayari: Excellent. My mortal disguise is completely flawless. Not a soul suspects a thing.\n\t- Your Majesty, you are literally glowing.\n\t\tReynaMayari: Hush! I snuck out between two Council hearings just for sweets, and this mortal outfit is trying its best!\n\t- Sweet tooth acting up, Queen?\n\t\tReynaMayari: Slander. Biringan's silver kitchens simply fail to replicate cheap fruit sugar.\n\tReynaMayari: Do not breathe a word of this to your uncle. Just slide over [color=#0f6e2f]{Transaction_ItemWants}[/color], friend. I meant shopkeeper.\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2 — \"Balete Leaves in Sunlight\" (frozen / candy | Inflection #1: +1 / +1 / -1 — THE UTANG REVERSAL!)\n\tReynaMayari: Back for [color=#0f6e2f]{Transaction_ItemWants}[/color]. Keep the change, here is a crisp Biringan silver coin.\n\tReynaMayari: Wait. Why is it curling up brown? Oh, blast this mortal sunlight.\n\tReynaMayari: It turned into a dry balete leaf on your counter. How utterly mortifying.\n\tReynaMayari: Listen carefully. I left my mortal pesos in Biringan. Could you put [color=#0f6e2f]{Transaction_ItemWants}[/color] on your lista?\n\t- Sure. I will list Maria for utang.\n\t\t[signal arg=\"flag:mayari_owes_utang=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\tReynaMayari: Write Maria, not Her Majesty! Though I admit, having a sari-sari tab feels strangely thrilling.\n\t- On the house, Your Majesty.\n\t\t[signal arg=\"tally:+1\"]\n\t\tReynaMayari: A queen does not take charity. I will remember this kindness when I deal your next Moon Cards.\n\t- Cash only. Rules are rules.\n\t\t[signal arg=\"tally:-1\"]\n\t\tReynaMayari: Ruthless. Fine, I have crumpled twenty-peso bills from your own ledger tally in my clutch.\n\tReynaMayari: Hand over [color=#0f6e2f]{Transaction_ItemWants}[/color] before any neighbor sees that leaf.\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3 — \"The Black Rice Box\" (bottle -> allow_sub_cat:candy | Inflection #2: Journal Trapdoor + Substitution!)\n\tReynaMayari: No disguise jokes. Biringan's Silver Council caught me tilting your Moon Cards and granting rerolls.\n\tReynaMayari: Their Envoy left this black-lacquered box on my doorstep, addressed to Lola's grandchild.\n\tReynaMayari: Open it if you wish. Inside is Biringan's finest Black Rice, offered as a \"generous buyout\" for this shop.\n\t- No thanks. Black rice binds mortals.\n\t\t[signal arg=\"flag:mayari_refused_black_rice=true\"]\n\t\t[signal arg=\"tally:+2\"]\n\t\tReynaMayari: Word for word what your Lola told them thirty years ago. You actually read the old lore.\n\t- Looks fancy. Should I try some?\n\t\tReynaMayari: Hands off that box! One grain and the Silver Council owns your soul forever!\n\t\tReynaMayari: Honestly, mortal, do not scare me like that. I am burning that box myself.\n\t- Tell the Envoy this shop stays mine.\n\t\t[signal arg=\"flag:mayari_refused_black_rice=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\tReynaMayari: Good. Never eat a single grain offered by Biringan's Old Houses.\n\tReynaMayari: My nerves are frayed. Just sell me plain [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\t- [Slide her sweet candy instead.]\n\t\t[signal arg=\"allow_sub_cat:candy\"]\n\t\tReynaMayari: Hurry, please. The Envoy is still lurking near the creek bridge.\n\t- Coming right up, Your Majesty.\n\t\tReynaMayari: Thank you. At least one person on this street keeps their head cool.\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4 — \"The Silver Pact\" (snack | Inflection #3: +1 / +1 / -1 — THE REAL TRUTH OF LOLA'S PACT!)\n\tif {Flag_MayariOwesUtang}:\n\t\tReynaMayari: First, fifteen real mortal pesos. Cross \"Maria\" off your utang notebook immediately.\n\tReynaMayari: You deserve the truth before the Silver Council audits us. Your Lola never owed Biringan a loan.\n\tReynaMayari: Decades ago, my Council voted to seal Karimlan's border and pull every spirit away from mortals.\n\tReynaMayari: Your Lola marched to the balete gate, refused their Black Rice, and struck the Silver Pact with me instead.\n\tReynaMayari: Two thousand pesos in honest mortal coin, proving humans and folklore neighbors still need each other.\n\tReynaMayari: Now the Council wants a Charter Trial. How do you plan to answer them, shopkeeper?\n\t- Let Karimlan speak. Bring the neighbors.\n\t\t[signal arg=\"flag:mayari_trust_barangay=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\tReynaMayari: Bold. You think this noisy street will actually stand up to Biringan's Old Houses? I hope you are right.\n\t- Seal the ledger cleanly by their rules.\n\t\t[signal arg=\"tally:+1\"]\n\t\tReynaMayari: Practical and sharp. Even the stiffest aristocrat in Biringan cannot argue with a paid ledger.\n\t- You should have told me sooner.\n\t\t[signal arg=\"tally:-1\"]\n\t\tReynaMayari: Fair. Pride kept my mouth shut until the Envoy knocked.\n\tReynaMayari: Sell me [color=#0f6e2f]{Transaction_ItemWants}[/color]. Plotting against my own Council makes me hungry.\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5 — \"The Envoy's Omen\" (candy / snack | 0 tallies — Barangay Convergence Payoff!)\n\tReynaMayari: The Council's Envoy tried to drop a freezing Omen over Karimlan to make your shop look empty.\n\tif {Global_CompletedNeighborsCount} >= 3.0:\n\t\tReynaMayari: It failed completely. Your neighbors shoved the mist straight back past the creek!\n\t\tif {Flag_BrahimTrueAlbularyo}:\n\t\t\tReynaMayari: That young albularyo's brass wards were glowing like hearth fires along the road.\n\t\tif {Flag_KapQuitSmoking}:\n\t\t\tReynaMayari: The giant under the acacia just crossed his arms and stared the Envoy down.\n\t\tif {Flag_SmkLivingEmblem}:\n\t\t\tReynaMayari: And that golden rooster puffed its feathers so wide the Envoy nearly tripped into a puddle.\n\t\tif {Flag_RosalynAtPeace}:\n\t\t\tReynaMayari: Even the highway bend stayed warm and calm. I have never seen anything like it.\n\telse:\n\t\tReynaMayari: Yet your counter stayed open and busy anyway. The Envoy left muttering about stubborn mortals.\n\tReynaMayari: Before the Envoy returns to the Silver Spires, they demanded one proof of worth from your counter. What do we send?\n\t- A bag of humble sari-sari candy.\n\t\tReynaMayari: Let the Silver Council taste real sugar for once. Oh, I am definitely delivering that myself.\n\t- Exact change and a spotless receipt.\n\t\tReynaMayari: Cold, dignified merchant poise. That will sting their aristocratic pride nicely.\n\t- Tell them to visit for merienda.\n\t\tReynaMayari: Inviting Biringan's auditors to a wooden bench. Your Lola would have applauded that.\n\tReynaMayari: Now pass over [color=#0f6e2f]{Transaction_ItemWants}[/color]. I earned a snack after that spectacle.\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6 — \"Embassy of the Pale Moon\" (candy / frozen | Accumulated Tally Resolution!)\n\tReynaMayari: The Silver Council withdrew the audit. Karimlan's border stays open, permanently.\n\tif {Transaction_Tally} >= 3.0 and ({Flag_MayariRefusedBlackRice} or {Flag_MayariTrustBarangay}):\n\t\t[signal arg=\"outcome:queen_at_the_counter\"]\n\t\tReynaMayari: I named your little tindahan an official Embassy of Karimlan. No Old House can touch this street.\n\t\tReynaMayari: Take this Silver Peso of Biringan. I enchanted it myself so sunlight will never turn it into a leaf.\n\t\tReynaMayari: And yes, I am keeping the disguise for daytime candy runs. Less fuss on the street, shopkeeper.\n\telif {Transaction_Tally} >= 1.0:\n\t\t[signal arg=\"outcome:honored_charter\"]\n\t\tReynaMayari: Lola's Silver Pact stands honored. You proved this counter belongs to both worlds.\n\t\tReynaMayari: Keep my favorite jar stocked, shopkeeper. I am not giving up my daytime errands now.\n\telse:\n\t\t[signal arg=\"outcome:clean_ledger\"]\n\t\tReynaMayari: The Charter holds cleanly by the letter of our agreement. You ran a disciplined shop.\n\t\tReynaMayari: Our business stands settled with full respect.\n\tReynaMayari: Now then, real mortal pesos in hand. Sell me [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\n[end_timeline]\n\nlabel Talk\nReynaMayari: Still waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color], shopkeeper.\n- Out of stock right now, Your Majesty.\n\tReynaMayari: Unfortunate. Call your uncle and restock before my next daytime errand.\n\t[signal arg=\"refuse_service\"]\n- Grabbing it right now!\n\tReynaMayari: Take your time. I am merely \"Maria\" browsing the shelves.\n[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tReynaMayari: Good start. Still missing [color=#0f6e2f]{Transaction_ItemWants}[/color].\nelif {Variation} == 2.0:\n\tReynaMayari: That is one part handled. Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] too.\nelse:\n\tReynaMayari: Almost complete. I still need [color=#0f6e2f]{Transaction_ItemWants}[/color].\n[end_timeline]\n\nlabel SubstituteItem\n[signal arg=\"tally:+1\"]\nReynaMayari: Wait. I asked for water, and you slid me [color=#0f6e2f]{Transaction_SubstituteItemName}[/color].\nReynaMayari: You really think sweet candy solves a political crisis in Biringan?\nReynaMayari: Fine. Keep quiet and let me unwrap one. You are dangerously perceptive, shopkeeper.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_StoryGouged}:\n\tReynaMayari: Steep markup for a sovereign in disguise. I will pay it, though I am noting it.\nelse:\n\tif {Global_TipActive} == 1.0:\n\t\tReynaMayari: Keep the extra coins. A queen appreciates brisk, discreet service.\n\telse:\n\t\tReynaMayari: Splendid. Not a word of this visit to Uncle Mario, understood?\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nReynaMayari: That is not [color=#0f6e2f]{Transaction_ItemWants}[/color]. Check the jar again, shopkeeper.\n[end_timeline]\n", "purchase": "label Greeting\nif {Transaction_HasReactiveOpener}:\n\tReynaMayari: {Transaction_ReactiveOpener}\n\nset {Variation} = range(1,5).pick_random()\nif {Flag_MayariQueenAtCounter}:\n\tif {Variation} == 1.0:\n\t\tReynaMayari: Keep your voice low, shopkeeper. Slide me [color=#0f6e2f]{Transaction_ItemWants}[/color] before my Council notices the throne is empty.\n\telif {Variation} == 2.0:\n\t\tReynaMayari: Real mortal pesos, counted twice. Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color], and yes, I am staying to chat for a minute.\n\telif {Variation} == 3.0:\n\t\tReynaMayari: Biringan's silver banquets are spotless and dull. I would much rather have [color=#0f6e2f]{Transaction_ItemWants}[/color] from your counter.\n\telse:\n\t\tReynaMayari: Just ordinary Maria again, conducting vital research on [color=#0f6e2f]{Transaction_ItemWants}[/color].\nelse:\n\tif {Variation} == 1.0:\n\t\tReynaMayari: Strictly an unscheduled royal inspection. Also, sell me [color=#0f6e2f]{Transaction_ItemWants}[/color] while nobody is looking.\n\telif {Variation} == 2.0:\n\t\tReynaMayari: Act completely normal, shopkeeper. Just pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] for \"Maria.\"\n\telif {Variation} == 3.0:\n\t\tReynaMayari: Biringan requires a sample of mortal provisions. Specifically [color=#0f6e2f]{Transaction_ItemWants}[/color]. Purely official, of course.\n\telse:\n\t\tReynaMayari: Real pesos in hand, zero balete leaves. Sell me [color=#0f6e2f]{Transaction_ItemWants}[/color], quickly please.\n[end_timeline]\n\nlabel Talk\nReynaMayari: I am still waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color], shopkeeper.\n- Out of stock right now.\n\tReynaMayari: Empty? Truly tragic. Call your uncle soon, before my sweet tooth files a royal grievance.\n\t[signal arg=\"refuse_service\"]\n- Grabbing it right away!\n\tReynaMayari: Splendid. Take your time, I actually enjoy listening to your street chatter.\n[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tReynaMayari: Good. I still need [color=#0f6e2f]{Transaction_ItemWants}[/color] to complete my research.\nelif {Variation} == 2.0:\n\tReynaMayari: Halfway there. Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] as well, please.\nelse:\n\tReynaMayari: Almost done. Just add [color=#0f6e2f]{Transaction_ItemWants}[/color] before I head back.\n[end_timeline]\n\nlabel Satisfy\nif {Global_TipActive} == 1.0:\n\tReynaMayari: Keep the extra coins, shopkeeper. Consider it royal funding for your snack shelves.\nelse:\n\tif {Transaction_SatisfyVar} < 34.0:\n\t\tReynaMayari: Splendid. Remember, you only served \"Maria\" from two streets over.\n\telif {Transaction_SatisfyVar} < 67.0:\n\t\tReynaMayari: Exactly what I craved. Keep that jar stocked and do not overwork yourself, understood?\n\telse:\n\t\tReynaMayari: Cheap mortal sweets beat silver banquets every single time. See you soon, shopkeeper.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Repayment\nReynaMayari: Here are your [color=#0f6e2f]{Transaction_RepaymentAmount}[/color] pesos. Cross Maria off the lista cleanly.\n[signal arg=\"repay_debt\"]\n[end_timeline]\n\nlabel WrongItem\nReynaMayari: That is not [color=#0f6e2f]{Transaction_ItemWants}[/color]. Try again, shopkeeper.\n[end_timeline]\n", "visit": "label Greeting\nif {Transaction_HasReactiveOpener}:\n\tReynaMayari: {Transaction_ReactiveOpener}\n\nif {Transaction_VisitVar} < 34.0:\n\tReynaMayari: Just strolling past as ordinary Maria. Your dusty little awning is ten times warmer than my palace hall.\nelif {Transaction_VisitVar} < 67.0:\n\tReynaMayari: No ledger business right now. I simply slipped out of Biringan to watch your shop bustle in the sun.\nelse:\n\tReynaMayari: Biringan is spotless and terribly quiet. Honestly, your noisy street is much better company, shopkeeper.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Smalltalk\nif {Transaction_VisitVar} < 34.0:\n\tReynaMayari: Do not mind me. I am merely checking whether that top candy jar is still full. For official reasons.\nelif {Transaction_VisitVar} < 67.0:\n\tReynaMayari: Your regulars nod to \"Maria\" like I have lived down the road for years. I rather like that.\nelse:\n\tReynaMayari: Drink water, rest your shoulders, and keep the sweets stocked. That is a sovereign's order, not small talk.\n[end_timeline]\n"}, "_special": {"mayari_collect": "label Greeting\nlabel CollectionIntro\nif {Global_TallyRemaining} <= 0:\n\tjump SealedIntro\nif {Global_MayariMet} == false:\n\tjump DebutIntro\nset {Variation} = range(1,4).pick_random()\nif {Global_LedgerTier} >= 4.0:\n\t# Tier 4 (75-99%): Near-sealed, openly in the player's corner while acting stern\n\tif {Variation} == 1.0:\n\t\tReynaMayari: Only [color=#2d527c]{Global_TallyRemaining}[/color] pesos left on Lola's Silver Ledger.\n\t\tReynaMayari: Biringan's Council has stopped betting against you. Frankly, I am enjoying their silence. Minimum is [color=#2d527c]{Global_TallyMin}[/color] pesos.\n\telif {Variation} == 2.0:\n\t\tReynaMayari: The final stretch, shopkeeper. [color=#2d527c]{Global_TallyRemaining}[/color] pesos remain, and I expect you across the finish line.\n\t\tReynaMayari: Offer at least [color=#2d527c]{Global_TallyMin}[/color] pesos, and let us draw something generous.\n\telse:\n\t\tReynaMayari: Almost sealed. [color=#2d527c]{Global_TallyRemaining}[/color] pesos left, though I will miss having an official excuse to drop by.\n\t\tReynaMayari: Clear your throat? I said nothing. Minimum is [color=#2d527c]{Global_TallyMin}[/color] pesos.\nelif {Global_LedgerTier} >= 3.0:\n\t# Tier 3 (50-74%): Halfway, rigging the deck while acting regal\n\tif {Variation} == 1.0:\n\t\tReynaMayari: Past the halfway mark. [color=#2d527c]{Global_TallyRemaining}[/color] pesos remain on the ledger.\n\t\tReynaMayari: The Council asked why your Moon Cards keep rolling gold. I told them to mind their own spires. Minimum [color=#2d527c]{Global_TallyMin}[/color] pesos.\n\telif {Variation} == 2.0:\n\t\tReynaMayari: Your shelves look fuller every shift. Do not let that praise go to your head.\n\t\tReynaMayari: [color=#2d527c]{Global_TallyRemaining}[/color] pesos left of [color=#2d527c]{Global_TallyGoal}[/color]. Now enough waiting. Place at least [color=#2d527c]{Global_TallyMin}[/color] pesos on the wood.\n\telse:\n\t\tReynaMayari: Half the silver recorded in Biringan, and your candy jar is still well-stocked. Good.\n\t\tReynaMayari: [color=#2d527c]{Global_TallyRemaining}[/color] pesos to go. Minimum is [color=#2d527c]{Global_TallyMin}[/color] pesos.\nelif {Global_LedgerTier} >= 2.0:\n\t# Tier 2 (30-49%): Daylight Audience unlocked (deadpan denial of daytime candy runs)\n\tif {Variation} == 1.0:\n\t\tReynaMayari: Strictly Silver Ledger business right now. Do not mention the candies I bought earlier.\n\t\tReynaMayari: [color=#2d527c]{Global_TallyRemaining}[/color] pesos remain. I expect at least [color=#2d527c]{Global_TallyMin}[/color] pesos.\n\telif {Variation} == 2.0:\n\t\tReynaMayari: I noticed you restocked the sweet jar on the top shelf. Completely irrelevant to our audit, of course.\n\t\tReynaMayari: [color=#2d527c]{Global_TallyRemaining}[/color] pesos left on Lola's ledger. Minimum is [color=#2d527c]{Global_TallyMin}[/color] pesos.\n\telse:\n\t\tReynaMayari: Wipe that grin off your face, shopkeeper. Any resemblance to \"Maria\" is pure coincidence.\n\t\tReynaMayari: [color=#2d527c]{Global_TallyRemaining}[/color] of [color=#2d527c]{Global_TallyGoal}[/color] pesos remain. Set at least [color=#2d527c]{Global_TallyMin}[/color] pesos down.\nelif {Global_LedgerTier} >= 1.0:\n\t# Tier 1 (15-29%): First seal broken, secretly impressed\n\tif {Variation} == 1.0:\n\t\tReynaMayari: The first seal broke cleanly. You are far steadier than my court predicted.\n\t\tReynaMayari: [color=#2d527c]{Global_TallyRemaining}[/color] pesos remain. Minimum is [color=#2d527c]{Global_TallyMin}[/color] pesos, and use your reroll wisely.\n\telif {Variation} == 2.0:\n\t\tReynaMayari: Word travels fast past the balete tree. Half of Biringan expected you to fold by now. I knew better.\n\t\tReynaMayari: [color=#2d527c]{Global_TallyRemaining}[/color] pesos left. Set at least [color=#2d527c]{Global_TallyMin}[/color] pesos down.\n\telse:\n\t\tReynaMayari: Still standing behind the wood, shopkeeper. Good. Keep proving my Council wrong.\n\t\tReynaMayari: [color=#2d527c]{Global_TallyRemaining}[/color] pesos remain. At least [color=#2d527c]{Global_TallyMin}[/color] pesos, then draw your Moon Card.\nelse:\n\t# Tier 0 (0-14%): Early, brisk and regal\n\tif {Variation} == 1.0:\n\t\tReynaMayari: Shutters closed, coins ready. [color=#2d527c]{Global_TallyRemaining}[/color] of [color=#2d527c]{Global_TallyGoal}[/color] pesos remain.\n\t\tReynaMayari: I expect at least [color=#2d527c]{Global_TallyMin}[/color] pesos.\n\telif {Variation} == 2.0:\n\t\tReynaMayari: The Silver Ledger is open. [color=#2d527c]{Global_TallyRemaining}[/color] pesos remain on Lola's pact.\n\t\tReynaMayari: Offer at least [color=#2d527c]{Global_TallyMin}[/color] pesos, then face the Moon Cards.\n\telse:\n\t\tReynaMayari: Count carefully, shopkeeper. [color=#2d527c]{Global_TallyRemaining}[/color] pesos still stand on the ledger.\n\t\tReynaMayari: Minimum is [color=#2d527c]{Global_TallyMin}[/color] pesos. Decide your share.\n[signal arg=\"open_tally_offer\"]\n[wait time=\"0.5\"]\n[end_timeline]\n\nlabel DebutIntro\nReynaMayari: The candle by the counter is missing. Your Lola never forgot it once.\n- Who are you?\n\tReynaMayari: Reyna Mayari, Queen of Biringan. And you hold your grandmother's counter.\n- Are you a late customer?\n\tReynaMayari: Bold guess for a mortal. I am Mayari, Queen of Biringan.\n- You knew my Lola?\n\tReynaMayari: Better than most in Karimlan. I am Mayari of Biringan.\nReynaMayari: Your Lola signed a Silver Ledger with my city. [color=#2d527c]{Global_TallyGoal}[/color] pesos remain to seal it.\nReynaMayari: Each shift you pay, the moon answers with Favors for generosity, or Omens if you fall short.\nReynaMayari: Even a sharp shopkeeper can turn an Omen into profit. Place at least [color=#2d527c]{Global_TallyMin}[/color] pesos on the wood.\n[signal arg=\"open_tally_offer\"]\n[wait time=\"0.5\"]\n[end_timeline]\n\nlabel SealedIntro\nset {Variation} = range(1,5).pick_random()\nif {Variation} == 1.0:\n\tReynaMayari: No coins owed, Patron. Keep your register closed and pick a lunar Favor instead.\nelif {Variation} == 2.0:\n\tReynaMayari: The Silver Ledger rests sealed in Biringan, yet I still drop by to bless your shelves.\nelif {Variation} == 3.0:\n\tReynaMayari: Keep your earnings, shopkeeper. Let us simply pick which Favor watches over your counter next.\nelse:\n\tReynaMayari: Lola's pact is settled in full. Draw your Moon Card before you lock up.\n[signal arg=\"open_tally_offer\"]\n[wait time=\"0.5\"]\n[end_timeline]\n\nlabel Generous\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tReynaMayari: [color=#9a630a]{Global_TallyOffer}[/color] pesos. More than I asked, and only [color=#2d527c]{Global_TallyRemaining}[/color] left on the ledger.\n\tReynaMayari: Do not look so smug. I am only smiling because the arithmetic is tidy. Enjoy your Favor.\nelif {Variation} == 2.0:\n\tReynaMayari: Generous coin, shopkeeper. [color=#2d527c]{Global_TallyRemaining}[/color] pesos remain.\n\tReynaMayari: Keep that pace up and I can watch Biringan's stuffiest elders eat their words.\nelse:\n\tReynaMayari: [color=#9a630a]{Global_TallyOffer}[/color] pesos recorded in silver. Only [color=#2d527c]{Global_TallyRemaining}[/color] left.\n\tReynaMayari: Your Lola used to slide extra coins over with that exact same grin. Take a good Favor tonight.\n[signal arg=\"check_mayari_milestones\"]\n[end_timeline]\n\nlabel Success\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tReynaMayari: [color=#9a630a]{Global_TallyOffer}[/color] pesos recorded cleanly. [color=#2d527c]{Global_TallyRemaining}[/color] pesos remain.\n\tReynaMayari: Steady work, shopkeeper. Drink some water before you lock up. That is a royal decree, not concern.\nelif {Variation} == 2.0:\n\tReynaMayari: Fair coin, shopkeeper. [color=#2d527c]{Global_TallyRemaining}[/color] pesos left on Lola's ledger.\n\tReynaMayari: Keep your chin up and your candy jars stocked, and you will clear this pact yet.\nelse:\n\tReynaMayari: Exact and orderly. [color=#2d527c]{Global_TallyRemaining}[/color] pesos remain before the pact seals.\n\tReynaMayari: Not bad at all for a mortal counter.\n[signal arg=\"check_mayari_milestones\"]\n[end_timeline]\n\nlabel Shortfall\nlabel Angry\nif {Global_TallyOffer} <= 0:\n\tReynaMayari: Zero pesos on the wood? [color=#2d527c]{Global_TallyRemaining}[/color] pesos still stand unpaid.\n\tReynaMayari: Protocol forces my hand on an Omen, shopkeeper. Stock smart and bounce back next shift, understood?\nelse:\n\tReynaMayari: Only [color=#9a630a]{Global_TallyOffer}[/color] pesos. Short of the mark, with [color=#2d527c]{Global_TallyRemaining}[/color] remaining.\n\tReynaMayari: An Omen follows a light ledger, though a sharp shopkeeper can still squeeze profit out of bad weather. Do not fold on me now.\n[signal arg=\"check_mayari_milestones\"]\n[end_timeline]\n\nlabel MilestoneAlso\nReynaMayari: Oh, and do not lock the shutters just yet.\n[signal arg=\"check_mayari_milestones\"]\n[end_timeline]\n\nlabel Milestone_reroll_1\nReynaMayari: You broke the first seal, [color=#9a630a]Moon's Grace[/color].\nReynaMayari: Strictly under an obscure royal clerical clause, I am granting you one free [color=#9a630a]reroll[/color] every night.\nReynaMayari: Watching a bad draw ruin a good shopkeeper's shift irritates me. Use it well.\n[signal arg=\"check_mayari_milestones\"]\n[end_timeline]\n\nlabel Milestone_daytime_mayari\nReynaMayari: Thirty percent settled. You have unlocked [color=#9a630a]Daylight Audience[/color].\nReynaMayari: Expect me during business hours in plainclothes. Strictly to audit mortal commerce, obviously.\nReynaMayari: Keep that sweet candy jar full, and if you call me Your Majesty in front of neighbors, I will deny everything.\n[signal arg=\"check_mayari_milestones\"]\n[end_timeline]\n\nlabel Milestone_shifted_odds_reroll_2\nReynaMayari: Half the Silver Ledger paid. [color=#9a630a]Silver Favor[/color] is yours.\nReynaMayari: Listen closely. I stacked the lunar deck toward Favors for you and slipped a [color=#9a630a]second reroll[/color] under the table.\nReynaMayari: If Biringan's Council asks, the moon tilted on its own. Keep winning, shopkeeper.\n[signal arg=\"check_mayari_milestones\"]\n[end_timeline]\n\nlabel Milestone_rare_moon_odds\nReynaMayari: Two-thirds settled. You have earned the [color=#9a630a]Gilded Crescent[/color].\nReynaMayari: I unlocked Biringan's upper vault and slipped [color=#9a630a]rarer Moon Cards[/color] straight into your nightly draw.\nReynaMayari: Consider it a thank-you for keeping my favorite snacks stocked. Not that a Queen plays favorites.\n[signal arg=\"check_mayari_milestones\"]\n[end_timeline]\n\nlabel Milestone_twin_moons\nReynaMayari: Three-quarters honored. [color=#9a630a]Twin Moons[/color] is awake.\nReynaMayari: My Council called drafting [color=#9a630a]two Moon Cards[/color] a night excessive favoritism. I told them to audit me themselves.\nReynaMayari: Take up to two blessings every night from now on, shopkeeper. Let us finish this ledger in style.\n[signal arg=\"check_mayari_milestones\"]\n[end_timeline]\n\nlabel LedgerCleared\nReynaMayari: Every last peso on Lola's Silver Ledger, settled in full.\nif {Global_CompletedNeighborsCount} >= 6.0:\n\tReynaMayari: And look outside your awning. Half of Karimlan is standing along this road to vouch for Lola's counter.\n\tif {Flag_KapQuitSmoking}:\n\t\tReynaMayari: The giant under the acacia tossed his lighter and stood watch by your corner.\n\tif {Flag_AnaFlewAgain}:\n\t\tReynaMayari: Your karinderya neighbor took to the sky again, and left warm adobo on your wood.\n\tif {Flag_BrahimTrueAlbularyo}:\n\t\tReynaMayari: The young albularyo's brass bell and Grand Agimat hum straight through the mist.\n\tif {Flag_RosalynAtPeace}:\n\t\tReynaMayari: Even the highway bend went quiet once that last candy errand was finished.\n\tif {Flag_SmkLivingEmblem}:\n\t\tReynaMayari: A gilded rooster bowed by the creek so the whole street learned the Litao's name.\n\tif {Flag_PiloChampion}:\n\t\tReynaMayari: An old duwende and a seven-foot tikbalang brought sipa back to the half-court.\n\tReynaMayari: Biringan's Council cannot touch a street this alive. The Silver Pact is permanently sealed, friend.\nelif {Global_CompletedNeighborsCount} >= 2.0:\n\tReynaMayari: More than coin answered my ledger. A loyal circle of neighbors found warmth across your wood.\n\tif {Flag_KapQuitSmoking}:\n\t\tReynaMayari: The giant under the acacia breathes easier because of this counter.\n\tif {Flag_BrahimTrueAlbularyo}:\n\t\tReynaMayari: Your counter glows with a true albularyo's Grand Agimat.\n\tif {Flag_RosalynAtPeace}:\n\t\tReynaMayari: Even the highway bend rests quietly now.\n\tReynaMayari: The Silver Pact is sealed with honor. Keep your earnings from now on, shopkeeper.\nelse:\n\tReynaMayari: Clean numbers, exact coin, not a centavo short. Though the bench outside stayed quiet.\n\tReynaMayari: The Silver Pact is sealed by the letter of the law. Karimlan remains open beneath my watch.\n[signal arg=\"show_epilogue\"]\n[wait time=\"0.5\"]\n[end_timeline]\n\nlabel SealedOutro\nset {Variation} = range(1,5).pick_random()\nif {Variation} == 1.0:\n\tReynaMayari: Sealed in silver. Rest well, Patron.\nelif {Variation} == 2.0:\n\tReynaMayari: Wise choice. Lock the shutters and get some sleep, shopkeeper.\nelif {Variation} == 3.0:\n\tReynaMayari: Done. Keep the candy jar full in case I drop by during business hours.\nelse:\n\tReynaMayari: Your Favor is set. Lola would be grinning ear to ear right now.\n[end_timeline]\n", "papa_ulap": "# Papa Ulap - 88.7 Radyo Karimlan (Tawong Lipod Wind-Engkanto FM DJ)\n# Voice: Warm, musical, snappy Filipino community FM DJ broadcasting from above the mango canopy.\n# Syncs: 2-phase daily schedule (before_noon / after_noon) + live {Global_RadioTimeCheck} + folklore trivia + commercials + world news.\n# Rules: Zero em-dashes. Zero ellipses. Zero [pause] tags. Zero [b] tags. Zero faded blue color walls.\n\nlabel EventBroadcast\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tPapaUlap: Timecheck on 88.7 Radyo Karimlan, {Global_RadioTimeCheck}! Fresh barangay bulletin riding the wind!\nelif {Variation} == 2.0:\n\tPapaUlap: Turn that dial up, mga kapitbahay! {Global_RadioTimeCheck} news flash straight from above the roofs!\nelse:\n\tPapaUlap: Papa Ulap breaking in at {Global_RadioTimeCheck} with a live street advisory!\nPapaUlap: {Global_RadioEventName}! {Global_EventRumorText}\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tPapaUlap: Stock smart and mind your tags, suki! Keep it breezy behind that counter!\nelif {Variation} == 2.0:\n\tPapaUlap: You heard it first on 88.7! Stay sharp and keep your coin jar ready!\nelse:\n\tPapaUlap: That is the word on the wind, mga ka-tindahan! Back to the music!\n[signal arg=\"radio_event_revealed\"]\n[end_timeline]\n\nlabel VisitorBroadcast\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tPapaUlap: 88.7 Street Watch at {Global_RadioTimeCheck}! Just spotted {Global_RadioVisitorName} out and about in Karimlan!\nelif {Variation} == 2.0:\n\tPapaUlap: Weather and foot traffic from the clouds, ka-barangay! {Global_RadioVisitorName} was just seen cutting down the main road!\nelse:\n\tPapaUlap: Rooftop radar on 88.7 Radyo Karimlan! Looks like {Global_RadioVisitorName} is making rounds through the neighborhood today!\nPapaUlap: {Global_RadioVisitorHint}\n[signal arg=\"radio_visitor_revealed\"]\n[end_timeline]\n\nlabel Chatter\nif {Global_RadioEclipse}:\n\tset {Variation} = range(1,4).pick_random()\n\tif {Variation} function initState() {

  STATE.lastCustomer = ""; STATE.lastItem = "";
  for (const c of BUNDLE.characters) {
    STATE.chapters[c.id] = 0;
    STATE.tallies[c.id] = 0;
    STATE.outcomes[c.id] = "";
    STATE.debts[c.id] = 0;
  }
  saveLocal();
}

function saveLocal() {
  try { localStorage.setItem("ssk_vn_sim_v1", JSON.stringify(STATE)); } catch (e) {}
}
function loadLocal() {
  try {
    const raw = localStorage.getItem("ssk_vn_sim_v1");
    if (raw) { Object.assign(STATE, JSON.parse(raw)); return true; }
  } catch (e) {}
  return false;
}
if (!loadLocal()) initState();

function resetState() {
  initState();
  closeModals();
  showToast("Progress reset to Day 1!");
  renderIdle();
}

// ── Structured AST DTL Parser & Frame-Stack Interpreter ──────────────────

function parseDTLToLabels(text) {
  const rawLines = text.split(/\r?\n/);
  const flat = [];
  for (let i = 0; i < rawLines.length; i++) {
    const raw = rawLines[i];
    const trimmed = raw.trim();
    if (!trimmed || trimmed.startsWith("#")) continue;
    let indent = 0;
    while (indent < raw.length && raw[indent] === "\t") indent++;
    flat.push({ indent, text: trimmed });
  }

  function parseBlock(startIdx, minIndent) {
    const stmts = [];
    let i = startIdx;
    while (i < flat.length) {
      const cur = flat[i];
      if (cur.indent < minIndent) break;
      const t = cur.text;
      if (cur.indent === 0 && t.startsWith("label ")) break;

      if (t.startsWith("if ") && t.endsWith(":")) {
        const ind = cur.indent;
        const branches = [];
        let cond = t.slice(3, -1).trim();
        let res = parseBlock(i + 1, ind + 1);
        branches.push({ cond, body: res.stmts });
        i = res.nextIdx;
        while (i < flat.length && flat[i].indent === ind) {
          const nt = flat[i].text;
          if (nt.startsWith("elif ") && nt.endsWith(":")) {
            cond = nt.slice(5, -1).trim();
            res = parseBlock(i + 1, ind + 1);
            branches.push({ cond, body: res.stmts });
            i = res.nextIdx;
          } else if (nt === "else:") {
            res = parseBlock(i + 1, ind + 1);
            branches.push({ cond: null, body: res.stmts });
            i = res.nextIdx;
            break;
          } else {
            break;
          }
        }
        stmts.push({ type: "if_chain", branches });
        continue;
      }

      if (t.startsWith("- ")) {
        const ind = cur.indent;
        const options = [];
        while (i < flat.length && flat[i].indent === ind && flat[i].text.startsWith("- ")) {
          const label = flat[i].text.slice(2).trim();
          const res = parseBlock(i + 1, ind + 1);
          options.push({ label, body: res.stmts });
          i = res.nextIdx;
        }
        stmts.push({ type: "choices", options });
        continue;
      }

      if (t === "[end_timeline]") {
        stmts.push({ type: "end" });
      } else if (t.startsWith("[wait ")) {
        // ignore wait timers in VN sim
      } else if (t.startsWith("jump ")) {
        stmts.push({ type: "jump", target: t.slice(5).trim() });
      } else if (t.startsWith("set ")) {
        const m = t.match(/^set\s+\{([^}]+)\}\s*=\s*range\((\d+),\s*(\d+)\)\.pick_random\(\)/);
        if (m) stmts.push({ type: "set_rand", varName: m[1].trim(), lo: parseInt(m[2], 10), hi: parseInt(m[3], 10) });
      } else if (t.startsWith("[signal ")) {
        const m = t.match(/arg="([^"]+)"/);
        if (m) stmts.push({ type: "signal", arg: m[1] });
      } else {
        const colon = t.indexOf(":");
        if (colon > 0 && !t.startsWith("[")) {
          stmts.push({ type: "line", speaker: t.slice(0, colon).trim(), text: t.slice(colon + 1).trim() });
        }
      }
      i++;
    }
    return { stmts, nextIdx: i };
  }

  const labels = {};
  let i = 0;
  while (i < flat.length) {
    if (flat[i].indent === 0 && flat[i].text.startsWith("label ")) {
      const aliases = [];
      while (i < flat.length && flat[i].indent === 0 && flat[i].text.startsWith("label ")) {
        aliases.push(flat[i].text.slice(6).trim());
        i++;
      }
      const res = parseBlock(i, 0);
      for (const a of aliases) labels[a] = res.stmts;
      i = res.nextIdx;
    } else {
      const res = parseBlock(i, 0);
      if (!labels["__root__"]) labels["__root__"] = res.stmts;
      i = res.nextIdx;
    }
  }
  return labels;
}
