<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sari-Saring Katha — Mobile VN Dialogue Simulator</title>
<style>
  :root {
    --bg: #120f0c;
    --panel: #1b1612;
    --panel-2: #241d17;
    --gold: #d59f47;
    --gold-bright: #ffe294;
    --cream: #fff5e4;
    --muted: #b8a995;
    --green: #7ec292;
    --red: #e0635a;
    --border: rgba(213, 159, 71, 0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .app {
    display: flex; flex-direction: column; height: 100dvh; max-width: 640px; margin: 0 auto;
    background: radial-gradient(circle at top, #282018 0%, var(--bg) 65%);
  }
  /* Top HUD */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; background: rgba(15, 12, 10, 0.92); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .hud-stats { font-size: 12px; color: var(--gold-bright); font-weight: 600; line-height: 1.35; }
  .hud-stats span { color: var(--muted); font-weight: 400; }
  .top-btns { display: flex; gap: 6px; }
  .pill-btn {
    background: var(--panel-2); color: var(--cream); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .pill-btn.gold { background: #3e2e16; color: var(--gold-bright); border-color: var(--gold); }
  .pill-btn:active { transform: scale(0.97); }

  /* Stage */
  .stage {
    flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px; gap: 10px; overflow-y: auto; position: relative;
  }
  .char-card {
    margin: auto 0; text-align: center; padding: 14px 12px;
    background: rgba(27, 22, 18, 0.72); border: 1px solid var(--border); border-radius: 14px;
  }
  .avatar {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; color: #120f0c;
    border: 3px solid var(--gold); box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  .char-title { font-size: 18px; font-weight: 700; color: var(--gold-bright); }
  .char-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .order-pill {
    display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px;
    background: rgba(126, 194, 146, 0.16); border: 1px solid var(--green);
    color: var(--green); font-size: 12px; font-weight: 600;
  }

  /* Log toast */
  .toast {
    font-size: 11px; color: var(--gold-bright); background: rgba(62, 46, 22, 0.9);
    border: 1px solid var(--gold); border-radius: 8px; padding: 6px 10px; text-align: center;
  }

  /* Gameplay Debug Bar */
  .action-bar {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px;
    background: #171310; border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .act-btn {
    flex: 1 1 auto; min-width: 92px; padding: 9px 10px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--cream);
    font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .act-btn.primary { background: #2c4a35; border-color: var(--green); color: #e8ffef; }
  .act-btn.sub { background: #4b3818; border-color: var(--gold-bright); color: var(--gold-bright); }
  .act-btn.warn { background: #4a2320; border-color: var(--red); color: #ffd9d6; }
  .act-btn:active { transform: scale(0.97); }

  /* Dialogue Box */
  .dialogue-wrap {
    padding: 12px; background: #14100d; border-top: 2px solid var(--gold); flex-shrink: 0;
  }
  .speaker {
    font-size: 13px; font-weight: 800; letter-spacing: 0.4px; margin-bottom: 4px;
    text-transform: uppercase;
  }
  .text-box {
    min-height: 76px; font-size: 16px; line-height: 1.45; color: var(--cream);
    cursor: pointer; user-select: none; padding: 4px 0 8px;
  }
  .tap-hint { font-size: 11px; color: var(--muted); text-align: right; }
  .choices { display: flex; flex-direction: column; gap: 7px; margin-top: 8px; }
  .choice-btn {
    width: 100%; text-align: left; padding: 11px 13px; border-radius: 10px;
    background: var(--panel-2); color: var(--gold-bright); border: 1px solid var(--gold);
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .choice-btn:active { background: #3c2e1c; }

  /* Modal / Drawer */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 14px;
  }
  .overlay.open { display: flex; }
  .modal {
    width: 100%; max-width: 520px; max-height: 86dvh; overflow-y: auto;
    background: var(--panel); border: 2px solid var(--gold); border-radius: 14px;
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .modal h3 { margin: 0; color: var(--gold-bright); font-size: 18px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-row {
    display: flex; justify-content: space-between; font-size: 13px; padding: 6px 8px;
    background: var(--panel-2); border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);
  }
  .shake { display: inline-block; animation: shk 0.25s infinite; }
  @keyframes shk {
    0% { transform: translate(0,0); } 25% { transform: translate(1px,-1px); }
    50% { transform: translate(-1px,1px); } 75% { transform: translate(1px,1px); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="hud-stats" id="hudStats">Day 1 · Ledger ₱0 / ₱2000</div>
    <div class="top-btns">
      <button class="pill-btn gold" onclick="openPicker()">Cast</button>
      <button class="pill-btn" onclick="openDebug()">Debug</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="char-card" id="charCard">
      <div class="avatar" id="avatar">?</div>
      <div class="char-title" id="charTitle">Sari-Saring Katha VN Sim</div>
      <div class="char-meta" id="charMeta">Tap "Next Random Customer" below to begin!</div>
      <div class="order-pill" id="orderPill" style="display:none"></div>
    </div>
    <div class="toast" id="toast" style="display:none"></div>
  </div>

  <div class="action-bar" id="actionBar"></div>

  <div class="dialogue-wrap">
    <div class="speaker" id="speaker" style="color: var(--gold-bright)">SYSTEM</div>
    <div class="text-box" id="textBox" onclick="onTapDialogue()">Welcome! Tap Next Random Customer, or open Cast to jump into any character's story.</div>
    <div class="choices" id="choices"></div>
    <div class="tap-hint" id="tapHint">Tap text to continue</div>
  </div>
</div>

<!-- Dynamic Prompt Modal (Minigame / Tally / Epilogue) -->
<div class="overlay" id="promptOverlay">
  <div class="modal" id="promptModal"></div>
</div>

<!-- Cast Picker Modal -->
<div class="overlay" id="pickerOverlay" onclick="if(event.target===this) closeModals()">
  <div class="modal">
    <h3>Pick Customer / Event</h3>
    <div class="grid-2" id="pickerGrid"></div>
    <button class="act-btn sub" onclick="startNightlyMayari(); closeModals();">🌙 Nightly Reyna Mayari</button>
    <button class="act-btn" onclick="startSpecial('papa_ulap','Chatter','Papa Ulap'); closeModals();">📻 Papa Ulap Radio</button>
    <button class="act-btn" onclick="startSpecial('mario_tutorial','Greeting','Uncle Mario'); closeModals();">🛵 Uncle Mario Tutorial</button>
    <button class="pill-btn" onclick="closeModals()">Close</button>
  </div>
</div>

<!-- Debug Inspector Modal -->
<div class="overlay" id="debugOverlay" onclick="if(event.target===this) closeModals()">
  <div class="modal">
    <h3>Debug State & Shortcuts</h3>
    <div class="grid-2">
      <button class="act-btn sub" onclick="addLedger(600)">+₱600 (30% Mayari)</button>
      <button class="act-btn primary" onclick="addLedger(2000)">Seal Ledger (₱2000)</button>
      <button class="act-btn" onclick="showEpilogueModal()">Preview Epilogue</button>
      <button class="act-btn warn" onclick="resetState()">Reset All Progress</button>
    </div>
    <div id="debugBody" style="display:flex;flex-direction:column;gap:6px;"></div>
    <button class="pill-btn" onclick="closeModals()">Close</button>
  </div>
</div>

<script>
const BUNDLE = {"characters": [{"id": "kuyakap", "name": "Kuya Kap", "folder": "Kuyakap", "color": "#d49b54", "cats": ["cigarette", "bottle", "candy"], "prereqs": {"3": [["manangana", 2]]}}, {"id": "manangana", "name": "Manang Ana", "folder": "ManangAna", "color": "#e07a5f", "cats": ["can", "frozen", "pack"], "prereqs": {"3": [["kuyakap", 2]], "4": [["buboy", 4]]}}, {"id": "buboy", "name": "Buboy", "folder": "Buboy", "color": "#81b29a", "cats": ["snack", "candy", "can"], "prereqs": {"4": [["kuyakap", 3]]}}, {"id": "lolopilo", "name": "Lolo Pilo", "folder": "LoloPilo", "color": "#f2cc8f", "cats": ["candy", "snack", "sachet"], "prereqs": {}}, {"id": "tk", "name": "T.K.", "folder": "TK", "color": "#6cb2eb", "cats": ["bottle", "snack", "pack"], "prereqs": {}}, {"id": "rodel", "name": "Rodel", "folder": "Rodel", "color": "#4ea8de", "cats": ["bottle", "can", "frozen"], "prereqs": {"1": [["sarimanok", 2]], "2": [["sarimanok", 3]], "3": [["sarimanok", 4]], "4": [["sarimanok", 4]], "5": [["sarimanok", 5]]}}, {"id": "sarimanok", "name": "Sarimanok", "folder": "Sarimanok", "color": "#f6c90e", "cats": ["snack", "pack", "can"], "prereqs": {"1": [["rodel", 1]], "2": [["rodel", 2]], "3": [["rodel", 3]], "4": [["rodel", 4]], "5": [["rodel", 5]]}}, {"id": "brahim", "name": "Brahim", "folder": "Brahim", "color": "#7ec292", "cats": ["can", "sachet", "bottle"], "prereqs": {"3": [["rosalyn", 3]]}}, {"id": "danilo", "name": "Danilo", "folder": "Danilo", "color": "#b8a9c9", "cats": ["snack", "bottle", "sachet"], "prereqs": {"1": [["rosalyn", 1]], "3": [["rosalyn", 4]]}}, {"id": "rosalyn", "name": "Rosalyn", "folder": "Rosalyn", "color": "#cfe0f5", "cats": ["candy", "bottle"], "visit_until_final": true, "prereqs": {"2": [["brahim", 1]], "3": [["danilo", 2]], "4": [["brahim", 4], ["danilo", 4]]}}, {"id": "reynamayari", "name": "Reyna Mayari", "folder": "ReynaMayari", "color": "#c9b6ff", "cats": ["candy", "frozen", "bottle", "snack"], "collector": true, "prereqs": {}}], "items": {"cigarette": ["Champyon", "Marboro", "Mayti"], "candy": ["Mentor", "Pocha", "Chubs"], "bottle": ["Tubig", "Kokaloka", "C2"], "can": ["Argentita", "Cenchuree Tuna", "Mema"], "frozen": ["Tocino", "Hotdog", "Ice Candy"], "sachet": ["Kopimo", "Aryel"], "snack": ["Anoba", "Patos", "Dantes"], "pack": ["Pantit", "Lucky9"]}, "timelines": {"kuyakap": {"story": "# Kuya Kap - 6-Chapter Core Arc (Pilot Character #1)\n# Voice: Warm, homey Filipino \"elderly tito\" under the acacia. 100% spoken voice (zero narrator parentheses).\n# Rules: Zero time-of-day markers. Zero em-dashes. 6-16 word social-feed rhythm. Show via voice, never tell.\n# Substitute Category: candy ONLY (decided via dialogue choice -> allow_sub_cat:candy).\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tKuyaKap: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} == 0.0:\n\t# Chapter 1: \"The Old Suki\"\n\tKuyaKap: Aba. Mario wasn't exaggerating. Somebody really did open the shutters again.\n\tKuyaKap: Look at you, apo. Same height as your Lola behind that counter.\n\t- Hey, I'm not THAT short.\n\t\tKuyaKap: Haha! Fair enough. Half the barangay looks pocket-sized from up here.\n\t- Easy for a giant kapre to say, Kuya.\n\t\tKuyaKap: Haha! Fair enough. Half the barangay looks pocket-sized from up here.\n\tKuyaKap: Call me Kuya Kap. I've had that acacia across the road since Mario was in shorts.\n\t- Mario didn't mention the shorts part, Kuya.\n\t\tKuyaKap: Heh. Don't tell him I brought it up.\n\t\tKuyaKap: Anyway, good to hear footsteps inside this tindahan again, apo. This kanto felt too quiet.\n\t- I see. Are you gonna buy or just linger like a tambay, Kuya?\n\t\tKuyaKap: Aba, malakas! Definitely your Lola's grandchild.\n\t\tKuyaKap: She used to shoo me off the counter with a rag whenever I lingered too long.\n\t- [Settle back down and wipe the counter quietly.]\n\t\tKuyaKap: All business already, ha? Fair enough, you're still finding where she kept the jars.\n\t\tKuyaKap: Give it a week. Everyone on this road ends up chatting at this counter.\n\tKuyaKap: Anyway, pahingi nga ng [color=#0f6e2f]{Transaction_ItemWants}[/color], apo. My usual.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2: \"Tricycle Dust\" (Tally Inflection #1: +1 discreet / 0 lecture / -1 ignore)\n\tKuyaKap: O, apo. Pahingi ulit ng [color=#0f6e2f]{Transaction_ItemWants}[/color], ha.\n\tKuyaKap: Wait, sandali, [shake rate=18 level=7]Huff...koff.[/shake]\n\tKuyaKap: Tsk. Excuse me, apo. Those tricycles on the road really need their mufflers checked.\n\t- You sure it's the tricycles, Kuya?\n\t\tKuyaKap: Yep. I was never like this back in the old Balete days, you see. Now, it's all technology and stinking pollution.\n\t- Hope it's not Uncle Mario's trike smoking the streets.\n\t\tKuyaKap: Haha! Your uncle's tricycle may be old, but he takes good care of it. It's his only child!\n\tKuyaKap: Teka. Something slipped out with my coins, my bad. Let me get it.\n\t- [Slide the folded paper back.]\n\t\t[signal arg=\"flag:kap_clinic_known=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Quietly returned the slip he dropped while coughing.\"]\n\t\tKuyaKap: Salamat, nak. Didn't even peek, ha? Good trait for a storekeeper.\n\t\tKuyaKap: Nothing to fuss about anyway. \n\t- [Glance at the yellow slip.]\n\t\t[signal arg=\"flag:kap_clinic_known=true\"]\n\t\t[signal arg=\"note:Spotted his barangay clinic slip; he blamed an overeager young doctor.\"]\n\t\tKuyaKap: Oy, sharp eyes! It's just a barangay clinic slip, 'nak.\n\t\tKuyaKap: One routine checkup and suddenly everyone on the road thinks they have a stethoscope.\n\t\tKuyaKap: Konting ubo lang, apo. Hand over [color=#0f6e2f]{Transaction_ItemWants}[/color] before I get lectured twice.\n\t- [Look away toward the shelves.]\n\t\t[signal arg=\"tally:+1\"]\n\t\tKuyaKap: Ahem. Shirt pocket's getting loose, I swear.\n\t\tKuyaKap: Just [color=#0f6e2f]{Transaction_ItemWants}[/color] when you're ready, apo.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3: \"Something for the Throat\" (Trapdoor + Candy Category Pivot -> +1 on SubstituteItem)\n\tKuyaKap: Hoo, init sa labas. It's blazing hot. Even the leaves on my acacia are too lazy to move.\n\tKuyaKap: Ahem, khm. Let me get my usual [color=#0f6e2f]{Transaction_ItemWants}[/color], apo.\n\tKuyaKap: Huh. Those candy jars on your counter look fuller than last time, nak. Colorful, ha.\n\tif {Flag_KapClinicKnown}:\n\t\t- Didn't that clinic slip warn you, Kuya?\n\t\t\tKuyaKap: Naku, I knew you read that paper. Nothing stays secret at a sari-sari counter.\n\t\t\tKuyaKap: Forty years with a smoke in my hand, nak. Without it, I don't know where to put my fingers.\n\t\t\t- [Reach quietly for the candy jars.]\n\t\t\t\t[signal arg=\"allow_sub_cat:candy\"]\n\t\t\t\tKuyaKap: Oy, why did you go quiet like that? Just grab my usual pack, ha.\n\t\t\t\t[end_timeline]\n\t\t\t- Your usual, Kuya. Go easy on yourself.\n\t\t\t\tKuyaKap: Heh. Salamat, apo. Last pack for a while, promise.\n\t\t\t\t[end_timeline]\n\t- [Plan to grab him candy instead.]\n\t\t[signal arg=\"allow_sub_cat:candy\"]\n\t\tKuyaKap: Aba, why are you looking at me like you're plotting mischief?\n\t\tKuyaKap: Don't get cute behind that counter, nak. Just my usual.\n\t- Eyeing the candy jars, Kuya? Sweet tooth?\n\t\tKuyaKap: Sus! Candy is for Buboy and the grade-schoolers.\n\t\tKuyaKap: Imagine a full-grown kapre unwrapping sweets by the road. Ruin my whole reputation.\n\t\t- [Swap his request to candy anyway.]\n\t\t\t[signal arg=\"allow_sub_cat:candy\"]\n\t\t\tKuyaKap: Hey, eyes on the cigarette rack, ha! I see you looking at the jars.\n\t\t- Fair enough, Kuya. Keeping your dignity intact.\n\t\t\tKuyaKap: Good kid. Just [color=#0f6e2f]{Transaction_ItemWants}[/color], apo.\n\t- Coming right up, Kuya. Same as always.\n\t\tKuyaKap: That's my favorite tindero. No sermons, quick hands.\n\t\tKuyaKap: Throat's just dry from the dust on the road anyway.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4: \"Cranky Withdrawal\" (Delayed Ana Ripple + \"Shade, Not the Smoke\")\n\tif {Flag_AnaUtangRefused}:\n\t\tKuyaKap: Sandali lang, nak, digging for loose coins.\n\t\tKuyaKap: Passed Ana counting centavos by her karinderya, so I slipped her my twenties. Stubborn woman tried handing them back twice.\n\tif {Flag_KapSubCandy}:\n\t\tKuyaKap: Sus, even the tricycles sound louder when you're off tobacco.\n\t\tKuyaKap: Look what you started, apo. My jaw aches from chewing sweets like Buboy, and my shirt pocket is sticky.\n\t\tKuyaKap: Give me [color=#0f6e2f]{Transaction_ItemWants}[/color] before I start arguing with the electric post outside.\n\t\t- Folks come for your shade, not smoke.\n\t\t\t[signal arg=\"flag:kap_shade_affirmed=true\"]\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\t[signal arg=\"note:Reminded him the neighborhood comes for his shade, not his smoke.\"]\n\t\t\tKuyaKap: Aba. Wait, you made me lose count of my coins.\n\t\t\tKuyaKap: Where did a kid your age learn to talk like that, ha?\n\t\t\tKuyaKap: Careful, nak. Keep sounding like your Lola and I won't know how to argue back.\n\t\t- Cranky Tito mode? Your cough sounds quieter.\n\t\t\tKuyaKap: Quiet? Tell that to my patience, apo. Even the stray dogs are steering clear of my tree.\n\t\t\tKuyaKap: Sige na, hand over [color=#0f6e2f]{Transaction_ItemWants}[/color] while I'm still behaving.\n\t\t- Nobody's forcing you. Cigarettes are right here.\n\t\t\t[signal arg=\"tally:-1\"]\n\t\t\tKuyaKap: Huwag mo akong tuksuhin, nak. Hard enough walking past it on my own.\n\t\t\tKuyaKap: Just [color=#0f6e2f]{Transaction_ItemWants}[/color] for me. Don't make me waste all this grumpy effort.\n\telse:\n\t\tKuyaKap: Hoo. Throat feels like sandpaper, apo. Must be the dry wind on the road.\n\t\tKuyaKap: Pahingi nga ng [color=#0f6e2f]{Transaction_ItemWants}[/color]. Something to clear my voice a bit.\n\t\t- Take care, Kuya. The road needs you.\n\t\t\t[signal arg=\"flag:kap_shade_affirmed=true\"]\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\tKuyaKap: Heh. Somebody has to make sure the kids don't trip in the canal, nak.\n\t\t\tKuyaKap: Don't worry about this old trunk. Still rooted deep.\n\t\t- Sure it's the wind, not the packs?\n\t\t\tKuyaKap: Sus, everyone's a doctor behind this counter.\n\t\t\tKuyaKap: Let an old tito keep his excuses in peace, apo. Just [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\t\t- Coming right up, Kuya.\n\t\t\tKuyaKap: Salamat, nak. Quick hands as always.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5: \"Smoke or Shade\" (Tally Inflection #4: +1 on SubstituteItem hold-the-line / -2 on relapse cave)\n\tif {Flag_KapSubCandy}:\n\t\tKuyaKap: Apo.\n\t\tKuyaKap: Huwag ka munang magsalita, ha. Just sell me [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\t\tKuyaKap: Shed roof leaked, clinic nurse lectured me again, and my hands won't sit still. Ngayon lang ulit, promise.\n\t\t- Not happening, Kuya. Don't start over now.\n\t\t\t[signal arg=\"allow_sub_cat:candy\"]\n\t\t\tKuyaKap: Tsk. Pulling rank behind your own counter now, ha?\n\t\t\tKuyaKap: Fine, nak. Give me whatever sweet thing you're reaching for before I argue.\n\t\t- [Say nothing. Reach for the candy jars.]\n\t\t\t[signal arg=\"allow_sub_cat:candy\"]\n\t\t\tKuyaKap: Oy. That's the wrong shelf, apo. My eyes still work.\n\t\t\tKuyaKap: Hay naku. Well, I'm still standing here, aren't I? Hand it over.\n\t\t- Alright, Kuya. Just this once.\n\t\t\t[signal arg=\"tally:-2\"]\n\t\t\tKuyaKap: Ah. Didn't think you'd actually say yes, nak.\n\t\t\tKuyaKap: Oo, sige. Just needed the quiet.\n\telse:\n\t\tKuyaKap: O, apo. Pahingi nga ng [color=#0f6e2f]{Transaction_ItemWants}[/color], my usual.\n\t\tKuyaKap: Funny thing, nak. Used to finish a pack and feel nothing. Lately the walk across the road feels two steps longer.\n\t\tKuyaKap: Heh, listen to me complaining. Must be the humidity. Coins are on the counter, apo.\n\t\t- [Swap his request to candy instead.]\n\t\t\t[signal arg=\"allow_sub_cat:candy\"]\n\t\t\tKuyaKap: Aba, why the serious face, apo? Just grab my order when you're ready.\n\t\t- Go easy on the smoke, Kuya.\n\t\t\tKuyaKap: Heh. Trying to retire me early? Not a chance, nak.\n\t\t\tKuyaKap: I'll pace myself. Just [color=#0f6e2f]{Transaction_ItemWants}[/color] for now.\n\t\t- [color=#0f6e2f]{Transaction_ItemWants}[/color], coming right up.\n\t\t\tKuyaKap: Salamat, apo. Steady as clockwork.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6: \"The Acacia Holds\" (Accumulated Tally Resolution -> 3 Bespoke Outcomes)\n\tif {Flag_KapSubCandy} and {Transaction_Tally} >= 3:\n\t\t[signal arg=\"outcome:quit_smoking\"]\n\t\t[signal arg=\"flag:kap_quit_smoking=true\"]\n\t\t[signal arg=\"note:Left his old brass lighter at the counter and quit smoking for good.\"]\n\t\tKuyaKap: O, apo. Clear a little spot by your register? Not for coins.\n\t\tKuyaKap: Heto. That's my old brass lighter. Keep it in a drawer, or toss it in the bin for me.\n\t\tKuyaKap: Haven't lit a stick in weeks, nak, and my chest finally stopped rattling.\n\t\tKuyaKap: Turns out the acacia casts the exact same shade without the smoke.\n\t\t- Proud of you! Official candy supplier now?\n\t\t\tKuyaKap: Haha! Huwag kang maingay, nak, Buboy already teases me enough.\n\t\t- Lola would've smiled seeing that lighter here.\n\t\t\tKuyaKap: Heh. Knowing her, she'd charge me storage rent for leaving it here.\n\t\t- [Tuck the brass lighter beside the register.]\n\t\t\tKuyaKap: Good spot for it, apo. Safer with you than in my pocket.\n\t\tKuyaKap: Listen, nak. Neighbors talk, and I know who comes collecting when the moon turns pale.\n\t\tKuyaKap: When she comes to weigh your ledger, just look toward the acacia. I'll step right up to this counter with you.\n\t\tKuyaKap: Sige na, pahingi ng [color=#0f6e2f]{Transaction_ItemWants}[/color] before we both get dramatic.\n\telif {Transaction_Tally} >= 1:\n\t\t[signal arg=\"outcome:cutting_back\"]\n\t\t[signal arg=\"note:Cut way back on cigarettes and promised to watch over the store.\"]\n\t\tKuyaKap: O, nak. Before you squint at me, check my shirt pocket. Empty.\n\t\tKuyaKap: Haven't quit all the way yet, an old kapre takes time to turn around. Down to two sticks a week, though.\n\t\tKuyaKap: Even that young doctor at the barangay clinic nearly fell off his chair.\n\t\t- Progress is progress! Glad you're breathing easier.\n\t\t\tKuyaKap: Salamat, apo. Easier when somebody behind this counter actually pays attention.\n\t\t- Two a week? Careful, soon it's zero.\n\t\t\tKuyaKap: Sus, one step at a time, boss! Let my knees catch up first.\n\t\tKuyaKap: You've done right by your Lola's store, nak. If that Pale Queen's tally ever gets heavy, you've got family across the road.\n\t\tKuyaKap: Pahingi nga ng [color=#0f6e2f]{Transaction_ItemWants}[/color] for my walk back.\n\telse:\n\t\t[signal arg=\"outcome:kept_the_smoke\"]\n\t\t[signal arg=\"note:Stayed behind his old smoking habit, polite as ever.\"]\n\t\tKuyaKap: O, apo. Khm, excuse me. Still holding the fort behind the counter, ha.\n\t\tKuyaKap: I'll stand a step back so the smoke doesn't drift inside your shop.\n\t\tKuyaKap: Funny how fast seasons move on this road. Storefront changes hands, prices shift, and I'm still leaning on the same bark.\n\t\t- Take care of that cough, Kuya.\n\t\t\tKuyaKap: Ah, konting alikabok lang 'yan, nak. Nothing forty years hasn't seen.\n\t\t- What can I get for you, Kuya?\n\t\t\tKuyaKap: Straight to the register. Fair enough, apo.\n\t\tKuyaKap: Just [color=#0f6e2f]{Transaction_ItemWants}[/color] for me. Keep your shelves neat, ha.\n\t[end_timeline]\n\nlabel Talk\nKuyaKap: Take your time, apo. My acacia isn't walking anywhere.\n- Almost got it, Kuya.\n\t[end_timeline]\n- Sorry Kuya, we're out of stock right now.\n\tKuyaKap: Ay, ubos na? No problem, nak. I'll stroll back over after Mario delivers.\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tKuyaKap: Salamat, nak. Still waiting on the rest whenever your hands are free.\nelif {Variation} == 2.0:\n\tKuyaKap: Got this one, apo. Take your time with the rest.\nelse:\n\tKuyaKap: Ayos. No rush, nak, my acacia isn't going anywhere.\n[end_timeline]\n\nlabel SubstituteItem\nif {Transaction_Chapter} == 4.0:\n\t[signal arg=\"flag:kap_sub_candy=true\"]\n\t[signal arg=\"tally:+1\"]\n\t[signal arg=\"note:Held the line and handed him {Transaction_SubstituteItemName} when he nearly relapsed.\"]\n\tKuyaKap: Heh. [color=#0f6e2f]{Transaction_SubstituteItemName}[/color] na naman, ha.\n\tKuyaKap: Matigas talaga ulo mo, nak. Worse than your Lola when she made up her mind.\n\tKuyaKap: Salamat, apo. Honestly. Keep the rest of the coins.\n\t[signal arg=\"story_success\"]\n\t[end_timeline]\nelse:\n\t[signal arg=\"flag:kap_sub_candy=true\"]\n\t[signal arg=\"tally:+1\"]\n\t[signal arg=\"note:Slipped him {Transaction_SubstituteItemName} instead of cigarettes.\"]\n\tKuyaKap: Aba. Wait a second.\n\tKuyaKap: Since when does [color=#0f6e2f]{Transaction_SubstituteItemName}[/color] look like a pack of smokes to you, apo?\n\tKuyaKap: Hay, look at me holding candy in my palm like Buboy. Heh.\n\tKuyaKap: Ikaw talaga. Good thing you look like your Lola, or I'd scold you.\n\tKuyaKap: Sige na. Keep the change before I change my mind.\n\t[signal arg=\"story_success\"]\n\t[end_timeline]\n\nlabel Satisfy\nif {Transaction_StoryGouged}:\n\tKuyaKap: Uy. Heavy markup for a neighbor across the road, nak.\n\tKuyaKap: I'll pay it, pero dahan-dahan sa presyo, ha.\nelse:\n\tKuyaKap: Ayos. Salamat, apo. Don't forget to sit down between customers, ha.\n\tif {Global_TipActive}:\n\t\tKuyaKap: Keep the extra coins. Buy yourself merienda later.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nKuyaKap: Uy, wrong grab, apo. Eyes tired? Check the shelf again.\n[end_timeline]\n", "purchase": "# Kuya Kap - Unified Everyday Purchase Timeline (3-Slot Sandwich Pattern)\n# Shifts ONLY on meaningful story flags (Flag_KapQuitSmoking / Flag_KapSubCandy).\n# Voice: Homey Filipino elderly tito. Zero time-of-day markers. Zero em-dashes.\n\nlabel Greeting\n# Slot 1: P1-P3 Reactive Opener or High-Price Remark\nif {Transaction_HasReactiveOpener}:\n\tKuyaKap: {Transaction_ReactiveOpener}\nelif {Global_HighPriceActive}:\n\tKuyaKap: Uy, prices crept up a bit, ha? Times are tight on the road.\n\n# Slot 2: Upfront Utang Ask OR Flag-Driven Request Pool (4 grounded variations per state)\nif {Transaction_WantsDebt}:\n\tKuyaKap: O, apo, walked across the road for [color=#0f6e2f]{Transaction_ItemWants}[/color], kaso I left my coin pouch in my other shirt.\n\tKuyaKap: Pwede bang ilista muna? I'll bring the coins on my next walk over, promise.\n\t- Sure Kuya, I'll put it on the list.\n\t\t[signal arg=\"utang_accepted\"]\n\t\tKuyaKap: Salamat, nak. Grab [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever your hands are free.\n\t- Sorry Kuya, cash is tight right now.\n\t\t[signal arg=\"utang_rejected\"]\n\t\tKuyaKap: Ay, oo naman, business first. Let me walk back to my tree and fetch my coins.\nelif {Flag_KapQuitSmoking}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tKuyaKap: O, apo. Pahingi nga ng [color=#0f6e2f]{Transaction_ItemWants}[/color]. Lungs feel lighter lately.\n\telif {Transaction_GreetingVar} < 50:\n\t\tKuyaKap: Just stretching my legs from the acacia. Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color], nak.\n\telif {Transaction_GreetingVar} < 75:\n\t\tKuyaKap: Funny how much clearer the road smells without tobacco. [color=#0f6e2f]{Transaction_ItemWants}[/color] nga, apo.\n\telse:\n\t\tKuyaKap: Heto barya, nak. [color=#0f6e2f]{Transaction_ItemWants}[/color] lang for your oldest suki.\nelif {Flag_KapSubCandy}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tKuyaKap: Don't look at me like that, I'm behaving. Just [color=#0f6e2f]{Transaction_ItemWants}[/color], apo.\n\telif {Transaction_GreetingVar} < 50:\n\t\tKuyaKap: My pockets are full of candy wrappers because of you. Pahingi ng [color=#0f6e2f]{Transaction_ItemWants}[/color], nak.\n\telif {Transaction_GreetingVar} < 75:\n\t\tKuyaKap: Taking a short walk to keep my hands busy. Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color], apo.\n\telse:\n\t\tKuyaKap: O, nak, [color=#0f6e2f]{Transaction_ItemWants}[/color] lang. And no lectures from behind the counter, ha.\nelse:\n\tif {Transaction_GreetingVar} < 25:\n\t\tKuyaKap: O, apo. Quick walk across the road. Pahingi nga ng [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telif {Transaction_GreetingVar} < 50:\n\t\tKuyaKap: Stepping out of the shade for a minute. Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color], nak.\n\telif {Transaction_GreetingVar} < 75:\n\t\tKuyaKap: Tindahan's looking tidy, apo. [color=#0f6e2f]{Transaction_ItemWants}[/color] nga when your hands are free.\n\telse:\n\t\tKuyaKap: Heto barya, nak. Just [color=#0f6e2f]{Transaction_ItemWants}[/color] for me.\n[end_timeline]\n\nlabel Talk\nKuyaKap: No rush, apo. My old knees like the break anyway. Still need [color=#0f6e2f]{Transaction_ItemWants}[/color].\n- Coming right up, Kuya.\n\t[end_timeline]\n- Sorry Kuya, we're out of stock right now.\n\tKuyaKap: Ay, ubos na? Sige, nak, I'll check back after Mario passes through.\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tKuyaKap: Salamat, nak. Still waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever you're ready.\nelif {Variation} == 2.0:\n\tKuyaKap: Got this one. Just [color=#0f6e2f]{Transaction_ItemWants}[/color] left on my list, apo.\nelse:\n\tKuyaKap: Ayos, thanks. No rush on [color=#0f6e2f]{Transaction_ItemWants}[/color], my knees like the rest.\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_WantsDebt}:\n\tKuyaKap: Salamat ulit, nak. Don't forget to jot that down in your lista, ha.\nelse:\n\tif {Global_TipActive}:\n\t\tKuyaKap: Keep the extra coins, apo. Buy yourself merienda later.\n\telif {Transaction_SatisfyVar} < 34:\n\t\tKuyaKap: Ayos. Salamat, apo. Don't forget to sit down between customers, ha.\n\telif {Transaction_SatisfyVar} < 67:\n\t\tKuyaKap: Salamat, nak. Just wave across the road if anyone gives you a hard time.\n\telse:\n\t\tKuyaKap: Sakto 'yan. Back to my shade, apo.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Repayment\nKuyaKap: First things first, apo. Here's the {Transaction_RepaymentAmount} pesos I owed from last time.\n[signal arg=\"repay_debt\"]\nKuyaKap: Sakto 'yan. You can cross my name off your lista now, nak.\n[end_timeline]\n\nlabel WrongItem\nKuyaKap: Uy, wrong grab, apo. I asked for [color=#0f6e2f]{Transaction_ItemWants}[/color].\n[end_timeline]\n", "visit": "# Kuya Kap - Unified Social Visit & Tambayan Smalltalk Timeline\n# Voice: Homey Filipino elderly tito. Zero time-of-day markers. Zero em-dashes.\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tKuyaKap: {Transaction_ReactiveOpener}\nif {Transaction_VisitVar} < 34:\n\tKuyaKap: Relax, apo, not buying anything. Just stretching my old back across the road.\n\tKuyaKap: Kumain ka na ba? Don't skip meals just because the counter gets busy.\nelif {Transaction_VisitVar} < 67:\n\tKuyaKap: Breeze is nicer under your awning than under my tree right now.\n\tKuyaKap: Your Lola used to keep a small electric fan right by that register. Smart woman.\nelse:\n\tKuyaKap: Just checking in on you, nak. Tricycle drivers down the road say you run a fair counter.\n\tKuyaKap: Keep that up. Good word travels fast in Karimlan.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Smalltalk\nif {Transaction_VisitVar} < 34:\n\tKuyaKap: Alright, knees are awake again. Back to my post, apo.\nelif {Transaction_VisitVar} < 67:\n\tKuyaKap: Good breather. Keep an eye on those candy jars when Buboy runs past, ha.\nelse:\n\tKuyaKap: Sige, nak, back to the acacia. Just wave if you need a hand.\n[end_timeline]\n"}, "manangana": {"story": "# Manang Ana - 6-Chapter Core Arc (Triangle A - Character #2)\n# Voice: Quietly warm, observant, tired karinderya Nanay. Zero superficial exclamation crutches.\n# Shows care through practical domestic details (shelf tape, concrete floors, stretching broth, warm food).\n# Rules: 100% spoken voice. Counter, not grille. Zero time-of-day words. Zero em-dashes. 3-7 word choices.\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tManangAna: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} == 0.0:\n\t# Chapter 1: \"Lola's Handwriting\" (0 tallies - pure voice & textural rapport)\n\tManangAna: That's still your Lola's handwriting on the shelf tape, isn't it?\n\tManangAna: Recognized those neat little numbers right away. I'm Ana, anak, from the eatery down the road.\n\t- Couldn't bring myself to peel them.\n\t\tManangAna: Don't peel them yet, anak. Took me months to wash my mother's apron after she passed.\n\t\tManangAna: Your Lola used to slip extra pandesal into my bag whenever my kids had a fever. Seeing you here feels right.\n\t- Just haven't replaced them yet.\n\t\tManangAna: Take your time. A house takes a while to stop echoing after someone leaves.\n\t- Did you buy here often?\n\t\tManangAna: Nearly every week since my eldest was small enough to sit right on this counter.\n\tManangAna: Fold a piece of cardboard to stand on behind that register, ha. Bare concrete goes straight to your knees.\n\t- Spoken from experience, Manang?\n\t\tManangAna: Six soup pots at work, then four hungry teenagers waiting for seconds at home.\n\t\tManangAna: My feet stopped listening to me years ago.\n\t- My knees are still young!\n\t\tManangAna: Heh. That's the exact line I gave your Lola twenty years back.\n\t- Thanks for the tip, Manang.\n\t\tManangAna: Somebody has to mother you a little behind that counter, anak.\n\tManangAna: Anyway, let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color] before my broth boils down too far.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2: \"Before Payday\" (Tally Inflection #1: First Utang +1 / 0 / -1)\n\tManangAna: Do you know how much four teenagers eat after flying laps over the rice fields?\n\tManangAna: Walked into my kitchen and found the rice pot scraped clean. Even the toasted garlic bits were gone.\n\t- Growing wings takes extra calories?\n\t\tManangAna: Apparently it takes my entire grocery envelope, anak.\n\t- Didn't they save you any?\n\t\tManangAna: Left me two spoonfuls at the bottom. Very thoughtful of them.\n\tif {Flag_AnaUtangAccepted}:\n\t\tManangAna: Counted my coins twice before leaving the house, anak. Didn't want to come up short on you twice in a row.\n\t\tManangAna: Honestly, seeing you write my name in your Lola's lista stung my pride a little. Still, my kids ate hot food because of you.\n\t\t- Never feel ashamed here, Manang.\n\t\t\tManangAna: Easy for you to say, anak. I'm supposed to be the grown-up checking on you, not borrowing from your drawer.\n\t\t\tManangAna: Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color] for those four.\n\t\t- Settle up whenever payday lands.\n\t\t\tManangAna: Soon as my envelope clears, anak. I sleep way better when my page is clean.\n\t\t\tManangAna: Just [color=#0f6e2f]{Transaction_ItemWants}[/color] for our table.\n\telif {Flag_AnaUtangRefused}:\n\t\tManangAna: Exact coins right on the tray, anak. Counted every peso at the eatery so neither of us feels awkward.\n\t\tManangAna: Stretched two tomatoes and salted egg across four plates last time. Nobody complained, though my eldest kept glancing at the pot.\n\t\t- Sorry again about last time.\n\t\t\tManangAna: Leave that behind us, anak. Running a counter alone scares anyone at first. Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\t\t- Glad you stretched it out.\n\t\t\tManangAna: Mothers get creative when the purse goes flat, anak. Just [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n\telse:\n\t\t[signal arg=\"setup_debt\"]\n\t\tManangAna: Wait, anak, hold on. Counted my purse twice by the gate and I'm still short until my eatery pay clears.\n\t\tManangAna: Promised myself I'd look after you once your Lola passed, not stand here asking a kid behind the counter for credit.\n\t\tManangAna: My rice pot's already warm at home, though. Could you write [color=#0f6e2f]{Transaction_ItemWants}[/color] in your lista just until payday?\n\t\t- Put your purse away. Sure.\n\t\t\t[signal arg=\"utang_accepted\"]\n\t\t\t[signal arg=\"flag:ana_utang_accepted_early=true\"]\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\t[signal arg=\"note:Put her groceries on the lista without hesitation when she came up short.\"]\n\t\t\tManangAna: Anak. You don't know how heavy my feet felt walking up here to ask.\n\t\t\tManangAna: Write every single peso down properly, ha. You just saved me from facing four quiet kids with an empty pan.\n\t\t- Until payday, Manang. Deal.\n\t\t\t[signal arg=\"utang_accepted\"]\n\t\t\t[signal arg=\"flag:ana_utang_accepted_early=true\"]\n\t\t\t[signal arg=\"note:Allowed her utang with an agreement to settle once her eatery pay comes in.\"]\n\t\t\tManangAna: Thank you for not making a fuss over it, anak. Soon as my pay clears, I'm coming straight here.\n\t\t\tManangAna: Just [color=#0f6e2f]{Transaction_ItemWants}[/color] then, before that rice dries out on the burner.\n\t\t- Sorry, I can't do credit yet.\n\t\t\t[signal arg=\"utang_rejected\"]\n\t\t\t[signal arg=\"story_fail_forward\"]\n\t\t\t[signal arg=\"flag:ana_utang_refused_early=true\"]\n\t\t\t[signal arg=\"tally:-1\"]\n\t\t\t[signal arg=\"note:Turned down her first utang request; she went home quietly to make do.\"]\n\t\t\tManangAna: No, no, wipe that guilty look off your face, anak. Keeping a small shop alive is hard enough.\n\t\t\tManangAna: I'll boil ginger and salt with our leftover rice at home. Tell my kids it's soup weather.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3: \"The Roof Breeze\" (Tally Inflection #2: Pride Overwork +1 / 0 / -1)\n\tif {Flag_AnaUtangAccepted}:\n\t\tManangAna: Sorry if I smell like fried onions, anak. Stayed behind at the eatery prepping catering trays.\n\t\tManangAna: Extra hours mean I clear my line in your notebook sooner. Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\t\t- Nobody's rushing you, Manang.\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\tManangAna: I'm rushing myself, anak. Pride's a hard habit to break at my age.\n\t\t- Why don't your teens help?\n\t\t\tManangAna: Tried that once. My youngest peeled three onions and ate four lumpia.\n\t\t\tManangAna: Easier keeping them on homework duty.\n\t\t- Extra trays pay off fast.\n\t\t\t[signal arg=\"tally:-1\"]\n\t\t\tManangAna: That's the math I'm counting on.\n\telse:\n\t\tManangAna: Quiet stretch at the eatery, anak, though my thumbs still ache from peeling squash.\n\t\tManangAna: Trimmed our meals at home down to one simple dish lately. Funny how fast kids go quiet when they see you tired. Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\t\t- Good that they finally noticed.\n\t\t\tManangAna: Took them long enough, though maybe I hid it too well.\n\t\t- Make sure you rest too.\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\tManangAna: Resting's harder than cooking when your house is full, anak.\n\t\t- Coming right up, Manang.\n\t\t\tManangAna: Thank you, anak.\n\tManangAna: Feel that wind coming down the road? Good flying weather up above the trees.\n\tManangAna: My kids ask why I never join them up there anymore. Truth is, if I leave the ground for an hour, who watches the stove?\n\t- The stove can wait an hour.\n\t\t[signal arg=\"note:Hasn't flown in years because she feels someone always has to stay on the ground.\"]\n\t\tManangAna: Heh. Tell that to four kids who still lose the salt jar. Just [color=#0f6e2f]{Transaction_ItemWants}[/color], anak.\n\t- Do you miss flying, Manang?\n\t\t[signal arg=\"note:Admitted she misses the sky every time the wind shifts over the rooftops.\"]\n\t\tManangAna: Every single time the wind shifts, anak. My shoulder blades still ache whenever clouds roll down from the hills.\n\t\tManangAna: Hard remembering what weightless feels like when four pairs of school shoes need soles. Just [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n\t- Kids grow up eventually, Manang.\n\t\tManangAna: Not fast enough for my back, anak. Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4: \"Broth and Ginger\" (Tally Inflection #3: +2 ONLY on real Frozen SubstituteItem sacrifice)\n\tif {Flag_KapSubCandy}:\n\t\tManangAna: Passed Kap by his acacia on the walk over. Offered me a piece of candy instead of hiding smoke behind his palm.\n\t\tManangAna: You're good for this street, anak. That cough of his used to worry me.\n\telif {Flag_KapClinicKnown}:\n\t\tManangAna: Has Kap seemed alright to you lately, anak? Saw him walking back from the clinic, stubborn as ever when I asked.\n\tManangAna: Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color]. Boiled with ginger and greens, it'll stretch across four bowls nicely.\n\tManangAna: I already tasted the soup pots at work anyway, so plain broth is plenty for me.\n\t- [Quietly grab from the freezer instead.]\n\t\t[signal arg=\"allow_sub_cat:frozen\"]\n\t\tManangAna: Wait, anak, that's the freezer door. Stick to the canned shelf for me, ha.\n\t- Tasting soup isn't a meal.\n\t\tManangAna: Spoken like someone who hasn't stirred forty bowls in a shift, anak. After all that steam, broth is enough.\n\t\t- [Swap her order to frozen ulam.]\n\t\t\t[signal arg=\"allow_sub_cat:frozen\"]\n\t\t\tManangAna: Hey, I saw you reach for the cold case. Just the cheap tin, anak.\n\t\t- Eat a real bowl at home.\n\t\t\tManangAna: Alright, alright, you sound worse than my eldest. Hand me [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\t- Ginger makes any soup good.\n\t\tManangAna: Cheap, warm, and clears your head. Best trick in the kitchen, anak.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5: \"Locked Out of the Kitchen\" (0 tallies - pure Ten Turn payoff)\n\tif {Flag_BuboyTrustedErrand} or {Flag_AnaSubFeast} or {Transaction_Tally} >= 2:\n\t\tManangAna: My own children locked me out of my kitchen, anak.\n\t\tManangAna: Wedged a wooden chair right under the doorknob! Told me if I touched a single ladle, they'd go on strike.\n\t\tif {Flag_BuboyTrustedErrand}:\n\t\t\tManangAna: Turns out they'd been paying little Buboy in drumsticks to smuggle groceries past me all week.\n\t\tManangAna: Burned half the garlic black, splashed soy sauce up the wall, and shooed me onto the porch until I finally spread my wings.\n\t\t- How did the sky feel?\n\t\t\tManangAna: Cold at first. Both my shoulders popped clearing the mango tree.\n\t\t\tManangAna: Then I caught the draft above the river, and for twenty minutes nobody needed a thing from me. Just open air.\n\t\t- How was their burnt adobo?\n\t\t\tManangAna: Salty enough to wake the whole street, anak. Best meal I've eaten in ten years.\n\t\t- Buying backup ingredients right now?\n\t\t\tManangAna: Replacing the soy sauce they spilled before they realize the bottle's empty.\n\t\tManangAna: Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color], anak. Don't tell them I helped restock.\n\telse:\n\t\tManangAna: Came home from work to a strange sight, anak. Every dish in the sink was already washed.\n\t\tManangAna: My eldest fried eggs for everyone so I could sit by the window with my feet up.\n\t\t- Glad they stepped up for you.\n\t\t\tManangAna: Me too, anak. Maybe I was holding onto the ladle too tight.\n\t\t- Sounds like a well-earned break.\n\t\t\tManangAna: Quietest thirty minutes our house has seen all year.\n\t\tManangAna: Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color], exact change on the tray.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6: \"Extra Rice\" (Accumulated Tally Resolution -> >= 3 flew_again | >= 1 steady_kitchen | <= 0 closed_ledger)\n\tif {Transaction_Tally} >= 3:\n\t\t[signal arg=\"outcome:flew_again\"]\n\t\t[signal arg=\"note:Took to the sky again and brought a warm container of family-cooked adobo to the counter.\"]\n\t\tManangAna: Clear a small spot behind your register, anak. Brought you something from our stove.\n\t\tManangAna: Still warm. My kids chopped the pork, and I watched the bay leaves so nobody scorched the pot this time.\n\t\tManangAna: Even took the shortcut over the rooftops getting here. Joined back up behind the acacia so I wouldn't startle Mario.\n\t\t- Smells incredible. Thank you, Manang.\n\t\t\tManangAna: Eat while it's warm, ha. Just return my container clean when you're done.\n\t\t- Getting used to flying again?\n\t\t\tManangAna: Twice a week over the river now. My back hasn't felt this light in a decade.\n\t\t- [Set the warm container beside you.]\n\t\t\tManangAna: Pair that with real rice, ha, not biscuits from the rack.\n\t\tManangAna: Listen to me, anak. Everyone on this road knows who visits your counter when the moon turns pale.\n\t\tManangAna: When Reyna Mayari comes to weigh your ledger, call my name. You've fed my house; my house stands behind yours.\n\t\tManangAna: Now hand me [color=#0f6e2f]{Transaction_ItemWants}[/color] before things get busy at home.\n\telif {Transaction_Tally} >= 1:\n\t\t[signal arg=\"outcome:steady_kitchen\"]\n\t\t[signal arg=\"note:Put her four teens on a kitchen rotation and finally gets to sit down for meals.\"]\n\t\tManangAna: Look at my hands, anak. No onion stains for once.\n\t\tManangAna: Put all four teenagers on a kitchen rotation at home. Haven't flown past the river yet, though I actually sit down for meals now.\n\t\t- You look way more rested.\n\t\t\tManangAna: Feels strange having free hands, honestly. Thank you for always being steady with us here, anak.\n\t\t- Are their cooking skills improving?\n\t\t\tManangAna: Fewer scorched pans each week. Small miracles.\n\t\tManangAna: If that pale moon's ledger ever presses you hard, remember you have neighbors down the road. Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telse:\n\t\t[signal arg=\"outcome:closed_ledger\"]\n\t\t[signal arg=\"note:Kept her accounts strictly cash-only and polite.\"]\n\t\tManangAna: Exact coins on the wood, anak.\n\t\tManangAna: Things are steadier at our table lately, so we won't need to trouble your ledger.\n\t\t- Glad things are steady, Manang.\n\t\t\tManangAna: One pot at a time, anak. That's how a kitchen runs.\n\t\t- Coming right up, Manang.\n\t\t\tManangAna: Thank you, anak.\n\t\tManangAna: Just [color=#0f6e2f]{Transaction_ItemWants}[/color] for me. Remember to rest your feet.\n\t[end_timeline]\n\nlabel Talk\nManangAna: Take your time, anak. Resting my heels for a minute feels nice anyway. Still need [color=#0f6e2f]{Transaction_ItemWants}[/color].\n- Almost got it, Manang.\n\t[end_timeline]\n- Sorry, we're out of stock.\n\tManangAna: All out? That's alright, anak, I'll check back after Mario's next delivery.\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tManangAna: Thank you, anak. Whenever your hands are free for the rest, no rush.\nelif {Variation} == 2.0:\n\tManangAna: Tucked that right in my bag. Take your time with the rest, anak.\nelse:\n\tManangAna: Got that part. Still waiting on the rest whenever you're ready, anak.\n[end_timeline]\n\nlabel SubstituteItem\n[signal arg=\"flag:ana_sub_feast=true\"]\n[signal arg=\"tally:+2\"]\n[signal arg=\"note:Slipped her {Transaction_SubstituteItemName} from the freezer so she and her teens could eat a hearty meal.\"]\nManangAna: Wait a second, anak. That's [color=#0f6e2f]{Transaction_SubstituteItemName}[/color] from your freezer, that costs double my little tin.\nManangAna: Stop looking so innocent behind that register, my eyes are tired enough without you making them water here.\nManangAna: Thank you, anak. First time all month I won't have to pretend plain broth filled me up.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_WantsDebt}:\n\tManangAna: Thank you for trusting me with this, anak. I'll square it up soon.\nelif {Transaction_StoryGouged}:\n\tManangAna: Steep price for a neighbor down the road, anak.\n\tManangAna: I'll pay it since the pot's waiting, though go a little easier on us next time.\nelse:\n\tManangAna: Thank you, anak. Make sure you sit down and eat real food, ha.\n\tif {Global_TipActive}:\n\t\tManangAna: Keep the extra coins, anak. Buy yourself something cold.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nManangAna: Wait, anak, check the label again. That's not quite what I asked for.\n[end_timeline]\n", "purchase": "# Manang Ana - Unified Everyday Purchase Timeline (3-Slot Sandwich Pattern)\n# Shifts ONLY on meaningful story flags (Flag_AnaFlewAgain / Flag_AnaUtangAccepted).\n# Includes 3-Choice Repayment (Accept / Forgive / Defer) and Smooth First-Utang Story Bridge.\n# Voice: Quietly warm, observant, genuine Nanay voice. Zero superficial exclamation crutches.\n\nlabel Greeting\n# Slot 1: P1-P3 Reactive Opener or High-Price Remark\nif {Transaction_HasReactiveOpener}:\n\tManangAna: {Transaction_ReactiveOpener}\nelif {Global_HighPriceActive}:\n\tManangAna: Prices crept up again, anak? Even garlic at the market is getting hard to budget.\n\n# Slot 2: Upfront Utang Ask (with First-Utang Story Bridge) OR Flag-Driven Request Pool\nif {Transaction_WantsDebt}:\n\tif {Flag_AnaUtangAccepted} == false and {Flag_AnaUtangRefused} == false:\n\t\tManangAna: Wait, anak, let me recount my palm. No, I really came up short, and my eatery pay hasn't cleared yet.\n\t\tManangAna: Promised myself I'd look after you once your Lola passed, not stand here asking a kid for credit.\n\t\tManangAna: My rice pot's already warm at home, though. Could you write [color=#0f6e2f]{Transaction_ItemWants}[/color] in your lista just until payday?\n\t\t- Put your coins away. Sure.\n\t\t\t[signal arg=\"utang_accepted\"]\n\t\t\t[signal arg=\"flag:ana_utang_accepted_early=true\"]\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\t[signal arg=\"note:Put her groceries on the lista without hesitation when she first came up short.\"]\n\t\t\tManangAna: Anak. You don't know how heavy my feet felt walking up here to ask.\n\t\t\tManangAna: Write every peso down clearly, ha. Grab [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever your hands are free.\n\t\t- Until payday, Manang. Deal.\n\t\t\t[signal arg=\"utang_accepted\"]\n\t\t\t[signal arg=\"flag:ana_utang_accepted_early=true\"]\n\t\t\t[signal arg=\"note:Allowed her first utang with an agreement to settle once her eatery pay comes in.\"]\n\t\t\tManangAna: Thank you for not making a fuss over it, anak. Soon as my pay lands, I'm coming straight here.\n\t\t\tManangAna: Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color] before that rice dries out.\n\t\t- Sorry, cash only right now.\n\t\t\t[signal arg=\"utang_rejected\"]\n\t\t\t[signal arg=\"flag:ana_utang_refused_early=true\"]\n\t\t\t[signal arg=\"tally:-1\"]\n\t\t\t[signal arg=\"note:Turned down her first utang request when cash was tight.\"]\n\t\t\tManangAna: No, no, wipe that guilty look off your face, anak. Keeping a young shop alive is hard enough.\n\t\t\tManangAna: I'll stretch ginger and salt with our leftover rice at home and come back once my pay clears.\n\telse:\n\t\tManangAna: Hate adding another line to my page, anak, my purse came up a few coins short for the stove again.\n\t\tManangAna: Could you put [color=#0f6e2f]{Transaction_ItemWants}[/color] on my lista? I'll fold every peso into my next payment.\n\t\t- Sure, adding it to your lista.\n\t\t\t[signal arg=\"utang_accepted\"]\n\t\t\tManangAna: Thank you, anak. Saves me from facing four hungry kids empty-handed.\n\t\t- Sorry, cash only this round.\n\t\t\t[signal arg=\"utang_rejected\"]\n\t\t\tManangAna: No hard feelings at all, anak. Let me check what's left in our pantry first.\nelif {Flag_AnaFlewAgain}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tManangAna: Shoulders feel ten years lighter lately, anak. Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telif {Transaction_GreetingVar} < 50:\n\t\tManangAna: Quick run, anak. My kids already started the rice at home. Could I get [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telif {Transaction_GreetingVar} < 75:\n\t\tManangAna: Have you eaten yet, anak? Don't work on an empty stomach. Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telse:\n\t\tManangAna: Exact coins from the eatery tray, anak. Just [color=#0f6e2f]{Transaction_ItemWants}[/color] for our table.\nelif {Flag_AnaUtangAccepted}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tManangAna: Quick breather between prep trays, anak. Could you grab me [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telif {Transaction_GreetingVar} < 50:\n\t\tManangAna: Cash in hand this pass, anak. Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color] before the rice cools off.\n\telif {Transaction_GreetingVar} < 75:\n\t\tManangAna: Four teenagers empty a pantry faster than a storm, anak. [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n\telse:\n\t\tManangAna: Resting my elbows here for one second, anak. Just [color=#0f6e2f]{Transaction_ItemWants}[/color] when you're ready.\nelse:\n\tif {Transaction_GreetingVar} < 25:\n\t\tManangAna: Line at the eatery stretched past the corner, anak. Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telif {Transaction_GreetingVar} < 50:\n\t\tManangAna: Stepping out before my broth boils over, anak. Could I get [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telif {Transaction_GreetingVar} < 75:\n\t\tManangAna: Keeping busy, anak? Make sure you drink water. Let me pick up [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telse:\n\t\tManangAna: Long hours on my feet, anak. [color=#0f6e2f]{Transaction_ItemWants}[/color], please, whenever your hands are free.\n[end_timeline]\n\nlabel Talk\nManangAna: No rush, anak. Nice resting my knees for a moment anyway. Still waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color].\n- Coming right up, Manang.\n\t[end_timeline]\n- Sorry, we're out of stock.\n\tManangAna: Fresh out? That's alright, anak, I'll improvise with what's in the kitchen.\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tManangAna: Thank you, anak. Still need [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever you're ready.\nelif {Variation} == 2.0:\n\tManangAna: Straight into my market bag. Just waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color], no rush.\nelse:\n\tManangAna: Got that part. Take your time with [color=#0f6e2f]{Transaction_ItemWants}[/color], anak.\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_WantsDebt}:\n\tManangAna: Thank you for putting that in the lista, anak. Take care behind that counter.\nelse:\n\tif {Global_TipActive}:\n\t\tManangAna: Keep the extra coins, anak. Get yourself a proper snack.\n\telif {Transaction_SatisfyVar} < 34:\n\t\tManangAna: Thank you, anak. Don't forget to eat real rice meals, ha.\n\telif {Transaction_SatisfyVar} < 67:\n\t\tManangAna: Lifesaver, anak. Better get back before those four raid the stove.\n\telse:\n\t\tManangAna: All set. Take care of yourself behind that counter, anak.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Repayment\nManangAna: Before I ask for anything, anak, here's the {Transaction_RepaymentAmount} pesos from my line in your lista.\nManangAna: Set that aside straight from my eatery pay so we could square up properly.\n- Thanks, crossing your name off.\n\t[signal arg=\"repay_debt\"]\n\tManangAna: Good. Nothing lets me breathe easier than a clean page in the ledger, anak.\n- Keep it for the kids, Manang.\n\t[signal arg=\"forgive_debt\"]\n\t[signal arg=\"tally:+1\"]\n\tManangAna: Wait, anak, you can't just wave that off, you earned every peso behind this counter.\n\tManangAna: Stubborn kid, just like your Lola. Expect hot food at this counter soon, I won't take no for an answer.\n- Pay me later, no rush.\n\t[signal arg=\"defer_repay\"]\n\tManangAna: Sure your register isn't stretched thin right now, anak?\n\tManangAna: Thank you for the breathing room. I'll put this toward school fare and square up next pass.\n[end_timeline]\n\nlabel WrongItem\nManangAna: Wait, anak, check that label again. I asked for [color=#0f6e2f]{Transaction_ItemWants}[/color].\n[end_timeline]\n", "visit": "# Manang Ana - Unified Social Visit & Tambayan Smalltalk Timeline\n# Voice: Quietly warm, observant, genuine Nanay voice. Zero superficial exclamation crutches.\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tManangAna: {Transaction_ReactiveOpener}\nif {Transaction_VisitVar} < 34:\n\tManangAna: Not buying anything right now, anak. Just hiding under your awning for two quiet minutes.\n\tManangAna: My four teenagers are debating who gets the electric fan at home, and I chose peace.\nelif {Transaction_VisitVar} < 67:\n\tManangAna: Walking back from the wet market, anak. Have you had real rice yet, or just snacks from your own rack?\n\tManangAna: Watch your stomach, ha. Nobody else is opening these shutters if you catch a fever.\nelse:\n\tManangAna: Nice seeing a lamp burning behind this counter again, anak.\n\tManangAna: Used to chat with your Lola right here whenever the soup pots were simmering slow.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Smalltalk\nif {Transaction_VisitVar} < 34:\n\tManangAna: Calf cramp finally let go, anak. Back to my kitchen I go.\nelif {Transaction_VisitVar} < 67:\n\tManangAna: Break's over before my four kids start wondering where dinner went. Take care, anak.\nelse:\n\tManangAna: Good catching my breath here, anak. Pull up a stool whenever the road goes quiet.\n[end_timeline]\n"}, "buboy": {"story": "# Buboy - 6-Chapter Core Arc (Triangle A - Character #3)\n# Voice: Energetic, innocent, big-laughing Bungisngis kid whose \"riddles\" are forgotten errands from his Mama.\n# Mainly English with light Filipino sprinkles. Zero parentheses. Zero time-of-day words. Zero em-dashes.\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tBuboy: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} == 0.0:\n\t# Chapter 1: \"What Did Mama Say?\"\n\tBuboy: Hold still, [i]Damulag[/i]! Quit licking my ear while I'm talking!\n\tBuboy: Hi, Kuya! Are you Lola's grandchild? I'm Buboy!\n\tBuboy: Mama made me repeat what to buy ten times, then a big green dragonfly flew past and I forgot it all!\n\t- A dragonfly wiped your memory?\n\t\tBuboy: It was super shiny, Kuya! It zoomed right past my nose!\n\t- Wait, you're carrying a carabao?!\n\t\tBuboy: Hehe, yeah, that's [i]Damulag[/i]! He gets lazy walking, so I just carry him!\n\t- Nice to meet you, Buboy.\n\t\tBuboy: Hehe, nice to meet you too, Kuya!\n\tBuboy: Uh oh, I really forgot the name! I still remember what the wrapper looks like though!\n\t- Describe it! Let's guess.\n\t\tBuboy: Yay! Okay, listen closely, Kuya!\n\t- Sure Mama sent you?\n\t\tBuboy: Promise, po! Well, she said I get to share it too, hehe!\n\t- Quick, before you forget!\n\t\tBuboy: Opo, opo, here it comes!\n\tjump Riddle\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2: \"Teks Under the Acacia\" (Tally Inflection #1: +1 win / 0 lose / -1 brush off)\n\tBuboy: Kuya, look! I won five teks cards under Kuya Kap's tree!\n\tBuboy: Wanna play one quick round? Maybe it'll help me remember what Mama wants!\n\t- Sure! One round of Teks.\n\t\tBuboy: Haha, no crying if I win! One, two, teks!\n\t\t[signal arg=\"minigame:teks\"]\n\t\tif {Transaction_MinigameWon}:\n\t\t\t[signal arg=\"flag:buboy_teks_won=true\"]\n\t\t\t[signal arg=\"flag:kap_clinic_known=true\"]\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\t[signal arg=\"note:Beat Buboy at Teks; he blurted out seeing Kuya Kap pocket a yellow barangay clinic slip.\"]\n\t\t\tBuboy: Whoa, you're super fast, Kuya! Even faster than Kuya Kap!\n\t\t\tBuboy: Back by the tree, Kuya Kap dropped a yellow paper from the clinic and hid it super quick when I looked!\n\t\telse:\n\t\t\t[signal arg=\"flag:kap_clinic_known=true\"]\n\t\t\t[signal arg=\"note:Lost to Buboy at Teks; while bragging, he let slip that Kuya Kap hid a barangay clinic paper.\"]\n\t\t\tBuboy: Hehe, I won! Told you my card is lucky, Kuya Kap even blew on it!\n\t\t\tBuboy: He was coughing a lot though, and he hid a yellow clinic paper in his pocket when I asked!\n\t- Errand first, Teks next time.\n\t\t[signal arg=\"flag:kap_clinic_known=true\"]\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Buboy mentioned Kuya Kap hiding a yellow barangay clinic paper by the acacia.\"]\n\t\tBuboy: Aww, okay po! Next time we play for real, Kuya!\n\t\tBuboy: At least Kuya Kap always watches us play by his tree, even with that yellow clinic paper in his pocket.\n\tif {Flag_KapSubCandy}:\n\t\tBuboy: Oh, and he smells like sweet candy now instead of smoke! Did you give him some, Kuya?\n\tBuboy: Wait, I remembered what Mama's errand looks like! Listen, po:\n\tjump Riddle\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3: \"Secret Adobo\" (Tally Inflection #2: +1 keep secret / 0 paper joke / -1 threaten to snitch)\n\tBuboy: Psst, Kuya! Can I tell you a secret? Mama didn't send me this time!\n\tBuboy: Manang Ana's kids wrote a list on my hand, except I got sweaty running here so now it's all blurry!\n\tBuboy: Oops! Don't tell Manang Ana they're practicing adobo to surprise her, okay?!\n\t- My lips are sealed, Buboy.\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Promised to keep quiet about Buboy buying secret adobo ingredients for Manang Ana's teens.\"]\n\t\tBuboy: Hehe, thanks, Kuya! They promised I get the first bite if they don't burn it!\n\t- What if I tell Manang Ana?\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Threatened to tell Manang Ana about her teens' secret cooking run.\"]\n\t\tBuboy: Nooo, please don't! I'll give you two shiny teks cards, just keep it secret!\n\t- Why didn't they use paper?\n\t\tBuboy: They did, Kuya! I turned it into a paper airplane and it got stuck on a roof, hehe!\n\tBuboy: Wait, I can still read the ink near my thumb! Here's what they need:\n\tjump Riddle\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4: \"Don't Get Distracted\" (Tally Inflection #3: +2 candy sub / +1 encourage / 0 strict / -1 doubt)\n\tBuboy: Kuya! I'm back for the second half of Manang Ana's surprise!\n\tBuboy: I walked super slow this time so I wouldn't chase any puppies or butterflies along the road.\n\tBuboy: I really wanna get this whole errand right so Manang Ana's kids let me help again!\n\t- You're doing great, Buboy.\n\t\t[signal arg=\"flag:buboy_trusted_errand=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Cheered Buboy on during his big secret errand so he could deliver the ingredients safely.\"]\n\t\tBuboy: Hehe, really?! Okay, I'll hold the bag with both hands all the way home! Listen, po:\n\t\tjump Riddle\n\t- [Give him candy for the walk.]\n\t\t[signal arg=\"allow_sub_cat:candy\"]\n\t\t[signal arg=\"flag:buboy_trusted_errand=true\"]\n\t\tBuboy: Huh, Kuya? Why are you looking at the candy jars? I'm supposed to buy cooking stuff!\n\t\t[end_timeline]\n\t- Stay focused! No butterflies.\n\t\t[signal arg=\"flag:buboy_trusted_errand=true\"]\n\t\t[signal arg=\"note:Kept Buboy focused so he could finish the secret errand for Manang Ana's teens.\"]\n\t\tBuboy: Opo! Straight home, zero butterflies! Here's what they asked for:\n\t\tjump Riddle\n\t- Bet a puppy distracts you.\n\t\t[signal arg=\"tally:-1\"]\n\t\tBuboy: Hey, no way, Kuya! Watch me walk straight to their gate! Here's the clue:\n\t\tjump Riddle\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5: \"The Surprise Worked\" (0 tallies - pure Double Triangle A Callback)\n\tif {Flag_BuboyTrustedErrand}:\n\t\tBuboy: Kuya, it worked! Manang Ana's kids cooked the adobo and she flew right over our roof laughing!\n\t\tBuboy: They even gave me a huge chicken leg because I didn't drop the bag!\n\telse:\n\t\tBuboy: Kuya, Manang Ana's kids still cooked their surprise adobo, even if I got a little lost on the way!\n\tif {Flag_KapSubCandy}:\n\t\tBuboy: Oh, and guess what! I saw Kuya Kap hiding behind his tree eating candy like a little kid!\n\t\t- Keep his secret, Buboy!\n\t\t\tBuboy: Hehe, I won't tell! He even gave me one piece so I'd stay quiet!\n\t\t- Better than smoke, right?\n\t\t\tBuboy: Way better! Even [i]Damulag[/i] stopped sneezing when we walk past his tree!\n\telse:\n\t\t- Back to Mama's errands now?\n\t\t\tBuboy: Yup! Still forgot the name halfway here though, hehe!\n\t\t- Bring a paper list this time?\n\t\t\tBuboy: Couldn't find a pencil, Kuya, so I used my brain again!\n\tBuboy: Anyway, help me guess what Mama wants, po! Here's how it looks:\n\tjump Riddle\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6: \"Best Helper on the Road\" (Accumulated Tally Resolution -> >= 3 trusted_runner | >= 1 teks_buddy | <= 0 still_goofing)\n\tif {Flag_BuboyTrustedErrand} and {Transaction_Tally} >= 3:\n\t\t[signal arg=\"outcome:trusted_runner\"]\n\t\t[signal arg=\"note:Became a proud neighborhood helper and promised to vouch for the shop when Reyna Mayari visits.\"]\n\t\tBuboy: Guess what, Kuya! Mama sent me for three things and I remembered two whole ones all by myself!\n\t\tBuboy: Oh, and Kuya Kap told me a Moon Queen comes by to check your big notebook.\n\t\t- Aren't you scared of her?\n\t\t\tBuboy: A little bit, po! That's why I'm bringing [i]Damulag[/i] with me!\n\t\t- Two out of three is awesome!\n\t\t\tBuboy: Hehe, I'm basically a grown-up helper now, right Kuya?\n\t\tBuboy: When that Moon Queen comes, call me! I'll tell her your store is the best one in Karimlan!\n\t\tBuboy: Okay, help me guess that last third thing Mama asked for, po:\n\telif {Transaction_Tally} >= 1:\n\t\t[signal arg=\"outcome:teks_buddy\"]\n\t\t[signal arg=\"note:Stayed a cheerful Teks rival who still forgets half his Mama's list.\"]\n\t\tBuboy: Kuya! Nobody on the road can beat me at Teks except you!\n\t\tBuboy: Mama says I'm way faster at errands now too, mostly because you always know what I'm describing!\n\t\t- Happy to help, Buboy.\n\t\t\tBuboy: Hehe, thanks, Kuya! If that Moon Queen ever visits, [i]Damulag[/i] and I will cheer for you!\n\t\t- Teks rematch anytime!\n\t\t\tBuboy: Deal! Right after I bring this home to Mama!\n\t\tBuboy: Okay, listen to this clue, po:\n\telse:\n\t\t[signal arg=\"outcome:still_goofing\"]\n\t\t[signal arg=\"note:Still zooming up and down the road forgetting errands.\"]\n\t\tBuboy: Hi, Kuya! I chased a blue butterfly two streets over and forgot what Mama wanted again, hehe!\n\t\t- What does it look like?\n\t\t\tBuboy: Wait, let me think! Oh, I got it!\n\t\t- Classic Buboy.\n\t\t\tBuboy: Hey, at least I didn't drop the coins this time, po!\n\t\tBuboy: Here's what I remember, Kuya:\n\tjump Riddle\n\nlabel Riddle\n# Crisp 2-line forgotten-errand descriptions by {Transaction_ItemWantsID} (never spoils the item name!)\nif {Transaction_ItemWantsID} == \"argentita\":\n\tBuboy: The heavy round tin with red meat and a bright sun right on the label, po!\n\tBuboy: Mama cranks it open with that spinning wheel until it goes rrrrrk, smells awesome with onions!\nelif {Transaction_ItemWantsID} == \"cenchuree\":\n\tBuboy: The super flat round tin, po, not the tall one, the really squished flat one!\n\tBuboy: Smells just like the fish stalls at the market when Mama spreads it on bread!\nelif {Transaction_ItemWantsID} == \"scam\":\n\tBuboy: The blocky rectangle can with the pink meat tucked inside, Kuya!\n\tBuboy: Mama slices it flat and fries it until all the corners get super crispy, hehe!\nelif {Transaction_ItemWantsID} == \"lucky9\":\n\tBuboy: The meat can with a big lucky number printed right on the front, po!\n\tBuboy: Bigger than eight and smaller than ten! Hehe, bet you got that one, Kuya!\nelif {Transaction_ItemWantsID} == \"mema\":\n\tBuboy: The fish can swimming in red tomato sauce that Mama pours over hot soup!\n\tBuboy: Asked Mama to repeat the name and she just yelled to grab the number-one tin, hehe!\nelif {Transaction_ItemWantsID} == \"anoba\":\n\tBuboy: Those thin crunchy crackers stacked up neat like a tiny house roof, po!\n\tBuboy: Dropped a pack on the road once and smashed every piece, still ate all the crumbs though, hehe!\nelif {Transaction_ItemWantsID} == \"patos\":\n\tBuboy: The bright yellow chip bag that sounds like a duck on the farm, quack quack!\n\tBuboy: Turns all ten of your fingers super yellow with cheese dust so you have to lick them clean!\nelif {Transaction_ItemWantsID} == \"dantes\":\n\tBuboy: The noisy snack bag full of mixed nuts and crunchy bits that goes tatatatata when you shake it!\n\tBuboy: Mama says the name sounds just like that handsome actor on TV!\nelif {Transaction_ItemWantsID} == \"marites\":\n\tBuboy: The super loud crunchy snack that the whole street hears the second you bite one!\n\tBuboy: Mama always laughs because it's named after aunties who gossip by the gate, hehe!\nelif {Transaction_ItemWantsID} == \"ngaragya\":\n\tBuboy: Those round crunchy cracker nuts in a small bag, Kuya!\n\tBuboy: The second you tear it open, the whole room smells just like Mama's adobo!\nelif {Transaction_ItemWantsID} == \"utang\":\n\tBuboy: The green crunchy ring snack with a farmer's salakot hat and a tiny vinegar bowl on front!\n\tBuboy: Mama laughs at the name because it's the exact word written inside your loan lista, hehe!\nelif {Transaction_ItemWantsID} == \"champyon\":\n\tBuboy: That box of white smoke sticks Papa sends me for, though Mama says I'm never allowed to touch them!\n\tBuboy: Sounds just like winning a first-place gold medal in a game, po!\nelif {Transaction_ItemWantsID} == \"marboro\":\n\tBuboy: The bright red box of grown-up smoke sticks, Kuya, definitely not the blue one!\n\tBuboy: Papa made me swear twice to get the red pack that looks all royal on front!\nelif {Transaction_ItemWantsID} == \"mayti\":\n\tBuboy: The green-and-white smoke box with the big red letter stamped on the front, po!\n\tBuboy: Papa says it feels cold like toothpaste in your throat, grown-ups are so weird, hehe!\nelif {Transaction_ItemWantsID} == \"coke\":\n\tBuboy: The dark fizzy bottle that goes pshhhh when you pop the cap off, Kuya!\n\tBuboy: All the bubbles jump straight up my nose and make me sneeze every single sip, hehe!\nelif {Transaction_ItemWantsID} == \"water\":\n\tBuboy: Just the plain clear bottle with zero color and zero taste inside, po!\n\tBuboy: Best thing ever after carrying [i]Damulag[/i] up and down the road!\nelif {Transaction_ItemWantsID} == \"gin\":\n\tBuboy: The tall clear glass bottle that smells like rubbing alcohol for scraped knees, Kuya!\n\tBuboy: Papa sent me on a secret run for it, please don't tell Mama, hehe!\nelif {Transaction_ItemWantsID} == \"chubs\":\n\tBuboy: Those soft colorful chewy candies shaped like tiny little pillows, po!\n\tBuboy: Tried saving half in my pocket for later once and ate them all in two minutes flat, hehe!\nelif {Transaction_ItemWantsID} == \"mentor\":\n\tBuboy: The long roll of round flat candies you pop out one by one with your thumb!\n\tBuboy: Turns your whole tongue icy cold whenever you breathe in after eating one!\nelif {Transaction_ItemWantsID} == \"pocha\":\n\tBuboy: That tiny sweet wrapper candy stores hand out when you're one peso short on change, po!\n\tBuboy: Mama told me never to shout the name out loud because it sounds like a bad word, hehe!\nelif {Transaction_ItemWantsID} == \"tocino\":\n\tBuboy: That sweet pink meat from inside your cold freezer, Kuya!\n\tBuboy: Smells like caramelized candy in the frying pan and wakes up our whole house!\nelif {Transaction_ItemWantsID} == \"hotdog\":\n\tBuboy: The pack of long red sausages from the freezer that goes on sticks with marshmallows!\n\tBuboy: My favorite ulam ever, especially when the skin blisters a little in the pan, hehe!\nelif {Transaction_ItemWantsID} == \"borgir\":\n\tBuboy: Those flat round meat patties from your freezer that go right between bread buns!\n\tBuboy: Tastes just like a fast-food drive-thru even when Mama fries it at home!\nelif {Transaction_ItemWantsID} == \"nagets\":\n\tBuboy: Those bite-sized frozen chicken pieces that turn golden and crunchy in oil, Kuya!\n\tBuboy: Bet I could eat twelve of those in one sitting, no problem, hehe!\nelif {Transaction_ItemWantsID} == \"aryel\":\n\tBuboy: That super fresh-smelling laundry powder packet Mama whips into giant suds in the basin!\n\tBuboy: Stuck my nose right into the bubbles once and stung both my eyes, don't try that, Kuya!\nelif {Transaction_ItemWantsID} == \"kneestoes\":\n\tBuboy: The little bathroom shampoo sachet that sounds just like the action song from school, po!\n\tBuboy: Head, shoulders, then the two parts down below! Hehe, forgot the rest of the song!\nelif {Transaction_ItemWantsID} == \"kopimo\":\n\tBuboy: The small brown packet grown-ups stir into steaming hot mugs, Kuya!\n\tBuboy: Took one sneaky sip from Papa's cup once, super bitter, made my whole face scrunch up!\nelif {Transaction_ItemWantsID} == \"chicken\":\n\tBuboy: The flat noodle pack with a hard curly brick inside and a chicken on the wrapper, po!\n\tBuboy: Pour hot water on it and boom, instant magic soup!\nelif {Transaction_ItemWantsID} == \"pantit\":\n\tBuboy: The yellow dry-noodle pack with zero soup that you toss in soy sauce and oil!\n\tBuboy: Comes with a tiny sour calamansi packet inside that makes the whole kitchen smell like a party!\nelse:\n\tBuboy: Hala, it really flew clean out of my head, Kuya, I got distracted watching a kite!\n\tBuboy: Just guess whichever staple Mama always grabs from your shelves, po!\n[end_timeline]\n\nlabel Talk\nBuboy: Kuya, [i]Damulag[/i] is getting wiggly in my arms! Want me to describe it again?\n- Grabbing it now, Buboy!\n\t[end_timeline]\n- Repeat the clue, please.\ , championship reach, apo!\n\t- [Lean over the counter and wave.]\n\t\tLoloPilo: Ho-ho, good eyes! Most grown-ups stare right past my beard!\n\tLoloPilo: Back in sixty-eight, nobody in Karimlan could beat my wrist at the plaza games.\n\tLoloPilo: You look stiff behind that register! Care for one quick Sipa round first?\n\t- Let's play Sipa, Lolo!\n\t\tLoloPilo: Ho-ho, that's the spirit! Watch the drop and flick your ankle clean!\n\t\t[signal arg=\"minigame:sipa\"]\n\t\tif {Transaction_MinigameWon}:\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\t[signal arg=\"note:Kept up with Lolo Pilo's 1968 championship Sipa challenge right at the counter.\"]\n\t\t\tLoloPilo: Aba! Same quick ankles as your Lola! My old knees feel twenty years lighter!\n\t\telse:\n\t\t\t[signal arg=\"note:Tried a warm-up round of Sipa with Lolo Pilo at the counter.\"]\n\t\t\tLoloPilo: Haha, good hustle, apo! Rusty shopkeeper knees, good thing your coach lives nearby!\n\t- Shelves first, rematch next visit.\n\t\tLoloPilo: Fair enough, apo! Duty before glory, just keep those ankles warm for me!\n\tLoloPilo: Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], apo. Champions run on sweets!\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2: \"Shortcut Past the Mound\" (Tally Inflection #1: +1 appreciate trick / 0 fair / -1 scold)\n\t[signal arg=\"flag:pilo_punso_rattled=true\"]\n\tLoloPilo: Sus, apo, look at all this red soil on my lucky vest!\n\tLoloPilo: Some buff horse-man came galloping past my mango mound staring at a loud little phone!\n\tLoloPilo: His gadget shouted turn left, and his big hooves rattled dirt straight into my teacup!\n\tLoloPilo: Zero Tabi-tabi po! So I knotted his fancy sneakers together on the bench, hehe.\n\t- Classic trick. Still sharp, Lolo.\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Laughed along with Lolo Pilo's harmless shoelace prank on the noisy jogger.\"]\n\t\tLoloPilo: Ho-ho! Harmless little knot, apo, didn't even scuff his bright laces!\n\t\tLoloPilo: I even spun the wooden trail arrow sideways so he gets extra cardio!\n\t- Maybe he was just lost.\n\t\t[signal arg=\"note:Suggested the noisy jogger past Lolo Pilo's mango mound might just be lost.\"]\n\t\tLoloPilo: A tikbalang getting lost? Aba, that would make the ancestors fall out of their trees!\n\t\tLoloPilo: Still, manners cost zero centavos when you pass an old neighbor's roof!\n\t- Leave joggers and signs alone, Lolo.\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Scolded Lolo Pilo for pranking the jogger near the basketball half-court.\"]\n\t\tLoloPilo: Hmph. Taking the loud phone's side over an old suki, ha?\n\t\tLoloPilo: Better a knotted shoelace than a sprained ankle from a grumpy punso, apo.\n\tLoloPilo: Anyway, hand me [color=#0f6e2f]{Transaction_ItemWants}[/color] so I can dust off in peace.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3: \"Bitter Modern Taste\" (Tally Inflection #2: +1 candy sub OR +1 reassure / -1 dismiss)\n\t[signal arg=\"flag:tk_true_name_known=true\"]\n\tLoloPilo: O, apo. Brought my teks deck and sipa washer out to the plaza lines earlier.\n\tLoloPilo: Sat on the bench rattling my best washer, and not a single soul looked up.\n\tLoloPilo: Even big Tiburcio jogged past holding iced coffee and tapping buttons on that brick phone.\n\tLoloPilo: Maybe sweets and street games belong in a museum now. Give me [color=#0f6e2f]{Transaction_ItemWants}[/color] instead, apo.\n\t- [Slip him sweet candy instead.]\n\t\t[signal arg=\"allow_sub_cat:candy\"]\n\t\tLoloPilo: Oy, apo, why are your hands drifting toward the candy jars? I asked for grown-up stuff!\n\t\t[end_timeline]\n\t- Good games never go out of style.\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Reminded Lolo Pilo that real street games never go out of style, plus learned the jogger's name is Tiburcio.\"]\n\t\tLoloPilo: Heh. You really think so, apo? Even with everyone glued to little glowing bricks?\n\t\tLoloPilo: Hearing tha
