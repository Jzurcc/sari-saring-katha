t behind your Lola's counter warms an old duwende's beard.\n\t\tLoloPilo: Sige, let me try [color=#0f6e2f]{Transaction_ItemWants}[/color] just once to see the fuss.\n\t- Wait, who is big Tiburcio?\n\t\t[signal arg=\"note:Learned from Lolo Pilo that T.K.'s real name from the Kalumpang ridge is Tiburcio.\"]\n\t\tLoloPilo: Ho-ho! That buff tikbalang calling himself T.K. now! Knew him when he was all knees!\n\t\tLoloPilo: Don't tell him I spilled it, ha! Just pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], apo.\n\t- Times change. Coffee suits people better.\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Told Lolo Pilo modern coffee suits the neighborhood better than old plaza games.\"]\n\t\tLoloPilo: Ah. Straight between the eyes, apo.\n\t\tLoloPilo: Sige. Just [color=#0f6e2f]{Transaction_ItemWants}[/color] then, before I take up more counter space.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4: \"The Champion's Wager\" (Tally Inflection #3: +1 coach Sipa / 0 truce / -1 dismiss)\n\tLoloPilo: Hehe, apo, maybe I spun that wooden trail arrow a touch too well!\n\tLoloPilo: Big Tiburcio lost phone signal by the creek and circled the half-court five times!\n\tLoloPilo: Poor guy even turned his gym jersey inside out trying to break a spell!\n\tLoloPilo: Flip one quick round of Teks while an old duwende thinks this over?\n\t- Flip one round of Teks!\n\t\tLoloPilo: Ho-ho, sharp eyes on my thumb now! One, two, bagsak!\n\t\t[signal arg=\"minigame:teks\"]\n\t\tif {Transaction_MinigameWon}:\n\t\t\tLoloPilo: Aba, clean read! You caught my lucky card right out of the air!\n\t\telse:\n\t\t\tLoloPilo: Hehe, sixty-eight plaza wrist still holds the crown, apo!\n\t- Save the cards, tell me more.\n\t\tLoloPilo: Fair enough, apo, straight to the referee's table!\n\tLoloPilo: All my years under that mango tree, I've never met a tikbalang who gets himself lost.\n\tLoloPilo: Feels unsportsmanlike pranking a rookie whose hooves don't know the soil yet.\n\t- Coach him in Sipa and landmarks!\n\t\t[signal arg=\"flag:pilo_wager_set=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Encouraged Lolo Pilo to coach T.K. in Sipa footwork and old-school trail landmarks.\"]\n\t\tLoloPilo: Aba! Trade sipa footwork for real trail sense? Seven-foot student, pocket-sized coach!\n\t\tLoloPilo: Ho-ho, if those giant hooves don't crush my washer, we have a match!\n\t- Straighten the sign and call truce.\n\t\t[signal arg=\"flag:pilo_wager_set=true\"]\n\t\t[signal arg=\"note:Advised Lolo Pilo to straighten the trail arrow and settle things fairly with T.K.\"]\n\t\tLoloPilo: Fair call, apo. I'll turn the arrow straight and toss him a friendly sipa challenge instead!\n\t- Let his fancy phone guide him.\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Told Lolo Pilo to leave T.K. to his phone instead of reaching out.\"]\n\t\tLoloPilo: Harsh referee behind this counter, apo. Even a clumsy rival deserves a fair court.\n\tLoloPilo: Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color] first so I don't coach on an empty stomach!\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5: \"Hooves on the Half-Court\" (0 tallies - Ten Twist & Pair 1 Payoff)\n\tif {Flag_PiloWagerSet} or {Flag_TKRematchAccepted}:\n\t\tLoloPilo: Ho-ho, apo, you should've seen the basketball half-court earlier!\n\t\tLoloPilo: Big Tiburcio pocketed his noisy phone, bowed to my mound, and boomed Tabi-tabi po!\n\t\tif {Flag_PiloSubSweet}:\n\t\t\tLoloPilo: He even set sweet candy on my flat root stone! Did you tip him off, apo?\n\t\tLoloPilo: First kick of sipa, he punted my lead washer straight onto the barangay hall roof!\n\t\tLoloPilo: Tenth kick, he learned ankle rhythm, and half the street stopped by the fence to count!\n\t\t- Told you the court missed you.\n\t\t\tLoloPilo: Heh. Hearing kids count kicks out loud again nearly made my beard mist up, apo!\n\t\t- Did he dent the hall roof?\n\t\t\tLoloPilo: Haha! Climbed a mango branch and fetched my washer in two seconds flat!\n\t\t- Who won the final count?\n\t\t\tLoloPilo: Still the sixty-eight champ, apo, though those long legs are catching up fast!\n\telse:\n\t\tLoloPilo: O, apo. Turned that wooden trail arrow back straight by the creek earlier.\n\t\tLoloPilo: Big Tiburcio gave a polite nod jog-trotting past my mango mound, zero dust in my cup.\n\t\tLoloPilo: Quiet truce on the half-court, even if nobody stopped to kick a washer.\n\t\t- At least your teacup stays clean.\n\t\t\tLoloPilo: True enough, apo. Peace and quiet has its uses, I suppose.\n\t\t- Never too late for a game.\n\t\t\tLoloPilo: Heh. Maybe on another pass, apo, if folks ever slow their boots down.\n\tLoloPilo: Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color] for the walk back to my mound, apo.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6: \"Keeper of the Play\" (Accumulated Tally Resolution -> 3 Bespoke Outcomes)\n\tif {Flag_PiloWagerSet} and {Transaction_Tally} >= 3:\n\t\t[signal arg=\"outcome:grand_champion\"]\n\t\t[signal arg=\"flag:pilo_champion=true\"]\n\t\t[signal arg=\"note:Lolo Pilo left his 1968 Lucky Plaza Washer at the counter and vowed to tip fortune in your favor.\"]\n\t\tLoloPilo: Clear a tiny spot beside your register, apo! Brought you championship brass!\n\t\tLoloPilo: That's my lucky sixty-eight plaza washer. Won three fiestas straight with that little disc!\n\t\tLoloPilo: Rode up the Kalumpang ridge on Tiburcio's shoulder teaching him wind and bamboo markers.\n\t\tLoloPilo: Back down on the half-court, kids were chalking fresh game lines on the concrete!\n\t\t- Honored to hold it, Lolo Champ.\n\t\t\tLoloPilo: Ho-ho! Belongs on the liveliest counter in Karimlan, right where your Lola stood!\n\t\t- One victory round of Sipa, Lolo?\n\t\t\tLoloPilo: Aba, music to my ears! Show the champ your footwork, apo!\n\t\t\t[signal arg=\"minigame:sipa\"]\n\t\t\tif {Transaction_MinigameWon}:\n\t\t\t\tLoloPilo: Ho-ho! Officially passing the plaza crown to this counter, apo!\n\t\t\telse:\n\t\t\t\tLoloPilo: Haha! Close enough to make sixty-eight proud, apo!\n\t\t- [Set the brass washer beside the register.]\n\t\t\tLoloPilo: Fits right in next to your coin tray, apo!\n\t\tLoloPilo: Listen close, apo. Earth spirits under the roots feel when that Pale Queen comes collecting.\n\t\tLoloPilo: When she weighs your Lola's ledger, this old duwende stands squarely in your corner!\n\t\tLoloPilo: Now pass me [color=#0f6e2f]{Transaction_ItemWants}[/color] to toast our undefeated streak!\n\telif {Transaction_Tally} >= 1:\n\t\t[signal arg=\"outcome:happy_trickster\"]\n\t\t[signal arg=\"note:Lolo Pilo stayed a cheerful suki keeping street games alive around the plaza.\"]\n\t\tLoloPilo: Ho-ho, apo! Bounce is right back in my old boots lately!\n\t\tLoloPilo: Big Tiburcio calls out Tabi-tabi po every run, and the plaza bench feels lively again.\n\t\tLoloPilo: Good knowing your Lola's shop still makes room for an old trickster's stories.\n\t\t- Always room for you here, Lolo.\n\t\t\tLoloPilo: Salamat, apo! Keep those candy jars stocked and your ankles loose!\n\t\t- Keep that sipa washer flying, Lolo.\n\t\t\tLoloPilo: Count on it, apo! Sixty-eight form never rusts!\n\t\tLoloPilo: Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color] before my next round on the court!\n\telse:\n\t\t[signal arg=\"outcome:quiet_mound\"]\n\t\t[signal arg=\"note:Lolo Pilo kept his old street games tucked quietly inside his mango mound.\"]\n\t\tLoloPilo: O, apo. Quiet walk over from the mango mound.\n\t\tLoloPilo: Packed my old teks cards and washers neat inside my chest under the roots.\n\t\tLoloPilo: Folks move fast on paved roads now. An old duwende knows when to stay tucked away.\n\t\t- Take care under the mango tree, Lolo.\n\t\t\tLoloPilo: You too behind that counter, apo.\n\t\t- What can I get you, Lolo?\n\t\t\tLoloPilo: Straight and brisk, fair enough, apo.\n\t\tLoloPilo: Just [color=#0f6e2f]{Transaction_ItemWants}[/color] for my pantry, salamat.\n\t[end_timeline]\n\nlabel Talk\nLoloPilo: Take your time, apo. I've lived past a hundred, a minute won't hurt!\n- Almost got it, Lolo.\n\t[end_timeline]\n- Sorry Lolo, we're out of stock.\n\tLoloPilo: Ay, sayang! No worries, apo, I'll hop back over after Mario restocks!\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tLoloPilo: Salamat, apo! Still waiting on the rest whenever your hands are free!\nelif {Variation} == 2.0:\n\tLoloPilo: Pocketed that one! Take your time grabbing what's left, apo.\nelse:\n\tLoloPilo: Ho-ho, good start! My mound isn't running anywhere, apo.\n[end_timeline]\n\nlabel SubstituteItem\n[signal arg=\"flag:pilo_sub_sweet=true\"]\n[signal arg=\"tally:+1\"]\n[signal arg=\"note:Swapped Lolo Pilo's gloomy grown-up order for sweet {Transaction_SubstituteItemName}, bringing back his real laugh.\"]\nLoloPilo: Aba! Wait just a second, apo!\nLoloPilo: Since when does [color=#0f6e2f]{Transaction_SubstituteItemName}[/color] count as serious modern fare?\nLoloPilo: Ho-ho! Thank goodness! Instant coffee smells like boiled tree bark anyway!\nLoloPilo: Your Lola used to leave sweets just like this beside my mound, you know.\nLoloPilo: Keep the extra coins, apo. You saved an old champ from turning boring!\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_StoryGouged}:\n\tLoloPilo: Aba, apo! Even the lucky coins under my punso felt that markup!\n\tLoloPilo: Easy on an old neighbor's pouch next pass, ha?\nelse:\n\tLoloPilo: Ho-ho, spot on! May your coin jar stay noisy and full, apo!\n\tif {Global_TipActive}:\n\t\tLoloPilo: Fair price! Keep a little lucky change from the mound, apo!\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nLoloPilo: Hehe, nice sleight of hand, apo, except that isn't what I asked for!\n[end_timeline]\n", "purchase": "# Lolo Pilo - Unified Everyday Purchase Timeline (3-Slot Sandwich Pattern)\n# Shifts ONLY on meaningful story flags (Flag_PiloChampion / Flag_PiloSubSweet).\n# Voice: Spry, joyful 1968 plaza champ Duwende. Zero time-of-day words. Zero em-dashes.\n\nlabel Greeting\n# Slot 1: P1-P3 Reactive Opener or High-Price Remark\nif {Transaction_HasReactiveOpener}:\n\tLoloPilo: {Transaction_ReactiveOpener}\nelif {Global_HighPriceActive}:\n\tLoloPilo: Aba, apo, prices jumped higher than a championship sipa kick! Easy on my pouch, ha?\n\n# Slot 2: Upfront Utang Ask OR Flag-Driven Request Pool (4 grounded variations per state)\nif {Transaction_WantsDebt}:\n\tLoloPilo: Ay, naku, apo! Reached into my vest for [color=#0f6e2f]{Transaction_ItemWants}[/color] and pulled out three shiny pebbles instead of coins!\n\tLoloPilo: Put it on your lista for old Lolo Pilo? I'll bring real pesos on my next hop over!\n\t- Sure Lolo, on the lista.\n\t\t[signal arg=\"utang_accepted\"]\n\t\tLoloPilo: Ho-ho, salamat, apo! Grab [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever you're ready!\n\t- Sorry Lolo, register's tight right now.\n\t\t[signal arg=\"utang_rejected\"]\n\t\tLoloPilo: Fair rules, apo! Even plaza games need a strict referee. Let me fetch my coin tin!\nelif {Flag_PiloChampion}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tLoloPilo: Ho-ho, my favorite doubles partner! Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], apo!\n\telif {Transaction_GreetingVar} < 50:\n\t\tLoloPilo: Half-court's lively again, apo! Let me refuel with [color=#0f6e2f]{Transaction_ItemWants}[/color]!\n\telif {Transaction_GreetingVar} < 75:\n\t\tLoloPilo: Worked up an appetite coaching big hooves down the road! Got [color=#0f6e2f]{Transaction_ItemWants}[/color], apo?\n\telse:\n\t\tLoloPilo: Undefeated service behind this counter! [color=#0f6e2f]{Transaction_ItemWants}[/color] please, apo!\nelif {Flag_PiloSubSweet}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tLoloPilo: No bitter grown-up drinks for me! Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], apo!\n\telif {Transaction_GreetingVar} < 50:\n\t\tLoloPilo: Still got your candy wrapper in my lucky vest! Got [color=#0f6e2f]{Transaction_ItemWants}[/color] on the shelf, apo?\n\telif {Transaction_GreetingVar} < 75:\n\t\tLoloPilo: Hopped over from the mango mound for a real treat! Let me get [color=#0f6e2f]{Transaction_ItemWants}[/color], apo.\n\telse:\n\t\tLoloPilo: Ho-ho! Coins ready on the wood! [color=#0f6e2f]{Transaction_ItemWants}[/color] for old Lolo Pilo, ha?\nelse:\n\tif {Transaction_GreetingVar} < 25:\n\t\tLoloPilo: Ho-ho! No need for Tabi-tabi po, apo, I'm visiting your counter! Got [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telif {Transaction_GreetingVar} < 50:\n\t\tLoloPilo: Spry knees brought me straight from the mango mound! Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], apo!\n\telif {Transaction_GreetingVar} < 75:\n\t\tLoloPilo: Shelves look lucky and neat, apo! Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color] when you're free.\n\telse:\n\t\tLoloPilo: O, apo! Taking a breather from the plaza bench. [color=#0f6e2f]{Transaction_ItemWants}[/color] please!\n[end_timeline]\n\nlabel Talk\nLoloPilo: Take your time, apo! Still looking for [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever your hands are free!\n- Coming right up, Lolo!\n\t[end_timeline]\n- Sorry Lolo, we're out of stock.\n\tLoloPilo: Ay, sayang! No harm done, apo, I'll bounce back after Mario delivers!\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tLoloPilo: Salamat, apo! Just [color=#0f6e2f]{Transaction_ItemWants}[/color] left on my craving list!\nelif {Variation} == 2.0:\n\tLoloPilo: Tucked that away! Still need [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever you spot it, apo.\nelse:\n\tLoloPilo: Ho-ho, half the trick done! Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] next, apo!\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_WantsDebt}:\n\tLoloPilo: Salamat, apo! Write Lolo Pilo neat on that lista, real coins coming soon!\nelse:\n\tif {Global_TipActive}:\n\t\tLoloPilo: Aba, fair price! Keep a little lucky change from the punso, apo!\n\telif {Transaction_SatisfyVar} < 34:\n\t\tLoloPilo: Ho-ho, just the thing! May your coin jar never run dry, apo!\n\telif {Transaction_SatisfyVar} < 67:\n\t\tLoloPilo: Salamat, apo! Nothing beats a counter with quick hands and good cheer!\n\telse:\n\t\tLoloPilo: Spot on! Don't forget to wiggle your ankles behind that register, ha!\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Repayment\nLoloPilo: Before anything else, apo, real pesos this time! Here's the {Transaction_RepaymentAmount} pesos I owed!\n- Thanks, Lolo Pilo. All clear!\n\t[signal arg=\"repay_debt\"]\n\tLoloPilo: Ho-ho! Clean slate on the lista, just how a champion likes it!\n- Keep it, Lolo. On the house!\n\t[signal arg=\"forgive_debt\"]\n\tLoloPilo: Aba! Generous just like your Lola! May double that fortune roll back to your shelves, apo!\n- No rush, Lolo. Pay next pass.\n\t[signal arg=\"defer_repay\"]\n\tLoloPilo: Hehe, easygoing referee! I'll keep these coins warm in my vest for next visit, apo!\n[end_timeline]\n\nlabel WrongItem\nLoloPilo: Hehe, trying to pull a fast one on a duwende? I asked for [color=#0f6e2f]{Transaction_ItemWants}[/color], apo!\n[end_timeline]\n", "visit": "# Lolo Pilo - Unified Social Visit & Optional Street Game Timeline\n# Voice: Joyful, spry 1968 plaza champion Duwende. Zero time-of-day words. Zero em-dashes.\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tLoloPilo: {Transaction_ReactiveOpener}\nif {Transaction_VisitVar} < 34:\n\tLoloPilo: Ho-ho! Just resting my boots under your awning, apo. Best breeze on the road!\n\tLoloPilo: Brought my game pouch along in case your hands want a quick break from counting coins!\nelif {Transaction_VisitVar} < 67:\n\tLoloPilo: O, apo! Quiet stretch on the half-court, so I hopped over to check on your counter.\n\tLoloPilo: Care for a friendly round with the sixty-eight plaza champ?\nelse:\n\tLoloPilo: Hehe, caught you standing still behind that register again, apo!\n\tLoloPilo: Spare a minute for a quick street game to keep the good luck rolling?\n- Sure Lolo, let's play!\n\tLoloPilo: Ho-ho, eyes sharp now! Show me what you've got, apo!\n\t[signal arg=\"minigame:lolo_pilo_random\"]\n\tif {Transaction_MinigameWon}:\n\t\tLoloPilo: Bravo, apo! Quick wrists and sharp eyes, your Lola would be beaming!\n\telse:\n\t\tLoloPilo: Haha, good match! Still takes practice to dethrone the mound champion, apo!\n- Hands are full right now, Lolo.\n\tLoloPilo: Duty first, apo! Keep those shelves tidy and save me a rematch next visit!\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Smalltalk\nif {Transaction_VisitVar} < 34:\n\tLoloPilo: Watching neighbors pass your counter reminds me of the old fiesta crowds, apo.\n\tLoloPilo: Alright, back to the mango mound I go. Stretch your legs soon, ha!\nelif {Transaction_VisitVar} < 67:\n\tLoloPilo: A little play keeps mortal and duwende hearts young alike, apo!\n\tLoloPilo: Keep your eyes peeled for my next challenge!\nelse:\n\tLoloPilo: Hehe, if your broom moves an inch by itself, don't blame me, apo!\n\tLoloPilo: Take care behind that counter!\n[end_timeline]\n"}, "tk": {"story": "# T.K. - 6-Chapter Core Arc (Pair 1 - Character #2)\n# Voice: Upbeat, buff, modern-life-loving Tikbalang adventurer who relies on his Nokia GPS because he gets himself lost.\n# Rules: 90-95% English with light Filipino sprinkles. Zero parentheses. Zero time-of-day words. Zero em-dashes.\n# Substitute Category: bottle ONLY in Ch. 3 (decided via dialogue choice -> allow_sub_cat:bottle).\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tTK: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} == 0.0:\n\t# Chapter 1: \"Pin on the Map\" (0 tallies)\n\tTK: Whew! Left by the balete, past the yellow fence, boom! Found your counter right on schedule!\n\tTK: Call me T.K., boss. Just moved down from the Kalumpang ridge to try proper barangay life!\n\tTK: Tell you what, paved street signs and this chunky Nokia GPS are humanity's finest inventions!\n\t- Welcome to Karimlan, T.K.\n\t\tTK: Salamat, boss! Already saved your storefront as Home Pin Number One on my keypad!\n\t- Took the scenic turn getting here?\n\t\tTK: Haha, sharp eyes! Not lost, boss, just testing extra cardio loops!\n\t- Cold drinks coming right up.\n\t\tTK: Solid! Electric fridges beat lukewarm mountain spring water any visit of the week!\n\tTK: Modern life really spoils a traveler, boss. Sneakers, cold coolers, maps that talk back!\n\tTK: Hook me up with [color=#0f6e2f]{Transaction_ItemWants}[/color] so I can rehydrate before my next lap!\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2: \"Inside-Out Pants\" (Tally Inflection #1: +1 trapdoor OR +1 kind laugh / 0 tech / -1 mock)\n\tTK: Uy, boss, don't mind the seams. Wearing my hike pants inside out for, uh, airflow!\n\tTK: My Nokia swore the shortcut past the basketball half-court was a straight line to your awning.\n\tTK: Next blink, my laces are knotted to a bench and I've circled the same mango tree four times!\n\tTK: Lean in, boss. Folklore says tikbalangs lead folks astray, right? I'm the one tikbalang who gets himself lost!\n\tTK: That's why I love this Nokia GPS so much. Only thing keeping me out of the next province!\n\tif {Flag_PiloPunsoRattled}:\n\t\t- You skipped Tabi-tabi po by Pilo's mound!\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\t[signal arg=\"note:Tipped T.K. off that he rattled Lolo Pilo's mango mound without saying Tabi-tabi po.\"]\n\t\t\tTK: Wait, the mango tree behind the half-court has a duwende mound?!\n\t\t\tTK: Grabe, no wonder my sneakers tied themselves! That explains everything, boss!\n\t- Your secret's safe. Nice inside-out shirt.\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Kept T.K.'s funny directional secret safe and laughed kindly with him about his inside-out jersey.\"]\n\t\tTK: Haha, salamat, boss! Old habit from the ridge, baliktad shirt whenever the road spins!\n\t\tTK: Good knowing I don't have to pretend I'm a scary forest guide at this counter.\n\t- Maybe recalibrate your phone compass.\n\t\t[signal arg=\"note:Suggested T.K. recalibrate his Nokia GPS compass after his detour by the half-court.\"]\n\t\tTK: Good call, boss! Gotta check the settings once I catch my breath!\n\t- A tikbalang getting lost? Pretty embarrassing.\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Teased T.K. harshly about being a tikbalang with zero sense of direction.\"]\n\t\tTK: Ouch, boss. Hear enough of that from my uncles up on the mountain.\n\t\tTK: Whatever. Just grab my trail fuel so I can hit the road.\n\tTK: Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color] when you're free, boss. Four extra laps burned serious calories!\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3: \"One Bar Battery\" (Single sunshower nod + True Name Reveal + allow_sub_cat:bottle -> +1 on SubstituteItem)\n\t[signal arg=\"flag:tk_true_name_known=true\"]\n\tTK: Hey, don't look at me because of that sunny drizzle outside, boss! Nobody's getting married, I swear!\n\tTK: Rough trek. My Nokia battery died past the Kalumpang trailhead, and I walked straight into rice paddies!\n\tTK: Worse, an old neighbor recognized me and yelled my full mountain name across the whole canal!\n\tTK: Tiburcio Kalumpang. There, said it! Imagine a guy my size answering to Tiburcio at the gym!\n\tTK: Makes me feel like I'm just playing dress-up in sneakers. Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], boss, old habit.\n\t- [Swap smoke for a cold bottle.]\n\t\t[signal arg=\"allow_sub_cat:bottle\"]\n\t\tTK: Huh, boss? Why are you eyeing the cooler? I asked for smokes, same as my uncles!\n\t\t[end_timeline]\n\t- Tiburcio's a strong classic name.\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Reassured T.K. that his birth name Tiburcio Kalumpang is nothing to be ashamed of.\"]\n\t\tTK: Wait, you're not laughing? Most folks expect a grandpa in a rocking chair, not me!\n\t\tTK: Salamat, boss. Still sticking to T.K. on the court, though you can keep that secret.\n\t\tTK: Alright, hand over [color=#0f6e2f]{Transaction_ItemWants}[/color] while my phone cools off.\n\t- Pack spare batteries and stay home.\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Told T.K. to just rely on spare batteries and stay off the tougher trails.\"]\n\t\tTK: Yeah, maybe you're right, boss. No point hiking if one dead battery turns me around.\n\t\tTK: Just [color=#0f6e2f]{Transaction_ItemWants}[/color], salamat.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4: \"Offline Navigation\" (Tally Inflection #3: +2 trapdoor / +1 respect / -1 stay on screen)\n\tTK: Uy, boss. Been staring at my Nokia screen since the creek bend, thinking hard.\n\tTK: Truth is, a real adventurer shouldn't panic every time a keypad battery hits zero.\n\tTK: Plus I owe Lolo Pilo a proper apology for stomping past his mango mound glued to my map.\n\tTK: How does a seven-foot modern gym horse make peace with a sixty-eight plaza legend?\n\tif {Flag_PiloWagerSet} or {Flag_PiloSubSweet}:\n\t\t- Bring candy and play him at Sipa!\n\t\t\t[signal arg=\"flag:tk_rematch_accepted=true\"]\n\t\t\t[signal arg=\"tally:+2\"]\n\t\t\t[signal arg=\"note:Advised T.K. to bring sweet candy for Lolo Pilo's mound and accept his Sipa challenge.\"]\n\t\t\tTK: Sipa?! With hooves this size?! Haha, I might kick that washer into orbit, boss!\n\t\t\tTK: Sweet candy for the mound and a fair match. Solid game plan, I'm in!\n\t- Pocket the phone and say Tabi-tabi po.\n\t\t[signal arg=\"flag:tk_rematch_accepted=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Told T.K. to pocket his Nokia and greet Lolo Pilo properly with Tabi-tabi po.\"]\n\t\tTK: Fair and simple, boss. Eyes off the screen, proper bow to the old champ's tree.\n\t\tTK: Who knows, maybe he'll even teach me a trick or two about reading trails!\n\t- Stick to paved roads with signal.\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Advised T.K. to stick to paved streets with strong phone signal instead of visiting Lolo Pilo.\"]\n\t\tTK: Yeah, safer sticking where the five bars stay steady, I guess.\n\t\tTK: Shame though. Feels like I'm still dodging half the barangay.\n\tTK: Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color] first, boss, gotta fuel up!\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5: \"Sipa and Landmarks\" (0 tallies - Ten Twist & Pair 1 Payoff)\n\tif {Flag_TKRematchAccepted} or {Flag_PiloWagerSet}:\n\t\tTK: Uy, boss! Check the jersey, right-side out, and my Nokia's clipped tight on my belt!\n\t\tTK: Went to the mango mound, boomed Tabi-tabi po, and took Lolo Pilo's Sipa challenge!\n\t\tTK: First kick launched his washer onto the barangay hall roof, then he drilled my ankle flick!\n\t\tTK: Best part? Carried him up the Kalumpang ridge on my shoulder so he could teach me moss and wind markers!\n\t\tTK: Best of both worlds now, boss. Five bars on the road, Lolo Pilo's landmarks in the woods!\n\t\t- Jersey's right-side out! Big progress!\n\t\t\tTK: Haha, zero wrong turns getting here! Even the balete bend looks crystal clear now!\n\t\t- How's the barangay hall roof holding?\n\t\t\tTK: Not a scratch, boss! Climbed up and grabbed his washer before the tanods even noticed!\n\t\t- Lolo Pilo make a tough coach?\n\t\t\tTK: Grabe, boss, tougher than any trainer! Made me keep ten kicks straight before letting me sit!\n\telse:\n\t\tTK: Uy, boss! Picked up two extra spare batteries for my Nokia down at the market!\n\t\tTK: Still steering wide around the mango mound just in case, though I wave politely when passing.\n\t\tTK: Guess old tricks and new gadgets run on separate lanes, ha?\n\t\t- Spare batteries never hurt on hikes.\n\t\t\tTK: True that, boss! Prepared is prepared, even if I still double-check every corner.\n\t\t- Still time to say hello to Pilo.\n\t\t\tTK: Maybe on a slower lap, boss! Right now I'm just sticking to the map pins.\n\tTK: Hook me up with [color=#0f6e2f]{Transaction_ItemWants}[/color], boss, worked up a real sweat!\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6: \"Base Camp Karimlan\" (Accumulated Tally Resolution -> 3 Bespoke Outcomes)\n\tif {Flag_TKRematchAccepted} and {Transaction_Tally} >= 3:\n\t\t[signal arg=\"outcome:trail_warden\"]\n\t\t[signal arg=\"flag:tk_trail_warden=true\"]\n\t\t[signal arg=\"note:T.K. gifted his Woven Travel Bandana threaded with a shed golden mane spine and claimed Karimlan as home.\"]\n\t\tTK: Hold up, boss! Put this right beside your register before I forget!\n\t\tTK: My woven travel bandana. Look close at the hem, see that single golden spine stitched in?\n\t\tTK: Old stories say mortals have to wrestle a tikbalang to win a mane spine. Forget that, friends get one freely.\n\t\tTK: Just guided a lost tricycle rider past the balete without checking my phone once, then played doubles with Lolo Pilo!\n\t\tif {Flag_TKTrueNameKnown}:\n\t\t\t- Honored to keep it, Tiburcio.\n\t\t\t\tTK: Haha, alright, you earned the right to call me Tiburcio behind this counter, boss!\n\t\t- Best trail guide in Karimlan.\n\t\t\tTK: Still keep my Nokia for the timer, boss, though my hooves finally know home!\n\t\t- [Fold the bandana neatly beside the register.]\n\t\t\tTK: Solid spot for it! Looks right at home on your counter wood!\n\t\tTK: Real talk, boss. Word on the ridge says that Pale Queen from Biringan comes weighing ledgers soon.\n\t\tTK: When she steps up to your awning, Karimlan's trail warden is standing right out front with you!\n\t\tTK: Now pass me [color=#0f6e2f]{Transaction_ItemWants}[/color] for the road, Home Pin Number One!\n\telif {Transaction_Tally} >= 1:\n\t\t[signal arg=\"outcome:modern_strider\"]\n\t\t[signal arg=\"note:T.K. settled in as a friendly, energetic regular who always calls out Tabi-tabi po past the mound.\"]\n\t\tTK: Uy, boss! Feeling right at home pounding these paved Karimlan roads!\n\t\tTK: Always shout a loud Tabi-tabi po past Lolo Pilo's mango tree now, zero knotted shoelaces!\n\t\tTK: Appreciate you keeping this counter stocked and welcoming for a mountain guy trying modern life!\n\t\t- Always got cold drinks ready, T.K.\n\t\t\tTK: Salamat, boss! Best pit stop on the whole barangay map!\n\t\t- Keep those laces double-knotted, T.K.\n\t\t\tTK: Haha, only by my own hands from here on out, boss!\n\t\tTK: Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color] before my next ridge lap!\n\telse:\n\t\t[signal arg=\"outcome:restless_wanderer\"]\n\t\t[signal arg=\"note:T.K. stayed a polite passing traveler relying strictly on his Nokia map pins.\"]\n\t\tTK: Uy, boss. Quick pit stop before my Nokia battery dips below three bars.\n\t\tTK: Paved roads are handy for a restock, though I'll probably keep moving along the highway trails.\n\t\t- Safe travels on the road, T.K.\n\t\t\tTK: Salamat, boss. Keep the cooler running cold.\n\t\t- What can I grab for you?\n\t\t\tTK: Fast and easy, just how I like a pit stop.\n\t\tTK: Just [color=#0f6e2f]{Transaction_ItemWants}[/color] for my pack, salamat.\n\t[end_timeline]\n\nlabel Talk\nTK: No rush, boss! Just stretching my calves while my phone grabs signal.\n- Almost got it, T.K.\n\t[end_timeline]\n- Sorry T.K., we're out of stock.\n\tTK: Aw, sayang! All good, boss, I'll jog back after Mario drops off crates!\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tTK: Solid start, boss! Still need the rest for my trail pack!\nelif {Variation} == 2.0:\n\tTK: Stashed that one! Take your time grabbing what's left, boss!\nelse:\n\tTK: Nice! No hurry on the rest, my knees appreciate the breather!\n[end_timeline]\n\nlabel SubstituteItem\n[signal arg=\"flag:tk_sub_hydrate=true\"]\n[signal arg=\"tally:+1\"]\n[signal arg=\"note:Swapped T.K.'s frazzled cigarette request for cold {Transaction_SubstituteItemName} to keep his athletic streak alive.\"]\nTK: Whoa, wait a second, boss!\nTK: Handing me [color=#0f6e2f]{Transaction_SubstituteItemName}[/color] instead of smokes?\nTK: Haha, fair play! Nearly wrecked six months of trail cardio over one dead Nokia battery!\nTK: Grabe, you look out for your regulars better than my gym spotter!\nTK: Keep the change, boss. Cold hydration wins every round!\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_StoryGouged}:\n\tTK: Whoa, heavy price tag, boss! Almost felt like hiking uphill with a boulder!\n\tTK: Go a little easier on your Home Pin regular next pass, ha?\nelse:\n\tTK: Solid! Exactly what my legs needed, boss!\n\tif {Global_TipActive}:\n\t\tTK: Fair rate, boss! Keep the extra coins for your cooler bill!\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nTK: Uh, wrong trail marker, boss! Not quite what I asked for!\n[end_timeline]\n", "purchase": "# T.K. - Unified Everyday Purchase Timeline (3-Slot Sandwich Pattern)\n# Shifts ONLY on meaningful story flags (Flag_TKTrailWarden / Flag_TKSubHydrate).\n# Voice: Buff, upbeat modern-life-loving Tikbalang adventurer. Zero time-of-day words. Zero em-dashes.\n\nlabel Greeting\n# Slot 1: P1-P3 Reactive Opener or High-Price Remark\nif {Transaction_HasReactiveOpener}:\n\tTK: {Transaction_ReactiveOpener}\nelif {Global_HighPriceActive}:\n\tTK: Whoa, steep climb on those prices, boss! Hope my coin pouch survives this lap!\n\n# Slot 2: Upfront Utang Ask OR Flag-Driven Request Pool (4 grounded variations per state)\nif {Transaction_WantsDebt}:\n\tTK: Uy, boss, minor gear mishap! Jogged over for [color=#0f6e2f]{Transaction_ItemWants}[/color] and left my wallet in my hiking pack!\n\tTK: Put it on your lista for me? I'll sprint right back with cash on my next pass!\n\t- Sure T.K., on the lista.\n\t\t[signal arg=\"utang_accepted\"]\n\t\tTK: Lifesaver, boss! Pass over [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever your hands are free!\n\t- Sorry T.K., register's tight right now.\n\t\t[signal arg=\"utang_rejected\"]\n\t\tTK: Fair enough, boss! Extra sprint home for my wallet counts as bonus cardio!\nelif {Flag_TKTrailWarden}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tTK: Uy, boss! Zero wrong turns getting here! Hook me up with [color=#0f6e2f]{Transaction_ItemWants}[/color]!\n\telif {Transaction_GreetingVar} < 50:\n\t\tTK: Just guided a lost parcel rider past the balete! Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], boss!\n\telif {Transaction_GreetingVar} < 75:\n\t\tTK: Nokia stayed in my pocket the whole run! Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color], boss!\n\telse:\n\t\tTK: Base camp refuel! Got [color=#0f6e2f]{Transaction_ItemWants}[/color] ready behind the counter, boss?\nelif {Flag_TKSubHydrate}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tTK: Clean lungs, strong stride! Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], boss!\n\telif {Transaction_GreetingVar} < 50:\n\t\tTK: Zero smoke, pure stamina! Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color] for the road, boss!\n\telif {Transaction_GreetingVar} < 75:\n\t\tTK: Shaved a full minute off my ridge lap! Got [color=#0f6e2f]{Transaction_ItemWants}[/color] on hand, boss?\n\telse:\n\t\tTK: Uy, boss! Stopping by Home Pin Number One for [color=#0f6e2f]{Transaction_ItemWants}[/color]!\nelse:\n\tif {Transaction_GreetingVar} < 25:\n\t\tTK: Uy, boss! Five bars on the Nokia and zero detours! Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color]!\n\telif {Transaction_GreetingVar} < 50:\n\t\tTK: Just wrapped a heavy set down the road! Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color], boss!\n\telif {Transaction_GreetingVar} < 75:\n\t\tTK: Best cooler in Karimlan! Got [color=#0f6e2f]{Transaction_ItemWants}[/color] ready, boss?\n\telse:\n\t\tTK: Quick pit stop before the Kalumpang trailhead! [color=#0f6e2f]{Transaction_ItemWants}[/color] please, boss!\n[end_timeline]\n\nlabel Talk\nTK: Take your time, boss! Still looking for [color=#0f6e2f]{Transaction_ItemWants}[/color] while I catch my breath!\n- Coming right up, T.K.\n\t[end_timeline]\n- Sorry T.K., we're out of stock.\n\tTK: Aw, sayang! All good, boss, I'll check back after your next delivery!\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tTK: Solid! Still waiting on [color=#0f6e2f]{Transaction_ItemWants}[/color] for my pack, boss!\nelif {Variation} == 2.0:\n\tTK: Got that stowed! Just [color=#0f6e2f]{Transaction_ItemWants}[/color] left whenever you're free!\nelse:\n\tTK: Nice! No rush on [color=#0f6e2f]{Transaction_ItemWants}[/color], boss, stretching my shoulders!\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_WantsDebt}:\n\tTK: Salamat, boss! Put T.K. right on that lista, cash coming next run!\nelse:\n\tif {Global_TipActive}:\n\t\tTK: Solid price, boss! Keep the change, appreciate the fair deal!\n\telif {Transaction_SatisfyVar} < 34:\n\t\tTK: Boom, fuel topped off! Catch you on my next lap, boss!\n\telif {Transaction_SatisfyVar} < 67:\n\t\tTK: Salamat, boss! Best pit stop on the map!\n\telse:\n\t\tTK: Ready for another five kilometers! Take care behind that counter, boss!\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Repayment\nTK: First up, boss, grabbed my wallet! Here's the {Transaction_RepaymentAmount} pesos from my lista!\n- Thanks, T.K. All squared up!\n\t[signal arg=\"repay_debt\"]\n\tTK: Clean slate, boss! Feels great settling up fair and square!\n- Keep it, T.K. On the house!\n\t[signal arg=\"forgive_debt\"]\n\tTK: Wait, seriously?! Grabe, boss, let me haul your next heavy delivery crate for free!\n- No rush, T.K. Pay next pass.\n\t[signal arg=\"defer_repay\"]\n\tTK: Solid as always, boss! Tying a knot in my pack strap so I don't forget!\n[end_timeline]\n\nlabel WrongItem\nTK: Whoa, wrong turn on the shelf, boss! I asked for [color=#0f6e2f]{Transaction_ItemWants}[/color]!\n[end_timeline]\n", "visit": "# T.K. - Unified Social Visit & Trail Breather Timeline\n# Voice: Buff, upbeat modern-life-loving Tikbalang adventurer. Zero time-of-day words. Zero em-dashes.\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tTK: {Transaction_ReactiveOpener}\nif {Transaction_VisitVar} < 34:\n\tTK: Uy, boss! Just cooling down under your awning after a steep hill sprint.\n\tTK: Still blows my mind how smooth paved roads feel under proper sneakers!\nelif {Transaction_VisitVar} < 67:\n\tTK: Checking my Nokia map pins under your shade, boss. Best signal spot on the road!\n\tTK: Holler if any heavy delivery boxes need lifting behind the counter!\nelse:\n\tTK: Just passing through, boss! Knees nearly hit my chin tying my laces out front, haha!\n\tTK: Good seeing your storefront bright and busy!\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Smalltalk\nif {Transaction_VisitVar} < 34:\n\tTK: Heart rate's back to normal! Time to hit the road again, boss!\nelif {Transaction_VisitVar} < 67:\n\tTK: Five bars locked in! Catch you on my next trail pass, boss!\nelse:\n\tTK: Alright, legs are itching to move! Stay strong behind that counter, boss!\n[end_timeline]\n"}, "rodel": {"story": "# Rodel - 6-Chapter Core Arc (Pair 2 - Character #1)\n# Voice: Courteous, slightly formal Ilokano Litao water anito — earnest coastal outsider tending Karimlan's creek.\n# Rules: 90-95% English with light Ilokano/Filipino sprinkles. Zero parentheses. Zero time-of-day words. Zero em-dashes.\n# Substitute Category: bottle ONLY in Ch. 3 (decided via dialogue choice -> allow_sub_cat:bottle).\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tRodel: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} == 0.0:\n\t# Chapter 1: \"Stranded Inland\" (0 tallies)\n\tRodel: Dayu-dayu. Pardon me, keeper of the counter. Is that drinking water sealed inside clear plastic?\n\tRodel: Inland life is full of small puzzles. I am Rodel, up from the northern coast.\n\tRodel: A Litao of the river bamboo and surf. Not a sirena. Not a siyokoy.\n\t- Welcome inland, Rodel.\n\t\tRodel: Salamat. Your street is drier than salt wind, though your awning casts fair shade.\n\t- Wait, what is a Litao?\n\t\tRodel: Ah. No fault of yours, keeper. Even the mainland storybooks forgot our name long ago.\n\t- [Tap the chilled glass cooler.]\n\t\tRodel: Cold rain kept behind clear glass! Remarkable craft.\n\tRodel: My throat still expects sea mist after walking that concrete road.\n\tRodel: May I purchase [color=#0f6e2f]{Transaction_ItemWants}[/color] from your counter?\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2: \"The Tinned Sea\" (Tally Inflection #1: +1 remember / 0 blunt / -1 siyokoy)\n\tRodel: Pardon my staring, keeper. You seal whole silver fish inside neat little metal drums?\n\tRodel: Land folk carry the ocean in their pockets while forgetting who guarded its tides.\n\tRodel: On the bridge earlier, a tricycle driver waved and called me that siyokoy from the creek.\n\tRodel: Everyone remembers the sirena and the siyokoy. Nobody inland has called out Litao in a century.\n\t- I'll remember it. Welcome, Litao.\n\t\t[signal arg=\"flag:rodel_name_remembered=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Greeted Rodel properly as a Litao, warming the overlooked northern water spirit.\"]\n\t\tRodel: You said it cleanly. Not once did you mix it up with a mermaid.\n\t\tRodel: Salamat, keeper. A name spoken plainly carries real weight far from shore.\n\t- Sirenas just stole the spotlight.\n\t\t[signal arg=\"note:Agreed with Rodel that Sirena tales overshadowed the older Litao folklore.\"]\n\t\tRodel: Fair enough. Songs travel farther than quiet bamboo guardians.\n\t- Aren't you basically a siyokoy?\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Mistook Rodel for a siyokoy, poking his sore spot about being forgotten.\"]\n\t\tRodel: No. Though I suppose every inlander lumps the whole ocean into one basket.\n\tRodel: Let me study inland customs further. Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3: \"Name on the Water\" (Tally Inflection #2: +1 bottle sub OR +1 affirm / -1 assimilate)\n\tRodel: Dayu-dayu, keeper. Spent hours pulling tangled plastic wrappers out of the creekside bamboo roots.\n\tRodel: Folks toss wrappers off the bridge without looking down, as if the creek takes care of itself.\n\tif {Flag_RodelNameRemembered}:\n\t\tRodel: At least behind this counter, someone actually remembers who tends the bank.\n\tRodel: Perhaps I stick out too much inland. I should eat dry land rations like everyone else.\n\tRodel: May I have [color=#0f6e2f]{Transaction_ItemWants}[/color], keeper?\n\t- [Slide him a cold bottle instead.]\n\t\t[signal arg=\"allow_sub_cat:bottle\"]\n\t\tRodel: Pardon me, keeper, your hand moved toward the cooler. I asked for dry goods.\n\t\t[end_timeline]\n\t- Your coastal ways belong here too.\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Assured Rodel that his northern coastal customs and care for the creek belong in Karimlan.\"]\n\t\tRodel: Kind words, keeper. Though my tongue still wonders how dry crunch keeps anyone hydrated.\n\t\tRodel: Sige, pass me [color=#0f6e2f]{Transaction_ItemWants}[/color] and I shall try it properly.\n\t- Dry packs are what locals eat.\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Told Rodel to blend in with dry inland rations instead of holding onto coastal habits.\"]\n\t\tRodel: Understood. When far from the sea, one adapts or dries out.\n\t\tRodel: Just [color=#0f6e2f]{Transaction_ItemWants}[/color], salamat.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4: \"Shade by the Creek\" (Tally Inflection #3: +2 trapdoor / +1 shelter / -1 shoo — single organic Pair 2 crossover)\n\tRodel: Dayu-dayu, keeper. My bamboo clump by the creek finally looks clear of wrappers, yet I caught an unexpected guest.\n\tRodel: That bright Sarimanok ducked beneath my canes panting, shaking off folks trying to pluck lucky tail feathers.\n\tRodel: Strange pair we made under one shadow. One spirit nobody recognizes, and one spirit nobody leaves alone.\n\tRodel: Part of me wanted my quiet bank back to myself.\n\tif {Flag_SmkSubFish} or {Flag_RodelNameRemembered}:\n\t\t- Share the shade. Outsiders stick together.\n\t\t\t[signal arg=\"flag:rodel_sheltered_bird=true\"]\n\t\t\t[signal arg=\"tally:+2\"]\n\t\t\t[signal arg=\"note:Encouraged Rodel to share his cleared creekside bamboo shade with the harried Sarimanok.\"]\n\t\t\tRodel: Outsiders together. Being chased like a painted charm is no gentler than being forgotten.\n\t\t\tRodel: Very well, keeper. There is cool shade enough for two travelers under those canes.\n\t- Let the bird catch its breath.\n\t\t[signal arg=\"flag:rodel_sheltered_bird=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Advised Rodel to let Sarimanok rest quietly in his creekside bamboo clump.\"]\n\t\tRodel: Fair counsel. A proper bank does not turn away a weary guest, feathers or scales.\n\t\tRodel: I shall keep the bamboo still until its breath returns.\n\t- Shoo it out. That's your bank.\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Told Rodel to guard his bamboo bank and shoo Sarimanok away.\"]\n\t\tRodel: Spoken plainly. I came inland for quiet water, not to shelter noisy royalty.\n\tRodel: Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color] when your hands are free, keeper.\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5: \"Rice Cake by the Roots\" (0 tallies - Rodel's OWN Ten Payoff)\n\tif {Flag_RodelNameRemembered} or {Flag_RodelShelteredBird}:\n\t\tRodel: Dayu-dayu, keeper. Walked down to the creek expecting fresh litter, and stopped dead in my tracks.\n\t\tRodel: Someone left a clean banana leaf with rice cake right beside the bamboo roots. Proper atang.\n\t\tRodel: And a boy crossing the bridge called down, Dayu-dayu, Litao, thank you for clearing the bank!\n\t\tif {Flag_SmkHonoredRodel}:\n\t\t\tRodel: Even that bright rooster folded its wings by the stones until the kids greeted me first.\n\t\tRodel: A hundred years inland, and a single street finally knows who minds the water.\n\t\t- You earned that rice cake, Rodel.\n\t\t\tRodel: Sweetest inland meal I have tasted since leaving Vigan, keeper.\n\t\t- Sounds like Karimlan's learning your name.\n\t\t\tRodel: Even one clean bank and one warm counter feels like a whole shore returning.\n\t\t- No more plastic wrappers in the roots?\n\t\t\tRodel: Not a single one, keeper. Even the creek water ran clearer by the bend.\n\telse:\n\t\tRodel: Dayu-dayu, keeper. Cleared another bundle of drift from the creek bank earlier.\n\t\tRodel: Quiet water, quiet bamboo, though nobody on the bridge paused to look down.\n\t\tRodel: Perhaps a coastal spirit is meant to tend the edge unseen.\n\t\t- Quiet work still matters, Rodel.\n\t\t\tRodel: True enough, keeper. The bamboo knows, even if the street rushes past.\n\t\t- Maybe neighbors will notice soon.\n\t\t\tRodel: Perhaps, keeper. In time, if anyone slows down long enough to look.\n\tRodel: May I take [color=#0f6e2f]{Transaction_ItemWants}[/color] for the walk back to the bank?\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6: \"The Tide Remembers\" (Accumulated Tally Resolution -> 3 Bespoke Outcomes)\n\tif ({Flag_RodelNameRemembered} or {Flag_RodelShelteredBird}) and {Transaction_Tally} >= 3:\n\t\t[signal arg=\"outcome:remembered_anito\"]\n\t\t[signal arg=\"flag:rodel_remembered_anito=true\"]\n\t\t[signal arg=\"note:Rodel placed a sea-smoothed river stone by the register and vowed to stand witness at Mayari's Convergence.\"]\n\t\tRodel: Pardon the damp weight, keeper. Brought this smooth river stone from my northern shore.\n\t\tRodel: Set it beside your register. My bamboo bank and your awning feel like a real harbor now.\n\t\tRodel: You remembered Litao when nobody inland bothered, and now the creek smells fresh again.\n\t\tRodel: Word travels along the water when Reyna Mayari prepares to weigh your Lola's ledger.\n\t\tRodel: When that Pale Queen steps up to your wood, the Litao of the northern tides stands beside your counter.\n\t\t- Honored to keep the stone, Rodel.\n\t\t\tRodel: And honored to call this dry concrete street home, keeper.\n\t\t- Glad Karimlan finally feels like shore.\n\t\t\tRodel: Every good harbor begins with one steady lantern, keeper.\n\t\tRodel: Now pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], my friend.\n\telif {Transaction_Tally} >= 1:\n\t\t[signal arg=\"outcome:coastal_envoy\"]\n\t\t[signal arg=\"note:Rodel settled warmly into Karimlan as a courteous coastal regular tending the creek.\"]\n\t\tRodel: Dayu-dayu, keeper. The creek bamboo has grown tall and shaded, and inland life feels kinder lately.\n\t\tRodel: Thank you for keeping your counter patient with a stranger learning how land folk live.\n\t\t- Always welcome at this counter, Rodel.\n\t\t\tRodel: Salamat, keeper. Your awning remains the coolest roof on the road.\n\t\t- Keep the creek shade safe for us.\n\t\t\tRodel: With pleasure, keeper. No stray litter touches those banks.\n\t\tRodel: Let me purchase [color=#0f6e2f]{Transaction_ItemWants}[/color] before returning to the creek.\n\telse:\n\t\t[signal arg=\"outcome:drifting_tide\"]\n\t\t[signal arg=\"note:Rodel remained a polite passing outsider gathering supplies before heading back toward the coast.\"]\n\t\tRodel: Dayu-dayu, keeper. My inland errand is nearly done.\n\t\tRodel: This town moves briskly and forgets quickly, so I shall head back toward salt water soon.\n\t\t- Safe journey back to the coast.\n\t\t\tRodel: Salamat, keeper. May steady currents guide your trade.\n\t\t- What can I get you?\n\t\t\tRodel: Courteous and brisk to the last.\n\t\tRodel: Just [color=#0f6e2f]{Transaction_ItemWants}[/color] for the road, salamat.\n\t[end_timeline]\n\nlabel Talk\nRodel: Take your time, keeper. Tides never hurry, and neither shall I.\n- Almost got it, Rodel.\n\t[end_timeline]\n- Sorry Rodel, we're out of stock.\n\tRodel: No trouble. Even the sea has low tide. I shall return another pass.\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tRodel: Salamat, keeper. I shall wait calmly for the remainder.\nelif {Variation} == 2.0:\n\tRodel: Received with thanks. No rush on what remains.\nelse:\n\tRodel: A fine start. Take your time gathering the rest.\n[end_timeline]\n\nlabel SubstituteItem\n[signal arg=\"flag:rodel_sub_water=true\"]\n[signal arg=\"tally:+1\"]\n[signal arg=\"note:Handed Rodel cold {Transaction_SubstituteItemName} instead of dry land packs, easing his coastal homesickness.\"]\nRodel: Wait, keeper.\nRodel: You set [color=#0f6e2f]{Transaction_SubstituteItemName}[/color] on the wood instead of dry rations?\nRodel: Cold as creek water beneath swaying bamboo!\nRodel: You did not ask me to dry out just to look like an inlander.\nRodel: Salamat, keeper. Keep the extra coins with my gratitude.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_StoryGouged}:\n\tRodel: Steep toll for an inland crossing, keeper.\n\tRodel: I shall pay fairly, though I hope calmer rates return next pass.\nelse:\n\tRodel: Salamat, keeper. May steady currents guide your counter.\n\tif {Global_TipActive}:\n\t\tRodel: A fair trade deserves fair measure. Please keep the surplus coins.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nRodel: Pardon me, keeper, my inland eye may be young, though that is not what I requested.\n[end_timeline]\n", "purchase": "# Rodel - Unified Everyday Purchase Timeline (3-Slot Sandwich Pattern)\n# Shifts ONLY on meaningful story flags (Flag_RodelRememberedAnito / Flag_RodelSubWater).\n# Voice: Courteous, slightly formal Ilokano Litao water anito. Zero time-of-day words. Zero em-dashes.\n\nlabel Greeting\n# Slot 1: P1-P3 Reactive Opener or High-Price Remark\nif {Transaction_HasReactiveOpener}:\n\tRodel: {Transaction_ReactiveOpener}\nelif {Global_HighPriceActive}:\n\tRodel: Steep tide on your price tags, keeper. I shall measure my coins with care.\n\n# Slot 2: Upfront Utang Ask OR Flag-Driven Request Pool (4 grounded variations per state)\nif {Transaction_WantsDebt}:\n\tRodel: Pardon me, keeper. I reached for [color=#0f6e2f]{Transaction_ItemWants}[/color] and brought smooth sea shells instead of paper pesos.\n\tRodel: Might you record my name in your lista until my next walk up from the creek?\n\t- Sure Rodel, on the lista.\n\t\t[signal arg=\"utang_accepted\"]\n\t\tRodel: Salamat, keeper. Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever your hands are free.\n\t- Sorry Rodel, cash only right now.\n\t\t[signal arg=\"utang_rejected\"]\n\t\tRodel: Fair custom, keeper. I shall return to the bamboo clump for proper inland coins.\nelif {Flag_RodelRememberedAnito}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tRodel: Dayu-dayu, keeper. Calm breeze down by the creek bamboo. May I get [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telif {Transaction_GreetingVar} < 50:\n\t\tRodel: Two neighbors greeted me by name on the walk over. Let me buy [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n\telif {Transaction_GreetingVar} < 75:\n\t\tRodel: Your counter feels like a steady shore, keeper. Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telse:\n\t\tRodel: Exact inland coins ready on the wood. [color=#0f6e2f]{Transaction_ItemWants}[/color], salamat.\nelif {Flag_RodelSubWater}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tRodel: Your cold shelves ease this dry concrete road, keeper. May I purchase [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telif {Transaction_GreetingVar} < 50:\n\t\tRodel: Dayu-dayu, keeper. Stopping up from the creek for [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telif {Transaction_GreetingVar} < 75:\n\t\tRodel: Still marveling at your neat inland packaging. Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n\telse:\n\t\tRodel: Polite greeting to the counter. Let me take [color=#0f6e2f]{Transaction_ItemWants}[/color].\nelse:\n\tif {Transaction_GreetingVar} < 25:\n\t\tRodel: Dayu-dayu, keeper. Dry crossing from the creek. May I buy [color=#0f6e2f]{Transaction_ItemWants}[/color]?\n\telif {Transaction_GreetingVar} < 50:\n\t\tRodel: Pardon the damp hem, keeper. I am hoping for [color=#0f6e2f]{Transaction_ItemWants}[/color].\n\telif {Transaction_GreetingVar} < 75:\n\t\tRodel: Your shelves are neatly kept. Pass me [color=#0f6e2f]{Transaction_ItemWants}[/color] when you are ready.\n\telse:\n\t\tRodel: Inland coins counted properly this pass. [color=#0f6e2f]{Transaction_ItemWants}[/color], please.\n[end_timeline]\n\nlabel Talk\nRodel: No hurry, keeper. Still hoping for [color=#0f6e2f]{Transaction_ItemWants}[/color] whenever your hands are free.\n- Coming right up, Rodel.\n\t[end_timeline]\n- Sorry Rodel, we're out of stock.\n\tRodel: Even full rivers run shallow at times. I shall check back another pass.\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tRodel: Salamat, keeper. Still waiting politely on [color=#0f6e2f]{Transaction_ItemWants}[/color].\nelif {Variation} == 2.0:\n\tRodel: Received with thanks. Just [color=#0f6e2f]{Transaction_ItemWants}[/color] remaining.\nelse:\n\tRodel: Fine start. Take your time with [color=#0f6e2f]{Transaction_ItemWants}[/color], keeper.\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_WantsDebt}:\n\tRodel: Salamat, keeper. Spell Litao cleanly beside my name on your lista.\nelse:\n\tif {Global_TipActive}:\n\t\tRodel: Fair measure deserves fair return. Please keep the extra coins, keeper.\n\telif {Transaction_SatisfyVar} < 34:\n\t\tRodel: Salamat, keeper. May calm water keep your house steady.\n\telif {Transaction_SatisfyVar} < 67:\n\t\tRodel: Just what I hoped for. Back to the bamboo shade I go.\n\telse:\n\t\tRodel: Always courteous service behind this wood. Thank you, keeper.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Repayment\nRodel: Proper inland currency first, keeper. Here is the {Transaction_RepaymentAmount} pesos from your lista.\n- Thanks, Rodel. All settled.\n\t[signal arg=\"repay_debt\"]\n\tRodel: Clean slate, like smooth sand after high tide. Salamat.\n- Keep it, Rodel. On the house.\n\t[signal arg=\"forgive_debt\"]\n\tRodel: Wait, truly? Inland hospitality runs deeper than I guessed. Salamat, keeper.\n- No rush, Rodel. Next pass.\n\t[signal arg=\"defer_repay\"]\n\tRodel: Patient as a deep current. I shall keep these pesos dry until next visit.\n[end_timeline]\n\nlabel WrongItem\nRodel: Pardon me, keeper, I believe I asked for [color=#0f6e2f]{Transaction_ItemWants}[/color].\n[end_timeline]\n", "visit": "# Rodel - Unified Social Visit & Inland Curiosity Timeline\n# Voice: Courteous, slightly formal Ilokano Litao water anito. Zero time-of-day words. Zero em-dashes.\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tRodel: {Transaction_ReactiveOpener}\nif {Transaction_VisitVar} < 34:\n\tRodel: Dayu-dayu, keeper. Stepping out of the sun to rest beneath your awning.\n\tRodel: Strange how concrete holds heat long after river stones would have cooled.\nelif {Transaction_VisitVar} < 67:\n\tRodel: Just passing up from the creek bamboo, keeper. Your counter stays remarkably orderly.\n\tRodel: Inland folk hang sachets in neat rows like drying fishing nets. Quite clever.\nelse:\n\tRodel: No errand this pass, keeper. Only paying polite respect to a welcoming threshold.\n\tRodel: The wind off the creek almost smelled like northern salt earlier.\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Smalltalk\nif {Transaction_VisitVar} < 34:\n\tRodel: Good shade beneath your roof. I shall return to the bamboo bank now.\nelif {Transaction_VisitVar} < 67:\n\tRodel: Always a quiet pleasure observing inland trade. Take care, keeper.\nelse:\n\tRodel: Dayu-dayu, keeper. May your shelves stay full and your road calm.\n[end_timeline]\n"}, "sarimanok": {"story": "# Sarimanok - 6-Chapter Core Arc (Pair 2 - Character #2)\n# Voice (Approved Exception): Ba-kawk! variations ONLY + punchy, playful, show-not-tell parentheticals.\n# Rules: Zero Cluck/Bawk. Zero time-of-day words. Zero em-dashes. Zero ellipses. Zero [pause] tags.\n# Substitute Category: can ONLY in Ch. 3 (decided via dialogue choice -> allow_sub_cat:can).\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tSarimanok: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} == 0.0:\n\t# Chapter 1: \"The Arrival\" (Visit Only — iconic spontaneous zero-choice exit!)\n\tSarimanok: [shake]BA-KAAWK!![/shake]\n\t[signal arg=\"story_success\"]\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2: \"The Royal Inspection\" (Tally Inflection #1: +1 respect / 0 dry joke / -1 pluck feather)\n\tSarimanok: [shake]Ba-kawk![/shake] (Spits a shiny coin onto your wood. Polishes it twice with one wing.)\n\tSarimanok: Ba-kawk? (Squints up at your bare awning. Zero royal banners? Bold choice.)\n\tSarimanok: [shake]Ba-kawk![/shake] (Jabs its beak at [color=#0f6e2f]{Transaction_ItemWants}[/color]. Taps one impatient talon.)\n\t- Welcome, honored guest. Best stock ready.\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Greeted Sarimanok with genuine courtesy instead of chasing it for luck or photos.\"]\n\t\tSarimanok: Ba-kawk! (Puffs its chest two sizes up. Slides the coin closer.)\n\t- Sorry, fresh out of red carpets.\n\t\t[signal arg=\"note:Joked dryly about having no royal banners for Sarimanok's counter inspection.\"]\n\t\tSarimanok: Ba-kawk. (Slow, judgmental blink. Nudges the coin over anyway.)\n\t- Can I pluck one lucky feather?\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Asked Sarimanok for a lucky feather, earning an outraged wing-slap on the counter.\"]\n\t\tSarimanok: [shake]BA-KAAWK!![/shake] (Slaps both wings on the wood. Your receipt pad goes flying.)\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3: \"Heavy Plumes\" (Tally Inflection #2: +1 fish can sub OR +1 safe haven / -1 living billboard)\n\tSarimanok: [shake]Ba-kawk![/shake] (Dives behind your candy jars. One bent tail feather still sticks straight up.)\n\tSarimanok: ba-kawk. (Peeks past the lids as folks outside yell Lucky Rooster!)\n\tSarimanok: Ba-kawk. (Drops two dull coins and nudges them toward [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\t- [Slide a gleaming fish can instead.]\n\t\t[signal arg=\"allow_sub_cat:can\"]\n\t\tSarimanok: Ba-kawk? (Tracks your hand drifting past the packs toward the shiny tins.)\n\t\t[end_timeline]\n\t- Stay behind the jars. No photos.\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Let Sarimanok catch its breath behind the candy jars away from feather-chasing crowds.\"]\n\t\tSarimanok: ba-kawk. (Flattens its crooked plume. Leans one wing against the warm glass.)\n\t\tSarimanok: Ba-kawk. (Taps politely beside [color=#0f6e2f]{Transaction_ItemWants}[/color], finally breathing easy.)\n\t- Pose by my sign for customers?\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Asked Sarimanok to pose by the storefront sign like a lucky mascot.\"]\n\t\tSarimanok: [shake]BA-KAAWK!![/shake] (Turns its back completely. Back-kicks its coins across the counter.)\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4: \"Bamboo in the Crest\" (Tally Inflection #3: +2 trapdoor / +1 kind / -1 vain — single Rodel crossover)\n\tSarimanok: [shake]Ba-kawk![/shake] (Two green bamboo leaves stick straight out of its royal crest. Pretends it is high fashion.)\n\tSarimanok: ba-kawk. (Glances toward the creek, then nudges one shiny coin toward the corner where Rodel stood.)\n\tSarimanok: Ba-kawk. (Points one sharp wingtip at [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\tif {Flag_RodelShelteredBird} or {Flag_RodelNameRemembered}:\n\t\t- Nobody knows his name. Help them see.\n\t\t\t[signal arg=\"flag:smk_honored_rodel=true\"]\n\t\t\t[signal arg=\"tally:+2\"]\n\t\t\t[signal arg=\"note:Nudged Sarimanok to use its fame to make sure neighbors learn Rodel's Litao name.\"]\n\t\t\tSarimanok: Ba-kawk! (Tilts its jeweled head, puffs twice its size, and gives one decisive regal nod.)\n\t- Nice having a quiet neighbor, huh?\n\t\t[signal arg=\"flag:smk_honored_rodel=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\t[signal arg=\"note:Noticed Sarimanok appreciating Rodel's quiet bamboo shade without any photo-seekers.\"]\n\t\tSarimanok: ba-kawk. (Tucks one bamboo leaf slightly neater behind its ear-plume. Soft wing-pat on the wood.)\n\t- Brush those cheap leaves off, royalty.\n\t\t[signal arg=\"tally:-1\"]\n\t\t[signal arg=\"note:Told Sarimanok to shake off the bamboo leaves and keep up its royal appearances.\"]\n\t\tSarimanok: [shake]BA-KAAWK!![/shake] (Shakes the leaves off violently, glaring down its beak at the floor.)\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5: \"Quiet Perch\" (0 tallies - Sarimanok's OWN Ten Payoff)\n\tif {Flag_SmkHonoredRodel} or {Flag_RodelShelteredBird}:\n\t\tSarimanok: [shake]Ba-kawk![/shake] (Struts right up in full view. Zero bent feathers. Zero hiding behind jars.)\n\t\tSarimanok: ba-kawk. (Waves one bright wing at a passing kid. Nobody tries to pluck its tail!)\n\t\tSarimanok: Ba-kawk. (Drops exact gleaming coins in a neat row for [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\t\t- Finally stopped hiding behind the jars?\n\t\t\tSarimanok: Ba-kawk! (Puffs its chest proudly. Pretends it never hid there once.)\n\t\t- Fancy bamboo look suits you.\n\t\t\tSarimanok: ba-kawk. (Angles its crest toward the candy jar glass to admire the leaf.)\n\t\t- Glad the street calmed down.\n\t\t\tSarimanok: Ba-kawk. (One warm, unhurried blink. Sets a talon beside the coin stack.)\n\telse:\n\t\tSarimanok: Ba-kawk. (Darts under your awning, checks both corners for fans, and slides coins for [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\t\t- Coast is clear under my roof.\n\t\t\tSarimanok: ba-kawk. (Drops its shoulders half an inch and waits behind the register.)\n\t\t- Tough life being famous.\n\t\t\tSarimanok: [shake]Ba-kawk![/shake] (Aggressive feather-fluff. Clearly agrees.)\n\t[end_timeline]\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6: \"The Crown's Word\" (Accumulated Tally Resolution -> Single Spoken Blessing on Best Outcome!)\n\tif {Flag_SmkHonoredRodel} and {Transaction_Tally} >= 3:\n\t\t[signal arg=\"outcome:living_emblem\"]\n\t\t[signal arg=\"flag:smk_living_emblem=true\"]\n\t\t[signal arg=\"note:Sarimanok laid a golden okir feather by the register and spoke two rare words of blessing before Mayari's Convergence.\"]\n\t\tSarimanok: ba-kawk. (Lays one gleaming golden okir feather beside your register. Clears its throat once.)\n\t\tSarimanok: A humble counter needs no banners when it remembers every guest's true name.\n\t\tSarimanok: When the Pale Moon weighs your ledger, my wings stand beside this house.\n\t\tSarimanok: [shake]Ba-kawk.[/shake] (Snaps its beak shut. Stares straight ahead, pretending it never spoke a word.)\n\t\t- Wait, did you just talk?!\n\t\t\tSarimanok: [shake]BA-KAAWK!![/shake] (Outraged innocence. Jabs aggressively at [color=#0f6e2f]{Transaction_ItemWants}[/color]!)\n\t\t- [Tuck the golden feather by the ledger.]\n\t\t\tSarimanok: ba-kawk. (One tiny, satisfied crest nod toward [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\telif {Transaction_Tally} >= 1:\n\t\t[signal arg=\"outcome:proud_patron\"]\n\t\t[signal arg=\"note:Sarimanok left a bright plume and became a delighted, dramatic regular at the counter.\"]\n\t\tSarimanok: [shake]Ba-kawk![/shake] (Leaves a bright golden plume beside your coin jar like a five-star rating.)\n\t\tSarimanok: ba-kawk. (Taps two polished coins neatly on the wood for [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\t\t- Five-star review from royalty?\n\t\t\tSarimanok: Ba-kawk! (Puffs its chest proudly. Expects top-shelf service.)\n\t\t- Coming right up, Your Majesty.\n\t\t\tSarimanok: ba-kawk. (Approving crest tilt.)\n\telse:\n\t\t[signal arg=\"outcome:passing_spectacle\"]\n\t\t[signal arg=\"note:Sarimanok remained an aloof, dramatic visitor who kept its distance.\"]\n\t\tSarimanok: [shake]BA-KAAWK!![/shake] (Drops exact coins from beak height. Zero eye contact.)\n\t\tSarimanok: Ba-kawk. (Points one talon sharply at [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\t[end_timeline]\n\nlabel Talk\nSarimanok: Ba-kawk. (Paces three steps left, three steps right. Eyes locked on [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n- Grabbing it right now.\n\tSarimanok: Ba-kawk. (Folds both wings behind its back like a tiny king.)\n\t[end_timeline]\n- Sorry, we're out of stock.\n\tSarimanok: [shake]BA-KAAWK!![/shake] (Flares its collar feathers and launches off in a cloud of gold dust.)\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tSarimanok: Ba-kawk. (Tucks item one under a wing. Taps its beak for the rest.)\nelif {Variation} == 2.0:\n\tSarimanok: Ba-kawk! (Approves with one sharp nod. Points back at the shelf.)\nelse:\n\tSarimanok: Ba-kawk, ba-kawk. (Counts on its talons. Clearly not done yet.)\n[end_timeline]\n\nlabel SubstituteItem\n[signal arg=\"flag:smk_sub_fish=true\"]\n[signal arg=\"tally:+1\"]\n[signal arg=\"note:Slid a gleaming tin of {Transaction_SubstituteItemName} to Sarimanok, honoring the real Maranao fish emblem.\"]\nSarimanok: Ba-kawk?! (Freezes mid-peck. Stares at [color=#0f6e2f]{Transaction_SubstituteItemName}[/color] like buried gold.)\nSarimanok: ba-kawk. (Taps the silver lid gently, then hoists the tin proudly in its talons.)\nSarimanok: [shake]Ba-kawk![/shake] (Bows its jeweled crest once. Slides two gleaming bonus coins over.)\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Satisfy\nif {Transaction_StoryGouged}:\n\tSarimanok: [shake]BA-KAAWK!![/shake] (Slams exact coins down one by one. Glare could melt tin.)\nelse:\n\tSarimanok: [shake]Ba-kawk![/shake] (Snatches the goods, flicks its golden tail, and struts off.)\n\tif {Global_TipActive}:\n\t\tSarimanok: Ba-kawk! (Flicks one extra shiny coin into your jar mid-strut.)\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nSarimanok: [shake]BA-KAAWK!![/shake] (Shoves it right back across the wood. Wrong order!)\n[end_timeline]\n", "purchase": "# Sarimanok - Unified Everyday Purchase Timeline (3-Slot Sandwich Pattern)\n# Shifts ONLY on meaningful story flags (Flag_SmkLivingEmblem / Flag_SmkSubFish).\n# Voice (Approved Exception): Ba-kawk! variations ONLY + punchy, playful parentheticals.\n\nlabel Greeting\n# Slot 1: P1-P3 Reactive Opener or High-Price Remark\nif {Transaction_HasReactiveOpener}:\n\tSarimanok: {Transaction_ReactiveOpener}\nelif {Global_HighPriceActive}:\n\tSarimanok: [shake]BA-KAAWK!![/shake] (Squints at your price card. Drags one coin half an inch back.)\n\n# Slot 2: Flag-Driven Request Pool (4 grounded variations per state)\nif {Flag_SmkLivingEmblem}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tSarimanok: Ba-kawk! (Stacks exact gleaming coins neatly. Nods toward [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\telif {Transaction_GreetingVar} < 50:\n\t\tSarimanok: Ba-kawk. (Hops up calmly, ignoring the street, and gestures at [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\telif {Transaction_GreetingVar} < 75:\n\t\tSarimanok: ba-kawk. (Preens one golden wingtip. Taps beside [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\telse:\n\t\tSarimanok: [shake]Ba-kawk![/shake] (Gives one regal crest bow before pointing at [color=#0f6e2f]{Transaction_ItemWants}[/color].)\nelif {Flag_SmkSubFish}:\n\tif {Transaction_GreetingVar} < 25:\n\t\tSarimanok: Ba-kawk! (Checks your fish tins first. Points sharply at [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\telif {Transaction_GreetingVar} < 50:\n\t\tSarimanok: [shake]Ba-kawk![/shake] (Buffs a coin on its feathers. Slides it over for [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\telif {Transaction_GreetingVar} < 75:\n\t\tSarimanok: ba-kawk. (Checks both shoulders for fans. Taps the wood for [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\telse:\n\t\tSarimanok: Ba-kawk. (Fluffs its okir collar neat and waits by [color=#0f6e2f]{Transaction_ItemWants}[/color].)\nelse:\n\tif {Transaction_GreetingVar} < 25:\n\t\tSarimanok: [shake]Ba-kawk![/shake] (Spits a damp coin on your wood. Jabs at [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\telif {Transaction_GreetingVar} < 50:\n\t\tSarimanok: Ba-kawk? (Checks your counter for dust. Points at [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\telif {Transaction_GreetingVar} < 75:\n\t\tSarimanok: [shake]Ba-kawk![/shake] (Flaps once, scattering receipts, and demands [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n\telse:\n\t\tSarimanok: Ba-kawk, ba-kawk. (Taps one golden talon until you grab [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n[end_timeline]\n\nlabel Talk\nSarimanok: Ba-kawk. (Drums one talon on the wood. Eyes glued to [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n- Coming right up!\n\tSarimanok: Ba-kawk. (Narrows its eyes. Times you silently.)\n\t[end_timeline]\n- Sorry, we're out of stock.\n\tSarimanok: [shake]BA-KAAWK!![/shake] (Kicks a stray wrapper off the wood and swoops out.)\n\t[signal arg=\"refuse_service\"]\n\t[end_timeline]\n\nlabel Partial\nset {Variation} = range(1,4).pick_random()\nif {Variation} == 1.0:\n\tSarimanok: Ba-kawk. (Grips item one. Jabs its beak toward [color=#0f6e2f]{Transaction_ItemWants}[/color].)\nelif {Variation} == 2.0:\n\tSarimanok: Ba-kawk! (One sharp nod. Points straight at [color=#0f6e2f]{Transaction_ItemWants}[/color].)\nelse:\n\tSarimanok: Ba-kawk, ba-kawk. (Taps the empty spot meant for [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n[end_timeline]\n\nlabel Satisfy\nif {Global_TipActive}:\n\tSarimanok: Ba-kawk! (Flicks a dazzling bonus coin in. Chest twice its size.)\nelif {Transaction_SatisfyVar} < 34:\n\tSarimanok: [shake]Ba-kawk![/shake] (Hoists the goods in one talon and swoops off.)\nelif {Transaction_SatisfyVar} < 67:\n\tSarimanok: Ba-kawk. (One approving tilt of the jeweled crest. Glides out.)\nelse:\n\tSarimanok: ba-kawk. (Smooths a tail plume. Departs like a one-bird parade.)\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel WrongItem\nSarimanok: [shake]BA-KAAWK!![/shake] (Shoves it back. Glares hard at [color=#0f6e2f]{Transaction_ItemWants}[/color].)\n[end_timeline]\n", "visit": "# Sarimanok - Unified Social Visit & Awning Perch Timeline\n# Voice (Approved Exception): Ba-kawk! variations ONLY + punchy, playful parentheticals.\n\nlabel Greeting\nif {Transaction_HasReactiveOpener}:\n\tSarimanok: {Transaction_ReactiveOpener}\nif {Transaction_VisitVar} < 34:\n\tSarimanok: Ba-kawk. (Checks its reflection in the candy jar. Fixes one crooked crest feather.)\n\tSarimanok: Ba-kawk! (Glares a noisy tricycle down the road until it leaves.)\nelif {Transaction_VisitVar} < 67:\n\tSarimanok: [shake]Ba-kawk![/shake] (Hops beside the register, ignores every shelf, and claims the shade.)\n\tSarimanok: ba-kawk. (Nudges a slightly crooked jar half an inch straighter.)\nelse:\n\tSarimanok: ba-kawk. (Tucks behind the jars with its bright tail hidden from the street.)\n\tSarimanok: Ba-kawk. (Slow royal blink. Official no-photo zone declared.)\n[signal arg=\"story_success\"]\n[end_timeline]\n\nlabel Smalltalk\nif {Transaction_VisitVar} < 34:\n\tSarimanok: Ba-kawk. (Shakes out its golden plumage once and launches to the roofs.)\nelif {Transaction_VisitVar} < 67:\n\tSarimanok: [shake]Ba-kawk![/shake] (Leaves a tiny trail of gold dust and glides off.)\nelse:\n\tSarimanok: ba-kawk. (One brief, dignified crest nod before swooping out.)\n[end_timeline]\n"}, "brahim": {"story": "label Greeting\nif {Transaction_HasReactiveOpener}:\n\tBrahim: {Transaction_ReactiveOpener}\n\nif {Transaction_Chapter} == 0.0:\n\t# Chapter 1 — \"Chalk and Bronze\" (can / frozen + minigame:talisman:1 | 0 choice tally, +1 if won)\n\tBrahim: You must be the new keeper behind Lola's counter. I am Brahim, from past the creek bridge.\n\tBrahim: I used to teach up at the University of the Cordilleras in Baguio. Moved home to apprentice under Tatay.\n\t- Big jump from Baguio lectures to herbs!\n\t\tBrahim: My fingers are still better with whiteboard markers and bluebooks than bronze brushes, honestly.\n\t- Tatay is Karimlan's albularyo, right?\n\t\tBrahim: Forty years on that porch. High time I learned his craft so his hands can rest.\n\t- Miss the Baguio fog yet?\n\t\tBrahim: Only the cool air and strong coffee! Though Karimlan's warm breeze grows on you fast.\n\tBrahim: Speaking of steady hands, want to pair up on a quick lab exercise?\n\tBrahim: This is the First Ward, a simple starter sigil for fresh bronze. Mind tracing it with me?\n\t[signal arg=\"minigame:talisman:1\"]\n\tif {Transaction_MinigameWon}:\n\t\t[signal arg=\"flag:brahim_steady_start=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\tBrahim: Top marks, shopkeeper! Clean charcoal pillar, steady crimson crossbar. Even Tatay would nod at that.\n\telse:\n\t\tBrahim: Haha, every first draft needs a little character! Still hums better than my first five attempts.\n\tBrahim: Salamat for the practice. Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color] for Tatay's kitchen too.\n\nelif {Transaction_Chapter} == 1.0:\n\t# Chapter 2 — \"Margin Notes in the Librito\" (sachet -> allow_sub_cat:bottle | Inflection #1)\n\tBrahim: Caught myself doing something ridiculous on Tatay's porch.\n\tBrahim: I started writing neat margin notes and color-coded tabs inside his handwritten librito like a course syllabus.\n\tBrahim: Tatay took one look, laughed, and told me to stop grading his orasyon and go smell actual lagundi leaves.\n\tBrahim: Old professor habits die hard! Sell me [color=#0f6e2f]{Transaction_ItemWants}[/color] so I can keep reviewing my notes.\n\t- [Swap his coffee for cold water.]\n\t\t[signal arg=\"allow_sub_cat:bottle\"]\n\t\tBrahim: Salamat! Just need a quick cup before I cross-reference the pulse chapters.\n\t- Old professor habits die hard, ha?\n\t\tBrahim: Guilty as charged. At least Tatay has a good sense of humor about my sticky notes.\n\t- Just toss the notebook aside.\n\t\t[signal arg=\"tally:-1\"]\n\t\tBrahim: Harsh critique, shopkeeper! Even folk craft deserves careful study, you know.\n\nelif {Transaction_Chapter} == 2.0:\n\t# Chapter 3 — \"What the Pulse Costs\" (can + minigame:talisman:4 | Inflection #2)\n\tBrahim: Strange visit on Tatay's porch earlier. An old acquaintance offered me five hundred pesos cash.\n\tBrahim: Wanted a private luck charm rushed ahead of the neighbors waiting in line. Called it a consultation fee.\n\tBrahim: Back at UC Baguio, guest lectures came with a stipend. Here, Tatay says fixed cash hollows out an albularyo's gift.\n\t- Trust Tatay's rule. Keep it sacred.\n\t\t[signal arg=\"tally:+1\"]\n\t\tBrahim: That settles it. Healing is a vocation answered with voluntary alay, never a price tag.\n\t- Charge a fee for your expertise.\n\t\t[signal arg=\"tally:-1\"]\n\t\tBrahim: Practical, sure. Still, something about putting a rate card on prayer feels wrong in my chest.\n\t- Tell him to wait his turn.\n\t\tBrahim: Fair enough! First come, first served, same rule as office hours.\n\tif {Flag_BrahimSteadyStart}:\n\t\tBrahim: Since your brushwork scored top marks last time, mind helping me trace Watcher's Eye for the creek bridge?\n\telse:\n\t\tBrahim: Before I head back, mind helping me trace Watcher's Eye? It keeps mischief off the creek bridge.\n\t[signal arg=\"minigame:talisman:4\"]\n\tif {Transaction_MinigameWon}:\n\t\tBrahim: Look at those fine gold lashes! Crisp as a textbook diagram, with real warmth in it.\n\telse:\n\t\tBrahim: A little wobbly around the iris, haha! No harm done, I will touch up the edges at Tatay's table.\n\tBrahim: Salamat, friend. Let me pick up [color=#0f6e2f]{Transaction_ItemWants}[/color] for dinner too.\n\nelif {Transaction_Chapter} == 3.0:\n\t# Chapter 4 — \"Cold Draft by the Guardrail\" (pack + Moral Talisman Choice | Inflection #3)\n\tBrahim: Neighbors reported sudden cold spots and melted candle wax near the highway waiting shed.\n\tBrahim: Tatay's knees are swollen, so I am handling this solo. Sounds like a restless kaperosa by the bend.\n\tif {Flag_RosalynSeen} or {Flag_DaniloSawRosalyn}:\n\t\t- Wait. That is Rosalyn, she is harmless!\n\t\t\tBrahim: You know her? She visits your counter? Hold on, that changes my entire plan!\n\t\t- Sounds cold out by that guardrail.\n\t\t\tBrahim: Freezing, according to the tricycle drivers. Still, I do not want to hurt anyone by mistake.\n\tBrahim: I have two bronze blanks ready. Either a warm guiding lantern, or a strict wind barrier to clear the road.\n\t- Craft a warm lantern to guide.\n\t\t[signal arg=\"flag:brahim_lantern_ward=true\"]\n\t\t[signal arg=\"tally:+1\"]\n\t\tBrahim: Suki's Lantern. Crimson frame, gold core, indigo tassel. Help me trace it steady, friend.\n\t\t[signal arg=\"minigame:talisman:7\"]\n\t\tif {Transaction_MinigameWon}:\n\t\t\t[signal arg=\"tally:+1\"]\n\t\t\tBrahim: Look at that gold core glow! Gentle enough to steady a shy soul without pushing her away.\n\t\telse:\n\t\t\tBrahim: A bit uneven on the tassel, yet the warmth still holds. She will feel welcome, not chased.\n\t- Seal the road so she leaves.\n\t\t[signal arg=\"flag:brahim_lantern_ward=false\"]\n\t\t[signal arg=\"tally:-1\"]\n\t\tBrahim: Wind Shield it is. Strict charcoal crest and indigo chevron to close off the guardrail.\n\t\t[signal arg=\"minigame:talisman:10\"]\n\t\tif {Transaction_MinigameWon}:\n\t\t\tBrahim: Sharp, clean barrier. Nothing restless will linger by that shed for long.\n\t\telse:\n\t\t\tBrahim: Rough edges, still heavy enough to push the cold draft back from the road.\n\tBrahim: Salamat for the brushwork. Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color] before I walk over to the bend.\n\nelif {Transaction_Chapter} == 4.0:\n\t# Chapter 5 — \"Smoke and Still Water\" (can | 0 tallies — Ten Payoff!)\n\tif {Flag_BrahimLanternWard} and {Flag_DaniloTracedTether}:\n\t\tBrahim: You will not believe what happened when I hung Suki's Lantern by the waiting shed!\n\t\tBrahim: That laid-back guy from your bench walked over, squinted past the mist, and pointed straight across the creek.\n\t\tBrahim: He traced her tether two towns out so I knew exactly where to aim Tatay's calming orasyon!\n\telif {Flag_BrahimLanternWard}:\n\t\tBrahim: Suki's Lantern worked like magic by the guardrail. The cold mist warmed right up without hurting a soul.\n\t\tBrahim: Tatay squeezed my shoulder when I got back and did not correct a single line in my notes.\n\telse:\n\t\tBrahim: The barrier ward cleared the highway bend, sure. The air went dead quiet right away.\n\t\tBrahim: Still sits heavy in my chest, honestly. Feels like I solved a symptom and missed the person underneath.\n\t- You listened instead of forcing it.\n\t\tBrahim: Funny how the best lessons in Karimlan happen when I finally close my notebook.\n\t- Sounds like Tatay would be proud.\n\t\tBrahim: He even poured me fresh lagundi tea without lecturing me once. High praise!\n\t- Glad the highway bend is quiet.\n\t\tBrahim: Quiet and safe, that is what matters.\n\tBrahim: Let me grab [color=#0f6e2f]{Transaction_ItemWants}[/color] for Tatay's porch.\n\nelif {Transaction_Chapter} == 5.0:\n\t# Chapter 6 — \"Tatay's Brass Bell\" (pack + minigame:talisman:20 Grand Agimat | Accumulated Tally Resolution)\n\tif {Flag_BrahimLanternWard} and {Transaction_Tally} >= 3.0:\n\t\t[signal arg=\"outcome:true_albularyo\"]\n\t\tBrahim: Tatay handed me his worn brass bell earlier. Said his hands are ready to rest and mine are ready to carry it.\n\t\tBrahim: Before I ring it for the barangay, I want us to trace one masterwork ward fo
